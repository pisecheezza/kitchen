<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>바로크 궁전풍 아코디언 편지 메뉴</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1512;
            color: #e6d5b8;
            font-family: 'Georgia', serif;
            height: 200vh;
        }

        /* 1. 스티키 햄버거 버튼 */
        .sticky-hamburger {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            border: 2px solid #5a3d02;
            color: #2c1d0c;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border-radius: 4px;
            transition: transform 0.2s, background 0.3s;
        }

        .sticky-hamburger:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffd700, #fff8dc, #ffd700);
        }

        /* 2. 편지 메뉴 컨테이너 */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px;
            width: 260px;
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 30px;
        }

        /* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
        .frame-container {
            position: relative;
            background-color: #f4ebd0; /* 양피지 질감 배경 */
            color: #3b220c;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
        }

        .frame-container::after {
            content: "";
            position: absolute;
            top: -35px;
            left: -35px;
            right: -35px;
            bottom: -35px;
            border-image-source: url('frame.png');
            border-image-slice: 20%;
            border-width: 45px;
            border-style: solid;
            border-image-repeat: round;
            z-index: 10;
            pointer-events: none;
        }

        /* 4. 메뉴 내용 및 소분류 디자인 */
        .frame-container h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
            position: relative;
            z-index: 11;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 11;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 소분류 (아코디언) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        .royal-menu-item.active .submenu {
            max-height: 200px;
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

        .content-body {
            padding: 120px 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <button class="sticky-hamburger" onclick="toggleRoyalMenu()">
        <span>📜 칙서</span>
    </button>

    <div class="royal-menu-container" id="royalMenu">
        <div class="frame-container">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 왕실 내무부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 예산 편성 및 결산</a></li>
                        <li><a href="#">- 연회 및 행사 기획</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 왕국 외교부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 조약 문서 보관소</a></li>
                        <li><a href="#">- 사절단 접견 일정</a></li>
                        <li><a href="#">- 동맹국 현황 보고</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 기사단 현황 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 경비대 성문 배치</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <div class="content-body">
        <h1>왕국의 대서사시</h1>
        <p>좌측 상단의 <b>[📜 칙서]</b> 버튼을 눌러 확인해 보세요.</p>
    </div>

    <script>
        function toggleRoyalMenu() {
            const menu = document.getElementById('royalMenu');
            menu.classList.toggle('open');
        }

        function toggleSubmenu(menuId) {
            const item = document.getElementById(menuId);
            item.classList.toggle('active');
        }
    </script>

</body>
</html>
