<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>바로크 궁전풍 아코디언 편지 메뉴</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1512;
            color: #e6d5b8;
            font-family: 'Georgia', serif;
            height: 200vh;
        }

        /* 1. 스티키 햄버거 버튼 */
        .sticky-hamburger {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            border: 2px solid #5a3d02;
            color: #2c1d0c;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border-radius: 4px;
            transition: transform 0.2s, background 0.3s;
        }

        .sticky-hamburger:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffd700, #fff8dc, #ffd700);
        }

        /* 2. 편지 메뉴 컨테이너 (화면을 덮지 않고 일부만 차지) */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px; /* 평소 숨김 */
            width: 280px; /* 메뉴 크기만큼만 설정 */
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 30px;
        }

        /* 3. 액자 테두리 및 세로 반복 설정 (border-image) */
        .royal-frame {
            border-style: solid;
            border-width: 60px; /* 액자 두께 조절 */
            border-image: url('frame.png') 60 fill repeat;
            
            padding: 10px;
            box-sizing: border-box;
            background-color: #f4ebd0; /* 이미지 로딩 전후 대비용 양피지 배경 */
            color: #3b220c;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
            
            /* 내용물에 따라 높이가 유연하게 변하도록 설정 */
            display: inline-block;
            width: 100%;
        }

        .royal-frame h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        /* 대분류 버튼 스타일 */
        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 4. 소분류 (기본 접힘 상태) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        /* 소분류가 펼쳐졌을 때의 상태 */
        .royal-menu-item.active .submenu {
            max-height: 200px; /* 소분류가 들어갈 충분한 높이 */
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

        .content-body {
            padding: 120px 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 스티키 햄버거 버튼 -->
    <button class="sticky-hamburger" onclick="toggleRoyalMenu()">
        <span>📜 칙서</span>
    </button>

    <!-- 편지 메뉴 컨테이너 -->
    <div class="royal-menu-container" id="royalMenu">
        <div class="royal-frame">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <!-- 대분류 1 -->
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 왕실 내무부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 예산 편성 및 결산</a></li>
                        <li><a href="#">- 연회 및 행사 기획</a></li>
                    </ul>
                </li>
                <!-- 대분류 2 -->
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 왕국 외교부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 조약 문서 보관소</a></li>
                        <li><a href="#">- 사절단 접견 일정</a></li>
                        <li><a href="#">- 동맹국 현황 보고</a></li>
                    </ul>
                </li>
                <!-- 대분류 3 -->
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 기사단 현황 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 경비대 성문 배치</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <div class="content-body">
        <h1>왕국의 대서사시</h1>
        <p>좌측 상단의 <b>[📜 칙서]</b> 버튼을 눌러 메뉴를 열고, 대분류를 클릭해 소분류를 펼쳐보세요.</p>
        <p>소분류가 열릴 때 액자 테두리의 세로 길이가 유연하게 늘어납니다.</p>
    </div>

    <script>
        // 전체 메뉴 토글
        function toggleRoyalMenu() {
            const menu = document.getElementById('royalMenu');
            menu.classList.toggle('open');
        }

        // 개별 대분류 아코디언 토글 (소분류 열고 닫기)
        function toggleSubmenu(menuId) {
            const item = document.getElementById(menuId);
            item.classList.toggle('active');
        }
    </script>

</body>
</html>
