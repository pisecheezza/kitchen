<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금색 액자 적용</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="frame-container">
        <img src="image.png" alt="캐릭터 이미지">
    </div>

  <style>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        margin: 0;
    }

    .frame-container {
        position: relative; /* 자식 요소를 띄우거나 레이어 순서를 잡기 위한 기준점 */
        display: inline-block;
        line-height: 0;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        
        /* 기존의 border 속성들을 가상 요소로 옮기기 위해 컨테이너 자체의 border는 제거하거나 유지할 수 있습니다 */
    }

    /* 이미지를 아래로 내리고, 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
    .frame-container::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        
        /* 테두리 관련 설정 이동 */
        border-image-source: url('border.png');
        border-image-slice: 26%;
        border-width: 150px;
        border-style: solid;
        border-image-repeat: round;
        
        z-index: 10; /* 이미지만큼 위로 뜨도록 설정 */
        pointer-events: none; /* 테두리가 마우스 클릭을 방해하지 않도록 설정 */
    }

    .frame-container img {
        display: block;
        height: auto;
        position: relative;
        z-index: 1; /* 이미지를 뒤로 배치 */
    }
  </style>
  </style>

</body>
</html>
