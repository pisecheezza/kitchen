<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금색 액자 적용</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer-wrap">
        <div class="frame-container">
            <img src="image.png" alt="캐릭터 이미지">
        </div>
    </div>

  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: black;
        margin: 0;
    }
    
    .outer-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 75px; 
    }

    .frame-container {
        position: relative; 
        display: inline-block;
        line-height: 0;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    } /* 💡 빠져 있던 frame-container의 닫는 중괄호 추가 */

    /* 이미지를 아래로 내리고, 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
    .frame-container::after {
        content: "";
        position: absolute;
        /* 테두리 두께(150px)의 절반인 -75px로 설정하여 이미지 주변을 감싸도록 수정 */
        top: -75px;
        left: -75px;
        right: -75px;
        bottom: -75px;
        
        border-image-source: url('border.png');
        border-image-slice: 26%;
        border-width: 150px;
        border-style: solid;
        border-image-repeat: round;
        
        z-index: 10; 
        pointer-events: none; 
    }

    .frame-container img {
        display: block;
        width: 400px; /* 이미지 크기가 지정되어 있어야 모양이 안정적으로 잡힙니다 */
        height: auto;
        position: relative;
        z-index: 1; 
    }
  </style>
</body>
</html>
