<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금색 액자 적용</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="outer-wrap">
    <div class="frame-container">
        <img src="image.png" alt="캐릭터 이미지">
    </div>
</div>
  <style>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: black;
        margin: 0;
    }
    .outer-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        /* 음수 값으로 밖으로 튀어나간 테두리 크기만큼 부모에게 여백(margin/padding)을 주어 
           정중앙 계산 시 테두리 영역까지 완벽하게 포함되도록 합니다. */
        padding: 75px; 
    }

    .frame-container {
        position: relative; /* 자식 요소를 띄우거나 레이어 순서를 잡기 위한 기준점 */
        display: inline-block;
        line-height: 0;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);

    /* 이미지를 아래로 내리고, 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
    .frame-container::after {
        content: "";
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        
        /* 테두리 관련 설정 이동 */
        border-image-source: url('border.png');
        border-image-slice: 26%;
        border-width: 150px;
        border-style: solid;
        border-image-repeat: round;
        
        z-index: 10; /* 이미지만큼 위로 뜨도록 설정 */
        pointer-events: none; /* 테두리가 마우스 클릭을 방해하지 않도록 설정 */
    }

    .frame-container img {
        display: block;
        height: auto;
        position: relative;
        z-index: 1; /* 이미지를 뒤로 배치 */
    }
  </style>
  </style>

</body>
</html>
