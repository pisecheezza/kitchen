<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  
<style>

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5); /* 어두운 반투명 배경 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 80px;
  height: auto;
}
    
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    justify-content: center;
    background-color: black;
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* 가로 스크롤 방지 */
}  

/* [1] 전체 화면 래퍼 */
.marquee-container {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    width: 100%;
    flex: 1; /* 남은 공간을 채우도록 수정 */
}

/* [2] 흐르는 띠 컨테이너 */
.outer-wrap {
    display: flex;
    align-items: center;
    gap: 120px;
    width: max-content;
    animation: scrollLeftToRight 35s linear infinite;
}

.outer-wrap:hover {
    animation-play-state: paused;
}

@keyframes scrollLeftToRight {
    0% {
        transform: translateX(-50%);
    }
    100% {
        transform: translateX(0);
    }
}

/* [3] 각 이미지 액자 컨테이너 */
.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    
    /* 애니메이션 초기 상태 */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* [4] border-image 테두리 가상 요소 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

/* [5] 이미지 태그 크기 강제 고정 및 반응형 안정화 */
.frame-container img {
    display: block;
    position: relative;
    z-index: 1;
    
    width: 380px;   /* 데스크톱에서 안정적인 기본 크기 확보 */
    height: auto;   /* 비율 유지 */
    object-fit: cover;
}

/* 모바일 화면 대응 */
@media (max-width: 768px) {
    .outer-wrap {
        gap: 80px;
    }
    
    .frame-container img {
        width: 240px; /* 모바일 화면에 맞게 이미지 크기 축소 */
    }
    
    /* 모바일에서는 테두리 두께와 여백을 살짝 줄여 이미지 잘림 방지 */
    .frame-container::after {
        top: -30px;
        left: -30px;
        right: -30px;
        bottom: -30px;
        border-width: 40px;
    }
}

  
.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    
    /* 앤티크 실버 그라데이션 (차분하고 기품 있는 은빛 색상) */
    background: transparent;
    border: transparent;
    color: #2c3038;
    text-shadow: 0 0 white;
    /* 사이즈를 작게 조정 */
    padding: 8px 10px;
    font-size: 20px;
    line-height: 1;
    
    cursor: pointer;
    
/* -- 수정 부분: 버튼식 입체 음영(inset)을 완전히 제거 -- */
    box-shadow: none; 
    
    /* 혹시 모를 외곽 테두리 반경 제거 */
    border-radius: 0;
    
    transition: all 0.3s ease;
}

.sticky-hamburger:hover {
    transform: translateY(-2px);
    /* 배경색 변함 없음 (유지) */
    background: transparent;
    
    /* -- 수정 부분: 호버 시에도 입체 음영(inset)이 생기지 않도록 제거 -- */
    box-shadow: none;
}

.sticky-hamburger:active {
    transform: translateY(0);
}
/* 기본 상태 (닫혀있을 때) */
.sticky-hamburger::before {
    content: "🔔"; /* 흰 별 */
}

/* 메뉴가 열렸을 때 (부모나 버튼에 active 또는 open 클래스가 붙을 때) */
.sticky-hamburger.active::before {
    content: "🧐"; /* 검은 별 */
    color: #000000;
}

/* 2. 편지 메뉴 컨테이너 */
.royal-menu-container {
    position: fixed;
    top: 90px;
    left: -320px;
    width: 150px;
    z-index: 999;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

.royal-menu-container.open {
    left: 40px;
}

/* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
.royal-scroll-sheet {
    position: relative;
    background-image: url('oh.png');
    background-size: 135px 350px; /* 패턴의 크기 조절 (필요에 따라 수정) */
    color: #2c3038;
    padding: 20px 15px;
    box-sizing: border-box;
    box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
}

.royal-scroll-sheet::after {
    content: "";
    position: absolute;
    top: -40px;
    left: -35px;
    right: -35px;
    bottom: -40px;
    border-image-source: url('tray.png');
    border-image-slice: 20%;
    border-width: 55px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10;
    pointer-events: none;
}

/* 4. 메뉴 내용 및 소분류 디자인 */
.royal-scroll-sheet h2 {
    text-align: center;
    font-size: 16px;
    border-bottom: 2px solid #88929b;
    padding-bottom: 5px;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    color: #3a3f47;
    position: relative;
    z-index: 11;
}

.royal-menu-list {
    list-style: none;
    padding: 0;
    margin: 0;
    position: relative;
    z-index: 11;
}

.royal-menu-item {
    margin-bottom: 8px;
}

.menu-toggle-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px dashed #adb5bd;
    color: #2c3038;
    font-weight: bold;
    font-size: 14px;
    font-family: 'Georgia', serif;
    padding: 6px 4px;
    cursor: pointer;
    box-sizing: border-box;
}

.menu-toggle-btn:hover {
    color: #495057;
    background-color: rgba(136, 146, 155, 0.15);
}

/* 소분류 (아코디언) */
.submenu {
    list-style: none;
    padding-left: 15px;
    margin: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, padding 0.3s ease;
    border-left: 2px solid #88929b;
}

.royal-menu-item.active .submenu {
    max-height: 200px;
    padding-top: 5px;
    padding-bottom: 5px;
    transition: max-height 0.4s ease-in;
}

.submenu li a {
    color: #4a515a;
    text-decoration: none;
    font-size: 12px;
    display: block;
    padding: 3px 0;
}

.submenu li a:hover {
    color: #2c3038;
    text-decoration: underline;
}

</style>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const frameContainers = document.querySelectorAll('.frame-container');

    // Intersection Observer를 사용하여 스크롤 시 화면에 들어올 때 .show 클래스 추가
    const observerOptions = {
        root: null, // 뷰포트 기준
        rootMargin: '0px',
        threshold: 0.1 // 요소가 10% 정도 보일 때 실행
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
                // 한 번 나타난 이후에는 관찰을 멈추고 싶다면 아래 주석을 해제하세요
                // observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    frameContainers.forEach(container => {
        observer.observe(container);
    });
});
  </script>

<style>
:root {
    color-scheme: light dark;
    
    /* 모든 환경에 다크 포레스트 색상 적용 */
    --maze-bg: #1A2818;        
    --cell-path: #4A5A48;      
    --cell-path-text: #1A2818; 
    --wall: #0F1A0E;           
    --goal: #D4A000;           
    --popover-bg: #1A2418;     
    --popover-border: #3A4A38; 
    --btn-bg: #2A3A28;         
    --btn-hover: #3A4A38;      
    --restart-bg: #1A2A18;     
    --text-floating: #9AAA98;
}

html {
    color-scheme: light dark;
}

body, .cell, .wall, .goal, .grid-maze {
    filter: none !important;
    -webkit-filter: invert(1) hue-rotate(180deg)
}
    /* 플로팅 버튼 스타일 (우측 하단 고정) */
    .floating-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background: var(--btn-bg);
        color: var(--text-floating);
        border: none;
        border-radius: 50%;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: transform 0.2s, background 0.2s;
    }
    .floating-btn:hover {
        transform: scale(1.1);
        background: var(--btn-hover);
    }

    /* 플로팅 아이콘 옆에 뜨는 게임 팝오버 박스 */
    .game-popover {
        position: fixed;
        bottom: 95px;
        right: 20px;
        background: var(--popover-bg);
        padding: 15px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        border: 2px solid var(--popover-border);
        max-width: 360px;
        z-index: 999;
        display: none;
        animation: popIn 0.2s ease-out forwards;
    }
    .game-popover.active {
        display: block;
    }

    @keyframes popIn {
        from { opacity: 0; transform: translateY(10px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .grid-maze {
        display: grid;
        grid-template-columns: repeat(15, 18px);
        grid-template-rows: repeat(15, 18px);
        gap: 1px; 
        background: var(--maze-bg);
        padding: 6px; 
        margin: 6px auto;
        width: fit-content; 
        border-radius: 8px;
        border: 2px solid var(--popover-border);
    }
    .cell {
        width: 18px; height: 18px;
        background: var(--cell-path);
        color: var(--cell-path-text);
        border-radius: 1px;
        display: flex; align-items: center; justify-content: center;
        font-size: 11px;
    }
    .wall { 
        background: var(--wall);
        border-radius: 2px;
    }
    .goal { 
        background: var(--goal);
        border-radius: 2px;
    }

    .d-pad {
        display: grid;

        grid-template-rows: repeat(2, 40px);

    }

    /* 거대한 토스트 아이콘 (토끼 이모지) */

    /* 거대한 토스트 텍스트 */
    .toast-text {

        margin: 0;
    }

    /* 아이콘이 좌우로 흔들리는 키프레임 애니메이션 */
    @keyframes wiggle {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
        100% { transform: rotate(0deg); }
    }

    /* 모바일 대응 미디어 쿼리 (작은 화면에서는 폰트 크기 자동 조절) */
    @media (max-width: 400px) {
        .toast-icon { font-size: 90px; }
        .toast-text { font-size: 40px; }
    }
</style>
<script>
class MazeGame {
    constructor() {
        this.SIZE = 15;
        this.mazeMap = [];
        this.player = { x: 0, y: 0 };
        this.goalPos = { x: 0, y: 0 };
        this.isActive = false;
        this.init();
    }

    init() {
        this.setupDOM();
        this.setupEventListeners();
    }

    setupDOM() {
        // 플로팅 버튼과 게임 팝오버 가져오기
        this.floatingBtn = document.getElementById('floatingToggleBtn');
        this.gamePopover = document.getElementById('gamePopover');
        this.gridContainer = document.getElementById('gridMaze');
        this.restartBtn = document.getElementById('btn-restart');
        this.toastMessage = document.getElementById('toastMessage');
    }

    setupEventListeners() {
        this.floatingBtn?.addEventListener('click', () => this.toggleGame());
        this.restartBtn?.addEventListener('click', () => this.generateNew());
        
        const directions = {
            'move-up': [0, -1],
            'move-down': [0, 1],
            'move-left': [-1, 0],
            'move-right': [1, 0]
        };

        Object.entries(directions).forEach(([id, [dx, dy]]) => {
            document.getElementById(id)?.addEventListener('click', () => this.move(dx, dy));
        });

        window.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': [0, -1],
                'ArrowDown': [0, 1],
                'ArrowLeft': [-1, 0],
                'ArrowRight': [1, 0]
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                this.move(...keyMap[e.key]);
            }
        });
    }

    toggleGame() {
        this.gamePopover.classList.toggle('active');
        if (this.gamePopover.classList.contains('active')) {
            this.generateNew();
        }
    }

    generateNew() {
        this.generateProceduralMaze();
        this.player = { x: 0, y: 0 };
        this.render();
    }

    generateProceduralMaze() {
        while (true) {
            const map = Array.from({ length: this.SIZE }, () => Array(this.SIZE).fill(1));

            const carve = (x, y) => {
                map[y][x] = 0;
                [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5)
                    .forEach(([dx, dy]) => {
                        const [nx, ny] = [x + dx, y + dy];
                        if (nx >= 0 && nx < this.SIZE && ny >= 0 && ny < this.SIZE && map[ny][nx] === 1) {
                            map[y + dy / 2][x + dx / 2] = 0;
                            carve(nx, ny);
                        }
                    });
            };

            carve(0, 0);
            map[0][0] = 0;

            // 벽에 구멍 뚫기
            for (let i = 1; i < this.SIZE - 1; i++) {
                for (let j = 1; j < this.SIZE - 1; j++) {
                    if (map[i][j] === 1 && Math.random() < 0.12) {
                        map[i][j] = 0;
                    }
                }
            }

            // 목표 위치 찾기
            const goals = [];
            for (let r = this.SIZE - 4; r < this.SIZE; r++) {
                for (let c = this.SIZE - 4; c < this.SIZE; c++) {
                    if (map[r][c] === 0) goals.push({ r, c });
                }
            }

            if (goals.length > 0) {
                const goal = goals[Math.floor(Math.random() * goals.length)];
                this.goalPos = { x: goal.c, y: goal.r };
                map[goal.r][goal.c] = 2;
                this.mazeMap = map;
                break;
            }
        }
    }

    render() {
        this.gridContainer.innerHTML = '';
        this.gridContainer.style.gridTemplateColumns = `repeat(${this.SIZE}, 18px)`;

        for (let r = 0; r < this.SIZE; r++) {
            for (let c = 0; c < this.SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (this.mazeMap[r][c] === 1) {
                    cell.classList.add('wall');
                } else if (r === this.player.y && c === this.player.x) {
                    cell.innerHTML = '🦋';
                } else if (this.mazeMap[r][c] === 2) {
                    cell.classList.add('goal');
                    cell.innerHTML = '🐰';
                }
                
                this.gridContainer.appendChild(cell);
            }
        }
    }

    move(dx, dy) {
        if (!this.gamePopover.classList.contains('active')) return;

        const [nx, ny] = [this.player.x + dx, this.player.y + dy];

        if (nx >= 0 && nx < this.SIZE && ny >= 0 && ny < this.SIZE && 
            this.mazeMap[ny][nx] !== 1) {
            this.player = { x: nx, y: ny };
            this.render();

            if (this.mazeMap[ny][nx] === 2) {
                this.showToast('ツカマエタ!');
                setTimeout(() => this.generateNew(), 600);
            }
        }
    }

    showToast(message) {
        this.toastMessage.textContent = message;
        this.toastMessage.classList.add('show');
        setTimeout(() => this.toastMessage.classList.remove('show'), 1200);
    }
}

// 게임 시작
new MazeGame();
</script>
