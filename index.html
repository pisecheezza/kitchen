<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5); /* 어두운 반투명 배경 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 80px;
  height: auto;
}
    
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    width: max-content;
    gap: 120px; /* 액자 사이의 간격 (필요에 따라 조절) */
    animation: scrollLeftToRight 35s linear infinite; /* 숫자가 클수록 천천히 흐릅니다 */
}

.outer-wrap:hover {
    animation-play-state: paused;
}
  
@keyframes scrollLeftToRight {
    0% {
        transform: translateX(-50%);
    }
    100% {
        transform: translateX(0);
    }
}
  
.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    max-width: 480px;
    width: 100%; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    
    /* 앤티크 실버 그라데이션 (차분하고 기품 있는 은빛 색상) */
    background: transparent;
    border: transparent;
    color: #2c3038;
    text-shadow: 0 0 white;
    /* 사이즈를 작게 조정 */
    padding: 8px 10px;
    font-size: 20px;
    line-height: 1;
    
    cursor: pointer;
    
/* -- 수정 부분: 버튼식 입체 음영(inset)을 완전히 제거 -- */
    box-shadow: none; 
    
    /* 혹시 모를 외곽 테두리 반경 제거 */
    border-radius: 0;
    
    transition: all 0.3s ease;
}

.sticky-hamburger:hover {
    transform: translateY(-2px);
    /* 배경색 변함 없음 (유지) */
    background: transparent;
    
    /* -- 수정 부분: 호버 시에도 입체 음영(inset)이 생기지 않도록 제거 -- */
    box-shadow: none;
}

.sticky-hamburger:active {
    transform: translateY(0);
}
/* 기본 상태 (닫혀있을 때) */
.sticky-hamburger::before {
    content: "🔔"; /* 흰 별 */
}

/* 메뉴가 열렸을 때 (부모나 버튼에 active 또는 open 클래스가 붙을 때) */
.sticky-hamburger.active::before {
    content: "🧐"; /* 검은 별 */
    color: #000000;
}

/* 2. 편지 메뉴 컨테이너 */
.royal-menu-container {
    position: fixed;
    top: 90px;
    left: -320px;
    width: 150px;
    z-index: 999;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

.royal-menu-container.open {
    left: 40px;
}

/* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
.royal-scroll-sheet {
    position: relative;
    background-image: url('oh.png');
    background-size: 135px 350px; /* 패턴의 크기 조절 (필요에 따라 수정) */
    color: #2c3038;
    padding: 20px 15px;
    box-sizing: border-box;
    box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
}

.royal-scroll-sheet::after {
    content: "";
    position: absolute;
    top: -40px;
    left: -35px;
    right: -35px;
    bottom: -40px;
    border-image-source: url('tray.png');
    border-image-slice: 20%;
    border-width: 55px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10;
    pointer-events: none;
}

/* 4. 메뉴 내용 및 소분류 디자인 */
.royal-scroll-sheet h2 {
    text-align: center;
    font-size: 16px;
    border-bottom: 2px solid #88929b;
    padding-bottom: 5px;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    color: #3a3f47;
    position: relative;
    z-index: 11;
}

.royal-menu-list {
    list-style: none;
    padding: 0;
    margin: 0;
    position: relative;
    z-index: 11;
}

.royal-menu-item {
    margin-bottom: 8px;
}

.menu-toggle-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px dashed #adb5bd;
    color: #2c3038;
    font-weight: bold;
    font-size: 14px;
    font-family: 'Georgia', serif;
    padding: 6px 4px;
    cursor: pointer;
    box-sizing: border-box;
}

.menu-toggle-btn:hover {
    color: #495057;
    background-color: rgba(136, 146, 155, 0.15);
}

/* 소분류 (아코디언) */
.submenu {
    list-style: none;
    padding-left: 15px;
    margin: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, padding 0.3s ease;
    border-left: 2px solid #88929b;
}

.royal-menu-item.active .submenu {
    max-height: 200px;
    padding-top: 5px;
    padding-bottom: 5px;
    transition: max-height 0.4s ease-in;
}

.submenu li a {
    color: #4a515a;
    text-decoration: none;
    font-size: 12px;
    display: block;
    padding: 3px 0;
}

.submenu li a:hover {
    color: #2c3038;
    text-decoration: underline;
}

</style>
</head>

<script>
async function loadData() {
  const loader = document.getElementById('loading');

  try {
    // 가짜 2초 대기 (실제 API 호출 대신 테스트용)

    loader.style.display = 'none';
  }
}

<style>

    <script>
        const gridContainer = document.getElementById('gridMaze');
        const restartBtn = document.getElementById('btn-restart');
        const floatingToggleBtn = document.getElementById('floatingToggleBtn');
        const gamePopover = document.getElementById('gamePopover');
        const toastMessage = document.getElementById('toastMessage');

        const SIZE = 15; 
        let mazeMap = [];
        let player = { x: 0, y: 0 };
        let cells = [];
        let isGameInitialized = false;

        // 플로팅 버튼 클릭 시 게임 팝오버 열기/닫기
        floatingToggleBtn.addEventListener('click', () => {
            gamePopover.classList.toggle('active');
            if (gamePopover.classList.contains('active') && !isGameInitialized) {
                initMaze();
                isGameInitialized = true;
            }
        });

        // 토스트 메시지 출력 함수 (화면 정중앙)
        function showToast(message) {
            toastMessage.textContent = message;
            toastMessage.classList.add('show');
            setTimeout(() => {
                toastMessage.classList.remove('show');
            }, 1200);
        }

        function generateProceduralMaze() {
            let map;
            let goalX, goalY;

            while (true) {
                map = Array.from({ length: SIZE }, () => Array(SIZE).fill(1));

                function isValid(x, y) {
                    return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
                }

                function carve(x, y) {
                    map[y][x] = 0;

                    const directions = [
                        { dx: 0, dy: -2 },
                        { dx: 0, dy: 2 },
                        { dx: -2, dy: 0 },
                        { dx: 2, dy: 0 }
                    ].sort(() => Math.random() - 0.5);

                    for (let dir of directions) {
                        let nx = x + dir.dx;
                        let ny = y + dir.dy;

                        if (isValid(nx, ny) && map[ny][nx] === 1) {
                            map[y + dir.dy / 2][x + dir.dx / 2] = 0;
                            carve(nx, ny);
                        }
                    }
                }

                carve(0, 0);

                for (let i = 1; i < SIZE - 1; i++) {
                    for (let j = 1; j < SIZE - 1; j++) {
                        if (map[i][j] === 1 && Math.random() < 0.12) {
                            map[i][j] = 0;
                        }
                    }
                }

                map[0][0] = 0;

                let availableGoals = [];
                for (let r = SIZE - 4; r < SIZE; r++) {
                    for (let c = SIZE - 4; c < SIZE; c++) {
                        if (map[r][c] === 0 && !(r === 0 && c === 0)) {
                            availableGoals.push({ r, c });
                        }
                    }
                }

                if (availableGoals.length > 0) {
                    let chosen = availableGoals[Math.floor(Math.random() * availableGoals.length)];
                    goalY = chosen.r;
                    goalX = chosen.c;
                    map[goalY][goalX] = 2;
                    break;
                }
            }

            return map;
        }

        function initMaze() {
            mazeMap = generateProceduralMaze();
            player = { x: 0, y: 0 };
            gridContainer.innerHTML = '';
            cells = [];

            gridContainer.style.gridTemplateColumns = `repeat(${SIZE}, 18px)`;
            gridContainer.style.gridTemplateRows = `repeat(${SIZE}, 18px)`;

            for (let r = 0; r < SIZE; r++) {
                cells[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (mazeMap[r][c] === 1) cell.classList.add('wall');
                    if (mazeMap[r][c] === 2) {
                        cell.classList.add('goal');
                        cell.innerHTML = '🫖';
                    }
                    gridContainer.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (mazeMap[r][c] !== 2) {
                        cells[r][c].innerHTML = '';
                    } else {
                        cells[r][c].innerHTML = '🫖';
                    }
                }
            }
            cells[player.y][player.x].innerHTML = '👧';
        }

        function movePlayer(dx, dy) {
            if (!gamePopover.classList.contains('active')) return;

            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && mazeMap[ny][nx] !== 1) {
                player.x = nx;
                player.y = ny;
                updatePlayerPosition();

                if (mazeMap[ny][nx] === 2) {
                    setTimeout(() => {
                        showToast('잡았다!');
                        initMaze(); 
                    }, 100);
                }
            }
        }

        restartBtn.addEventListener('click', () => {
            initMaze();
        });

        document.getElementById('move-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('move-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('move-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('move-right').addEventListener('click', () => movePlayer(1, 0));

        window.addEventListener('keydown', (e) => {
            if (!gamePopover.classList.contains('active')) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); 
            }
            if (e.key === 'ArrowUp') movePlayer(0, -1);
            if (e.key === 'ArrowDown') movePlayer(0, 1);
            if (e.key === 'ArrowLeft') movePlayer(-1, 0);
            if (e.key === 'ArrowRight') movePlayer(1, 0);
        });
    </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
    const frameContainers = document.querySelectorAll('.frame-container');

    // Intersection Observer를 사용하여 스크롤 시 화면에 들어올 때 .show 클래스 추가
    const observerOptions = {
        root: null, // 뷰포트 기준
        rootMargin: '0px',
        threshold: 0.1 // 요소가 10% 정도 보일 때 실행
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
                // 한 번 나타난 이후에는 관찰을 멈추고 싶다면 아래 주석을 해제하세요
                // observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    frameContainers.forEach(container => {
        observer.observe(container);
    });
});
  </script>
