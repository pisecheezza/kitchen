<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모험가의 서고 - 퀘스트 일지</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0908;
            --panel-bg: #181412;
            --border-color: #4e3828;
            --gold: #d4af37;
            --gold-hover: #f3cf55;
            --text-color: #d1c7bd;
            --text-bright: #f5ebe0;
        }

        body {
            font-family: 'Gowun Batang', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle, #1f1814 0%, #0b0908 100%);
        }

        header {
            background: linear-gradient(to bottom, #241d17, #120e0b);
            border-bottom: 3px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1100;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin: 0;
            font-size: 1.4rem;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .hamburger {
            display: none;
            background: #1c1511;
            border: 2px solid var(--gold);
            color: var(--gold);
            font-size: 1.1rem;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
            display: flex;
            gap: 20px;
        }

        .sidebar {
            width: 240px;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
            height: fit-content;
            border-radius: 4px;
        }

        .sidebar h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
            text-align: center;
        }

        .menu-section {
            margin-bottom: 20px;
        }

        .menu-section h3 {
            color: var(--text-bright);
            font-size: 0.95rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        a {
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--gold-hover);
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .date {
            font-size: 0.75rem;
            color: #8c7d70;
            font-family: monospace;
        }

        .main-content {
            flex: 1;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
            min-height: 500px;
            border-radius: 4px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid var(--border-color);
            background: #fff;
        }

        .placeholder {
            text-align: center;
            color: #8c7d70;
            margin-top: 180px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                margin: 10px auto;
            }
            .hamburger {
                display: block;
            }
            .sidebar {
                display: none;
                width: 120px !important;
                position: fixed;
                top: 70px;
                right: 15px;
                left: auto;
                z-index: 1000;
                background: #181412;
                border: 2px solid var(--gold);
                box-shadow: 0 5px 15px rgba(0,0,0,0.9);
                padding: 10px;
            }
            .sidebar.active {
                display: block !important;
            }
            .sidebar h2 {
                font-size: 0.9rem;
            }
            .menu-section h3 {
                font-size: 0.85rem;
            }
            a {
                font-size: 0.8rem;
            }
            iframe {
                height: 450px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚔️ Adventurer's Archive</h1>
        <div class="header-right">
            <button class="hamburger" onclick="toggleMenu(event)">☰ MENU</button>
        </div>
    </header>

    <div class="container">
        <div class="sidebar" id="menu-list">
            <h2>퀘스트 목록</h2>
            <p style="font-size: 0.8rem; text-align: center;">기록 로딩중...</p>
        </div>

        <div class="main-content" id="content-view">
            <div class="placeholder">
                <p>📜 상단 MENU 버튼을 눌러 퀘스트 두루마리를 펼치면<br>이곳에 상세 내용이 출력됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyRjio-7BCxDN2m5gdiuBKtUNCdX2i7B03Q-gybxaqhfwPJcbBuUailo165ESnda3N7dg/exec';

        function toggleMenu(event) {
            event.stopPropagation();
            const sidebar = document.getElementById('menu-list');
            sidebar.classList.toggle('active');
        }

        // 모바일 화면에서 메뉴 바깥쪽을 누르면 메뉴가 닫히도록 처리
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('menu-list');
            const hamburger = document.querySelector('.hamburger');
            if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
                if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });

        async function loadPosts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const menuContainer = document.getElementById('menu-list');
                menuContainer.innerHTML = '<h2>퀘스트 목록</h2>';

                let grouped = {};
                data.forEach(item => {
                    if (!grouped[item['메뉴']]) {
                        grouped[item['메뉴']] = [];
                    }
                    grouped[item['메뉴']].push(item);
                });

                for (let menu in grouped) {
                    let section = document.createElement('div');
                    section.className = 'menu-section';
                    section.innerHTML = `<h3>${menu}</h3>`;
                    
                    let ul = document.createElement('ul');
                    grouped[menu].forEach(post => {
                        let li = document.createElement('li');
                        li.innerHTML = `
                            <a onclick="openDoc('${post['미리보기주소']}'); closeMenuOnMobile();">${post['제목']}</a>
                            <span class="date">${post['생성일']}</span>
                        `;
                        ul.appendChild(li);
                    });
                    section.appendChild(ul);
                    menuContainer.appendChild(section);
                }

            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('menu-list').innerHTML = '<p style="font-size:0.8rem; color:#ff6b6b; text-align:center;">기록을 불러오지 못했습니다.</p>';
            }
        }

        function closeMenuOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('menu-list').classList.remove('active');
            }
        }

        function openDoc(previewUrl) {
            const contentView = document.getElementById('content-view');
            contentView.innerHTML = `<iframe src="${previewUrl}"></iframe>`;
        }

        loadPosts();
    </script>
</body>
</html>
