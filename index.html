<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5); /* 어두운 반투명 배경 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 80px;
  height: auto;
}
    
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    
    /* バロック調のゴールドグラデーション（少し落ち着きのある気品ある色合い） */
    background: linear-gradient(135deg, #d4af37, #fff8dc, #aa771c);
    border: 1px solid #4a3505;
    color: #3b2808;
    
    /* サイズを小さく調整 */
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1;
    
    cursor: pointer;
    
    /* 贅沢感を演出する二重の影と角丸 */
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.6);
    border-radius: 2px;
    
    /* スムーズなアニメーション */
    transition: all 0.3s ease;
}

.sticky-hamburger:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #ffe066, #fffff0, #d4af37);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.8);
}

.sticky-hamburger:active {
    transform: translateY(0);
}

        /* 2. 편지 메뉴 컨테이너 */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px;
            width: 150px;
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 20px;
        }

        /* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
        .royal-scroll-sheet {
            position: relative;
            background-color: #f4ebd0; /* 양피지 질감 배경 */
            color: #3b220c;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
        }

        .royal-scroll-sheet::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -35px;
            right: -35px;
            bottom: -25px;
            border-image-source: url('frame.png');
            border-image-slice: 34%;
            border-width: 50px;
            border-style: solid;
            border-image-repeat: round;
            z-index: 10;
            pointer-events: none;
        }

        /* 4. 메뉴 내용 및 소분류 디자인 */
        .royal-scroll-sheet h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
            position: relative;
            z-index: 11;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 11;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 소분류 (아코디언) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        .royal-menu-item.active .submenu {
            max-height: 200px;
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

</style>
</head>
<body>    
     <div class="outer-wrap">
         <div class="frame-container">
             <img src="image.png" alt="image">
         </div>
         <div class="frame-container">
             <img src="bach.jpg" alt="image">
         </div>
         <div class="frame-container">
             <img src="chopin.JPG" alt="image">
         </div>
         <div class="frame-container">
             <img src="liszt.png" alt="image">
         </div>
     </div>
    
<button class="sticky-hamburger" onclick="toggleRoyalMenu()">
        <span>📜 칙서</span>
    </button>

    <div class="royal-menu-container" id="royalMenu">
        <div class="royal-scroll-sheet">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 왕실 내무부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 예산 편성 및 결산</a></li>
                        <li><a href="#">- 연회 및 행사 기획</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 왕국 외교부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 조약 문서 보관소</a></li>
                        <li><a href="#">- 사절단 접견 일정</a></li>
                        <li><a href="#">- 동맹국 현황 보고</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 기사단 현황 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 경비대 성문 배치</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

  <div id="floating-music-container" style="
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 999999;
    width: 50px;
    height: 50px;
    background-color: rgba(30, 30, 30, 0.8); /* 반투명 검정 배경 */
    border-radius: 50%; /* 원형 */
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
    backdrop-filter: blur(5px); /* 배경 흐림 효과 (선택사항) */
" onclick="togglePlayAndAnimate()" title="음악 재생/일시정지">
    
    <!-- 상태에 따라 변하는 음표 아이콘 (SVG) -->
    <svg id="music-icon" viewBox="0 0 24 24" style="
        width: 24px;
        height: 24px;
        fill: #aaa; /* 기본 아이콘 색상 */
        transition: fill 0.3s, transform 0.3s ease-in-out;
    ">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>

    <!-- 유튜브 IFrame이 생성될 숨김 영역 (필수) -->
    <div id="youtube-audio-player" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;"></div>
</div>

<!-- 숨겨진 상태 텍스트 (디버깅용, 필요시 삭제 가능) -->
<div id="player-status" style="display: none;">로딩 중...</div>

<!-- 유튜브 IFrame API 스크립트 로드 -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // --- 설정 영역: 재생할 유튜브 영상 ID 5개 (원하시는 영상 ID로 변경하세요) ---
    const playlistIds = [
        'jfKfPfyJRdk', // 예: lofi hip hop radio
        '5qap5aO4i9A', // 예: lofi girl sleep
        'DWcJFNfaw9c', // 예: peaceful guitar
        'jfKfPfyJRdk', 
        '5qap5aO4i9A'
    ];

    let player;
    let fadeInterval;
    let isPlaying = false; // 현재 재생 상태 추적

    // 유튜브 API 준비 완료 시 호출
    function onYouTubeIframeAPIReady() {
        const randomId = playlistIds[Math.floor(Math.random() * playlistIds.length)];
        
        player = new YT.Player('youtube-audio-player', {
            height: '1',
            width: '1',
            videoId: randomId,
            playerVars: {
                'autoplay': 1, // 자동재생 활성화
                'controls': 0, // 컨트롤바 숨김
                'playsinline': 1, // iOS 전체화면 방지
                'loop': 1,
                'playlist': randomId // 루프를 위해 필요
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    // 플레이어 준비 완료 (부드러운 시작을 위해 음소거 상태로 시작)
    function onPlayerReady(event) {
        event.target.mute();
        event.target.playVideo();
        fadeInAudio(event.target);
        updatePlayerUI(true); // 재생 시작 UI로 업데이트
    }

    // 상태 변경 감지 (영상이 끝나면 다른 랜덤 곡으로 자동 재생)
    function onPlayerStateChange(event) {
        // 영상이 끝났을 때 다음 랜덤 곡 재생
        if (event.data === YT.PlayerState.ENDED) {
            playRandomVideo();
        }
    }

    // 부드러운 페이드인 (음소거 -> 서서히 소리 키우기)
    function fadeInAudio(targetPlayer) {
        let volume = 0;
        targetPlayer.setVolume(volume);
        
        if (fadeInterval) clearInterval(fadeInterval);

        fadeInterval = setInterval(() => {
            if (volume < 100) {
                volume += 5;
                targetPlayer.setVolume(volume);
            } else {
                clearInterval(fadeInterval);
            }
        }, 150); // 0.15초마다 볼륨 5씩 증가 (약 3초 동안 부드럽게 커짐)
    }

    // 새로운 랜덤 곡 재생
    function playRandomVideo() {
        if (!player || typeof player.loadVideoById !== 'function') return;
        
        const randomId = playlistIds[Math.floor(Math.random() * playlistIds.length)];
        player.loadVideoById(randomId);
        player.mute(); // 전환 시 다시 음소거
        player.playVideo();
        fadeInAudio(player);
        
        updatePlayerUI(true); // 재생 상태 유지 UI
    }

    // 버튼 클릭 시 재생/일시정지 토글 및 아이콘 애니메이션
    function togglePlayAndAnimate() {
        if (!player) return;
        const container = document.getElementById('floating-music-container');
        const state = player.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
            updatePlayerUI(false); // 일시정지 상태 UI로 업데이트
        } else {
            // 이미 음소거가 풀려있는 상태에서 다시 재생할 때는 부드럽게 페이드인 할 필요 없이 바로 재생해도 무방함
            player.playVideo();
            updatePlayerUI(true); // 재생 상태 UI로 업데이트
        }
    }

    // UI 상태 업데이트 함수 (아이콘 색상 및 애니메이션 관리)
    function updatePlayerUI(playing) {
        isPlaying = playing;
        const icon = document.getElementById('music-icon');
        const container = document.getElementById('floating-music-container');

        if (playing) {
            // 재생 중: 아이콘 색상을 밝게, 약간 회전하는 애니메이션 효과
            icon.style.fill = '#34C759'; // 예쁜 초록색으로 변경
            icon.style.transform = 'rotate(10deg)'; 
            container.style.backgroundColor = 'rgba(50, 50, 50, 0.9)';
        } else {
            // 일시정지: 아이콘 색상을 어둡게, 회전 초기화
            icon.style.fill = '#aaa'; // 기본 색상
            icon.style.transform = 'rotate(0deg)';
            container.style.backgroundColor = 'rgba(30, 30, 30, 0.8)';
        }
    }
</script>
<script>
        function toggleRoyalMenu() {
            const menu = document.getElementById('royalMenu');
            menu.classList.toggle('open');
        }

        function toggleSubmenu(menuId) {
            const item = document.getElementById(menuId);
            item.classList.toggle('active');
        }
    </script>
    
<script>
    // Intersection Observer를 이용해 스크롤 감지 (.frame-container 전체를 관찰)
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1 
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, observerOptions);

    // 수정 포인트: img 태그가 아닌 .frame-container를 관찰 대상으로 지정
    document.querySelectorAll('.frame-container').forEach(container => {
        observer.observe(container);
    });
</script>


<!-- 로딩 오버레이와 스피너 HTML 구조 -->
<div id="loading" class="loading-container">
  <img src="spinda.gif" alt="spinning..." class="loading-gif">
</div>
     
<script>
async function loadData() {
  const loader = document.getElementById('loading');

  try {
    // 가짜 2초 대기 (실제 API 호출 대신 테스트용)
    await new Promise(resolve => setTimeout(resolve, 2000));
  } finally {
    loader.style.display = 'none';
  }
}

loadData();
</script>
</body>
</html>
