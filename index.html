<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5); /* 어두운 반투명 배경 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 80px;
  height: auto;
}
    
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    
    /* バロック調のゴールドグラデーション（少し落ち着きのある気品ある色合い） */
    background: linear-gradient(135deg, #d4af37, #fff8dc, #aa771c);
    border: 1px solid #4a3505;
    color: #3b2808;
    
    /* サイズを小さく調整 */
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1;
    
    cursor: pointer;
    
    /* 贅沢感を演出する二重の影と角丸 */
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.6);
    border-radius: 2px;
    
    /* スムーズなアニメーション */
    transition: all 0.3s ease;
}

.sticky-hamburger:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #ffe066, #fffff0, #d4af37);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.8);
}

.sticky-hamburger:active {
    transform: translateY(0);
}

        /* 2. 편지 메뉴 컨테이너 */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px;
            width: 150px;
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 20px;
        }

        /* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
        .royal-scroll-sheet {
            position: relative;
            background-color: #f4ebd0; /* 양피지 질감 배경 */
            color: #3b220c;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
        }

        .royal-scroll-sheet::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -35px;
            right: -35px;
            bottom: -25px;
            border-image-source: url('frame.png');
            border-image-slice: 34%;
            border-width: 50px;
            border-style: solid;
            border-image-repeat: round;
            z-index: 10;
            pointer-events: none;
        }

        /* 4. 메뉴 내용 및 소분류 디자인 */
        .royal-scroll-sheet h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
            position: relative;
            z-index: 11;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 11;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 소분류 (아코디언) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        .royal-menu-item.active .submenu {
            max-height: 200px;
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

</style>
</head>
<body>    
     <div class="outer-wrap">
         <div class="frame-container">
             <img src="image.png" alt="image">
         </div>
         <div class="frame-container">
             <img src="bach.jpg" alt="image">
         </div>
         <div class="frame-container">
             <img src="chopin.JPG" alt="image">
         </div>
         <div class="frame-container">
             <img src="liszt.png" alt="image">
         </div>
     </div>
    
<button class="sticky-hamburger" onclick="toggleRoyalMenu()">
        <span>📜 칙서</span>
    </button>

    <div class="royal-menu-container" id="royalMenu">
        <div class="royal-scroll-sheet">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 국왕실 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 침실</a></li>
                        <li><a href="#">- 집무실</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 복도 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 갤러리</a></li>
                        <li><a href="#">- 서재</a></li>
                        <li><a href="#">- 정자</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 접견실 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 티 테이블</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

<!-- 플로팅 플레이어 컨테이너 (오른쪽 상단 고정) -->
<div id="floating-music-container" style="
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999999;
    display: flex;
    align-items: center;
    background: rgba(30, 30, 30, 0.9);
    backdrop-filter: blur(8px);
    border-radius: 30px;
    padding: 6px 12px 6px 6px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-family: sans-serif;
    color: #fff;
    transition: all 0.3s ease;
">
    <!-- 음표 아이콘 버튼 (클릭 시 펼치기/접기 또는 메인 토글) -->
    <div onclick="togglePlayerMenu()" style="
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s;
    " title="플레이어 열기/닫기">
        <svg id="music-icon" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #aaa; transition: fill 0.3s;">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
    </div>

    <!-- 확장 컨트롤 패널 (제목 및 버튼들) -->
    <div id="player-controls-panel" style="
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 10px;
        overflow: hidden;
        white-space: nowrap;
        transition: max-width 0.3s ease;
    ">
        <!-- 곡 제목 표시 영역 -->
        <div id="song-title" style="
            font-size: 12px;
            color: #ddd;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        ">음악 로딩 중...</div>

        <!-- 재생/일시정지 버튼 -->
        <button onclick="togglePlay()" id="play-btn" style="
            background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 4px;
        " title="재생/일시정지">⏸</button>

        <!-- 다음 곡(랜덤) 버튼 -->
        <button onclick="playRandomVideo()" style="
            background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 4px;
        " title="다음 곡">⏭</button>
    </div>

    <!-- 유튜브 IFrame이 생성될 숨김 영역 -->
    <div id="youtube-audio-player" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;"></div>
</div>

<!-- 유튜브 IFrame API 스크립트 로드 -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // --- 설정 영역: 실제 작동하는 11자리 유튜브 영상 ID 5개로 교체해주세요 ---
    const playlist = [
        { id: 'p7lHxFIe9H4', title: 'Love Phantom' },
        { id: 'WZ_YE5efAD4', title: '今夜月の見える丘に' },
        { id: '9EPLQXcoRU8', title: '愛のままにわがままに 僕は君だけを傷つけない' },
        { id: 'ThOBuDHTnOE', title: 'ALONE' }
    ];

    let player;
    let fadeInterval;
    let currentTrack = null;

    function onYouTubeIframeAPIReady() {
        playRandomVideo();
    }

    // 유튜브 플레이어 초기화 또는 곡 변경
    function playRandomVideo() {
        const randomItem = playlist[Math.floor(Math.random() * playlist.length)];
        currentTrack = randomItem;
        
        // 제목 업데이트
        document.getElementById('song-title').innerText = currentTrack.title;

        if (!player) {
            player = new YT.Player('youtube-audio-player', {
                height: '1',
                width: '1',
                videoId: currentTrack.id,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        } else {
            player.loadVideoById(currentTrack.id);
            player.mute();
            player.playVideo();
            fadeInAudio(player);
            updateUI(true);
        }
    }

    function onPlayerReady(event) {
        event.target.mute();
        event.target.playVideo();
        fadeInAudio(event.target);
        updateUI(true);
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playRandomVideo();
        }
    }

    // 부드러운 페이드인
    function fadeInAudio(targetPlayer) {
        let volume = 0;
        targetPlayer.setVolume(volume);
        if (fadeInterval) clearInterval(fadeInterval);

        fadeInterval = setInterval(() => {
            if (volume < 100) {
                volume += 5;
                targetPlayer.setVolume(volume);
            } else {
                clearInterval(fadeInterval);
            }
        }, 150);
    }

    // 재생 / 일시정지 토글
    function togglePlay() {
        if (!player) return;
        const state = player.getPlayerState();
        const playBtn = document.getElementById('play-btn');

        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
            playBtn.innerText = '▶';
            document.getElementById('music-icon').style.fill = '#aaa';
        } else {
            player.playVideo();
            playBtn.innerText = '⏸';
            document.getElementById('music-icon').style.fill = '#34C759';
        }
    }

    // UI 상태 업데이트
    function updateUI(isPlaying) {
        const playBtn = document.getElementById('play-btn');
        const icon = document.getElementById('music-icon');
        if (isPlaying) {
            playBtn.innerText = '⏸';
            icon.style.fill = '#34C759';
        } else {
            playBtn.innerText = '▶';
            icon.style.fill = '#aaa';
        }
    }

    // 아이콘 눌렀을 때 컨트롤 패널을 펼치고 접는 기능 (선택사항)
    let isExpanded = true;
    function togglePlayerMenu() {
        // 원하실 경우 음표 아이콘만 남기고 패널을 숨기는 토글을 넣을 수 있습니다.
        // 현재는 항상 펼쳐져 있도록 기본 설정되어 있습니다.
    }
</script>
<script>
        function toggleRoyalMenu() {
            const menu = document.getElementById('royalMenu');
            menu.classList.toggle('open');
        }

        function toggleSubmenu(menuId) {
            const item = document.getElementById(menuId);
            item.classList.toggle('active');
        }
    </script>
    
<script>
    // Intersection Observer를 이용해 스크롤 감지 (.frame-container 전체를 관찰)
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1 
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, observerOptions);

    // 수정 포인트: img 태그가 아닌 .frame-container를 관찰 대상으로 지정
    document.querySelectorAll('.frame-container').forEach(container => {
        observer.observe(container);
    });
</script>


<!-- 로딩 오버레이와 스피너 HTML 구조 -->
<div id="loading" class="loading-container">
  <img src="spinda.gif" alt="spinning..." class="loading-gif">
</div>
     
<script>
async function loadData() {
  const loader = document.getElementById('loading');

  try {
    // 가짜 2초 대기 (실제 API 호출 대신 테스트용)
    await new Promise(resolve => setTimeout(resolve, 2000));
  } finally {
    loader.style.display = 'none';
  }
}

loadData();
</script>
</body>
</html>
