<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>シナモン国</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 150px;
  height: auto;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    justify-content: center;
    background-color: black;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}  

.marquee-container {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    width: 100%;
    flex: 1;
}

.outer-wrap {
    display: flex;
    align-items: center;
    gap: 120px;
    width: max-content;
    animation: scrollLeftToRight 35s linear infinite;
    animation: scrollRightToLeft 35s linear infinite;
}

.outer-wrap:hover {
    animation-play-state: paused;
}

@keyframes scrollRightToLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    position: relative;
    z-index: 1;
    width: 380px;
    height: auto;
    object-fit: cover;
}

@media (max-width: 768px) {
    .outer-wrap {
        gap: 80px;
    }

    .frame-container img {
        width: 240px;
    }

    .frame-container::after {
        top: -30px;
        left: -30px;
        right: -30px;
        bottom: -30px;
        border-width: 40px;
    }
}

.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    background: transparent;
    border: transparent;
    color: #2c3038;
    text-shadow: 0 0 white;
    padding: 8px 10px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    box-shadow: none; 
    border-radius: 0;
    transition: all 0.3s ease;
}

.sticky-hamburger:hover { transform: translateY(-2px); background: transparent; box-shadow: none; }
.sticky-hamburger:active { transform: translateY(0); }
.sticky-hamburger::before { content: "🔔"; }
.sticky-hamburger.active::before { content: "🧐"; color: #000000; }


.royal-menu-container {
    position: fixed;
    top: 90px;
    left: -320px;
    width: 150px;
    z-index: 999;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}

.royal-menu-container.open {
    left: 40px;
}

.royal-scroll-sheet {
    position: relative;
    background-image: url('oh.png');
    background-size: 135px 350px; /* 패턴의 크기 조절 (필요에 따라 수정) */
    color: #2c3038;
    padding: 20px 15px;
    box-sizing: border-box;
    box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
}

.royal-scroll-sheet::after {
    content: "";
    position: absolute;
    top: -40px;
    left: -35px;
    right: -35px;
    bottom: -40px;
    border-image-source: url('tray.png');
    border-image-slice: 20%;
    border-width: 55px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10;
    pointer-events: none;
}

/* 4. 메뉴 내용 및 소분류 디자인 */
.royal-scroll-sheet h2 {
    text-align: center;
    font-size: 16px;
    border-bottom: 2px solid #88929b;
    padding-bottom: 5px;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    color: #3a3f47;
    position: relative;
    z-index: 11;
}

.royal-menu-list {
    list-style: none;
    padding: 0;
    margin: 0;
    position: relative;
    z-index: 11;
}

.royal-menu-item {
    margin-bottom: 8px;
}

.menu-toggle-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px dashed #adb5bd;
    color: #2c3038;
    font-weight: bold;
    font-size: 14px;
    font-family: 'Georgia', serif;
    padding: 6px 4px;
    cursor: pointer;
    box-sizing: border-box;
}

.menu-toggle-btn:hover {
    color: #495057;
    background-color: rgba(136, 146, 155, 0.15);
}

/* 소분류 (아코디언) */
.submenu {
    list-style: none;
    padding-left: 15px;
    margin: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, padding 0.3s ease;
    border-left: 2px solid #88929b;
}

.royal-menu-item.active .submenu {
    max-height: 200px;
    padding-top: 5px;
    padding-bottom: 5px;
    transition: max-height 0.4s ease-in;
}

.submenu li a {
    color: #4a515a;
    text-decoration: none;
    font-size: 12px;
    display: block;
    padding: 3px 0;
}

.submenu li a:hover {
    color: #2c3038;
    text-decoration: underline;
}
</style>
</head>
<body>    
<div id="loading" class="loading-container">
  <img src="spinda.gif" alt="spinning..." class="loading-gif">
</div>
<audio id="click-sound" src="click.mp3" preload="auto"></audio>
<button class="sticky-hamburger" id="hamburgerBtn" onclick="toggleRoyalMenu()"></button>

        <div class="royal-menu-container" id="royalMenu">
            <div class="royal-scroll-sheet">
                <h2>シナモン国</h2>
                <ul class="royal-menu-list">
                    <li class="royal-menu-item" id="menu1">
                        <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 王室 ▾</button>
                        <ul class="submenu">
                            <li><a href="#">- 寝室</a></li>
                            <li><a href="#">- 執務室</a></li>
                        </ul>
                    </li>
                    <li class="royal-menu-item" id="menu2">
                        <button class="menu-toggle-btn" onclick="toggleMenu(event)">🛡️ 廊下 ▾</button>
                    </li>
                    <li class="royal-menu-item" id="menu3">
                        <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 応接間 ▾</button>
                        <ul class="submenu">
                           <li><a href="#">- ティーテーブル</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
  
<div class="marquee-container">
    <div class="outer-wrap">
        <div class="frame-container"><img src="ichi.png" alt="image"></div>
        <div class="frame-container"><img src="ni.png" alt="image"></div>
        <div class="frame-container"><img src="image.png" alt="image"></div>
        <div class="frame-container"><img src="liszt.png" alt="image"></div>

        <div class="frame-container"><img src="ichi.png" alt="image"></div>
        <div class="frame-container"><img src="ni.png" alt="image"></div>
        <div class="frame-container"><img src="image.png" alt="image"></div>
        <div class="frame-container"><img src="liszt.png" alt="image"></div>
    </div>
</div>
  
<script> // 햄버거 메뉴 사운드 재생
const menuBtn = document.getElementById('hamburgerBtn');
const clickSound = document.getElementById('click-sound');

menuBtn.addEventListener('click', () => {
  clickSound.currentTime = 0; 
  clickSound.play().catch(error => {
    console.log("재생 실패:", error);
  });
});
</script>
  
<script> // 마키 태그 흐름 실행
    document.addEventListener('DOMContentLoaded', () => {
    const frameContainers = document.querySelectorAll('.frame-container');
    const observerOptions = {
        root: null, 
        rootMargin: '0px',
        threshold: 0.1 
    };
    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, observerOptions);

    frameContainers.forEach(container => {
        observer.observe(container);
    });
});
</script>
<script>
function toggleRoyalMenu() {
    const menu = document.getElementById('royalMenu');
    const btn = document.getElementById('hamburgerBtn');

    menu.classList.toggle('open');
    btn.classList.toggle('active');
}
function toggleRoyalMenu() {
    const menu = document.getElementById('royalMenu');
    const btn = document.getElementById('hamburgerBtn');

    menu.classList.toggle('open');
    btn.classList.toggle('active');
}

function toggleSubmenu(menuId) {
    const menuItem = document.getElementById(menuId);
    menuItem.classList.toggle('active');
}
</script>
<script> // 로딩 스피너
async function loadData() {
  const loader = document.getElementById('loading');

  try {
    await new Promise(resolve => setTimeout(resolve, 2000));
  } finally {
    loader.style.display = 'none';
  }
}
loadData();
</script>
</body>
</html>
