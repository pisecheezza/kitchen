<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<body>
     
     <div class="frame-container">
        <img src="image.png" alt="image">
     </div>

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: black;
        margin: 0;
    }
    
    .outer-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 75px; 
    }

    .frame-container {
        position: relative; 
        display: inline-block;
        line-height: 0;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    /* 이미지를 아래로 내리고, 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
    .frame-container::after {
        content: "";
        position: absolute;
        /* 테두리 두께(150px)의 절반인 -75px로 설정하여 이미지 주변을 감싸도록 수정 */
        top: -75px;
        left: -75px;
        right: -75px;
        bottom: -75px;
        
        border-image-source: url('border.png');
        border-image-slice: 26%;
        border-width: 150px;
        border-style: solid;
        border-image-repeat: round;
        z-index: 10; 
        pointer-events: none; 
    }

    .frame-container img {
        display: block;
        width: 400px; /* 이미지 크기가 지정되어 있어야 모양이 안정적으로 잡힙니다 */
        height: auto;
        position: relative;
        z-index: 1; 
    }
</style>
     
<!-- 로딩 오버레이와 스피너 HTML 구조 예시 -->
<div id="loading-overlay" style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.5); top:0; left:0; z-index:9999;"></div>
<div id="loading-spinner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:10000;">Loading...</div>
     
<style>
.loading-spinner {
    position: fixed; /* 화면에 고정 */
    top: 50%; /* 세로 중앙 */
    left: 50%; /* 가로 중앙 */
    transform: translate(-50%, -50%); /* 정확한 중앙 정렬 */
    width: 10rem; /* 160px */
    height: 10rem; /* 160px */
    z-index: 9999;
    display: none; /* 초기에는 숨김 */
}

dotlottie-wc {
    width: 100%;
    height: 100%;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(var(--color-background-light-rgb), 0.7); /* 반투명 배경색 */
    z-index: 9998; /* 스피너보다 아래 */
    display: none; /* 초기에는 숨김 */
}
</style>
<script>
function showLoading() {
    document.getElementById('loading-overlay').style.display = 'block';
    document.getElementById('loading-spinner').style.display = 'block';
}
function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'none';
}
showLoading();
setTimeout(() => {
    hideLoading();
}, 2000);
</script>
</body>
</html>
