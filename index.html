<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.loading-spinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10rem;
    height: 10rem;
    z-index: 9999;
    display: none;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 9998;
    display: none;
}

/* 1. 스티키 햄버거 버튼 */
        .sticky-hamburger {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            border: 2px solid #5a3d02;
            color: #2c1d0c;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border-radius: 4px;
            transition: transform 0.2s, background 0.3s;
        }

        .sticky-hamburger:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffd700, #fff8dc, #ffd700);
        }

        /* 2. 편지 메뉴 컨테이너 */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px;
            width: 260px;
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 30px;
        }

        /* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
        .frame-container {
            position: relative;
            background-color: #f4ebd0; /* 양피지 질감 배경 */
            color: #3b220c;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
        }

        .frame-container::after {
            content: "";
            position: absolute;
            top: -35px;
            left: -35px;
            right: -35px;
            bottom: -35px;
            border-image-source: url('frame.png');
            border-image-slice: 20%;
            border-width: 45px;
            border-style: solid;
            border-image-repeat: round;
            z-index: 10;
            pointer-events: none;
        }

        /* 4. 메뉴 내용 및 소분류 디자인 */
        .frame-container h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
            position: relative;
            z-index: 11;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 11;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 소분류 (아코디언) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        .royal-menu-item.active .submenu {
            max-height: 200px;
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

</style>
</head>
<body>    
     <div class="outer-wrap">
         <div class="frame-container">
             <img src="image.png" alt="image">
         </div>
         <div class="frame-container">
             <img src="bach.jpg" alt="image">
         </div>
         <div class="frame-container">
             <img src="chopin.JPG" alt="image">
         </div>
         <div class="frame-container">
             <img src="liszt.png" alt="image">
         </div>
     </div>
    
    <div class="royal-menu-container" id="royalMenu">
        <div class="frame-container">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 왕실 내무부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 예산 편성 및 결산</a></li>
                        <li><a href="#">- 연회 및 행사 기획</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 왕국 외교부 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 조약 문서 보관소</a></li>
                        <li><a href="#">- 사절단 접견 일정</a></li>
                        <li><a href="#">- 동맹국 현황 보고</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 기사단 현황 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 경비대 성문 배치</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
    
<script>
        function toggleRoyalMenu() {
            const menu = document.getElementById('royalMenu');
            menu.classList.toggle('open');
        }

        function toggleSubmenu(menuId) {
            const item = document.getElementById(menuId);
            item.classList.toggle('active');
        }
    </script>
    
<script>
    // Intersection Observer를 이용해 스크롤 감지 (.frame-container 전체를 관찰)
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1 
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, observerOptions);

    // 수정 포인트: img 태그가 아닌 .frame-container를 관찰 대상으로 지정
    document.querySelectorAll('.frame-container').forEach(container => {
        observer.observe(container);
    });
</script>
     
<!-- 로딩 오버레이와 스피너 HTML 구조 -->
<div id="loading-overlay" class="loading-overlay"></div>
<div id="loading-spinner" class="loading-spinner">Loading...</div>
     
<script>
function showLoading() {
    document.getElementById('loading-overlay').style.display = 'block';
    document.getElementById('loading-spinner').style.display = 'block';
}
function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'none';
}
showLoading();
setTimeout(() => {
    hideLoading();
}, 2000);

</script>
</body>
</html>
