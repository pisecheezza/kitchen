<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.loading-spinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10rem;
    height: 10rem;
    z-index: 9999;
    display: none;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 9998;
    display: none;
}
</style>
</head>
<body>
     
     <div class="outer-wrap">
         <div class="frame-container">
             <img src="image.png" alt="image">
         </div>
         <div class="frame-container">
             <img src="bach.jpg" alt="image">
         </div>
         <div class="frame-container">
             <img src="chopin.JPG" alt="image">
         </div>
         <div class="frame-container">
             <img src="liszt.png" alt="image">
         </div>
     </div>

<script>
    // Intersection Observer를 이용해 스크롤 감지 (.frame-container 전체를 관찰)
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1 
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
            }
        });
    }, observerOptions);

    // 수정 포인트: img 태그가 아닌 .frame-container를 관찰 대상으로 지정
    document.querySelectorAll('.frame-container').forEach(container => {
        observer.observe(container);
    });
</script>
     
<!-- 로딩 오버레이와 스피너 HTML 구조 -->
<div id="loading-overlay" class="loading-overlay"></div>
<div id="loading-spinner" class="loading-spinner">Loading...</div>
     
<script>
function showLoading() {
    document.getElementById('loading-overlay').style.display = 'block';
    document.getElementById('loading-spinner').style.display = 'block';
}
function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'none';
}
showLoading();
setTimeout(() => {
    hideLoading();
}, 2000);
</script>
</body>
</html>
