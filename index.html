  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: black;
        margin: 0;
    }
    
    .outer-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 75px; 
    }

    .frame-container {
        position: relative; 
        display: inline-block;
        line-height: 0;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    } /* 💡 빠져 있던 frame-container의 닫는 중괄호 추가 */

    /* 이미지를 아래로 내리고, 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
    .frame-container::after {
        content: "";
        position: absolute;
        /* 테두리 두께(150px)의 절반인 -75px로 설정하여 이미지 주변을 감싸도록 수정 */
        top: -75px;
        left: -75px;
        right: -75px;
        bottom: -75px;
        
        border-image-source: url('border.png');
        border-image-slice: 26%;
        border-width: 150px;
        border-style: solid;
        border-image-repeat: round;
        
        z-index: 10; 
        pointer-events: none; 
    }

    .frame-container img {
        display: block;
        width: 400px; /* 이미지 크기가 지정되어 있어야 모양이 안정적으로 잡힙니다 */
        height: auto;
        position: relative;
        z-index: 1; 
    }
  </style>


<div id="treasure-hunt-component">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap');

        :root {
            --ht-flap-start: #ffffff;
            --ht-flap-end: #e8e8e8;
            --ht-hole-bg: #dcdcdc;
            --ht-modal-bg-grad-start: #dce4eb;
            --ht-modal-bg-grad-end: #f5f5f5;
            --ht-modal-inner-bg: #ffffff;
            --ht-modal-text: #333333;
            --ht-modal-subtext: #555555;
            --ht-icon-bg: #dce4eb;
            --ht-border-color: #d0d0d0;
        }

        .theme-dark, body[data-theme="dark"] {
            --ht-flap-start: #555555;
            --ht-flap-end: #333333;
            --ht-hole-bg: #2d2d2d;
            --ht-modal-bg-grad-start: #333333; 
            --ht-modal-bg-grad-end: #1a1a1a;
            --ht-modal-inner-bg: #222222;
            --ht-modal-text: #e2e8f0;
            --ht-modal-subtext: #a0aec0;
            --ht-icon-bg: #333333;
            --ht-border-color: #555;
        }

        #corner-interaction-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 150px; height: 150px;
            z-index: 9000;
            cursor: pointer;
            display: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
            user-select: none;
        }

        #corner-interaction-wrapper.is-flat { pointer-events: none; cursor: default; }

        .corner-hole {
            position: absolute; top: 0; left: 0; z-index: 1;
            width: 0; height: 0; border-style: solid;
            border-width: 0; 
            border-color: var(--ht-hole-bg) transparent transparent transparent; 
            transition: border-width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.show .corner-hole {
            border-width: 60px 60px 0 0;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .corner-hole {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        
        #corner-interaction-wrapper.is-open .corner-hole {
            border-width: 110px 110px 0 0 !important;
            border-color: var(--ht-border-color) transparent transparent transparent;
            transform: translate(0, 0);
            transition: border-width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .corner-hole { 
            border-width: 0 !important; 
            border-color: var(--ht-hole-bg) transparent transparent transparent; 
        }

        .hidden-emoji-wrapper {
            position: absolute; 
            top: -20px; left: -10px; 
            z-index: 5; 
            pointer-events: none;
            
            transform: translate(0px, 0px) scale(0.5) rotate(-15deg);
            opacity: 0;

            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }
        
        #corner-interaction-wrapper.show .hidden-emoji-wrapper {
            opacity: 0.8;
            transform: translate(-15px, -15px) scale(0.5) rotate(-15deg);
            transition-delay: 0.6s;
        }

        #corner-interaction-wrapper.is-open .hidden-emoji-wrapper {
            z-index: 20; opacity: 1;
            transform: translate(15px, 15px) scale(0.7) rotate(0deg); 
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition-delay: 0s;
        }


        #hiddenEmoji {
            font-size: 5.2rem; 
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
            display: block; transition: all 0.2s ease; 
            font-family: 'Noto Color Emoji', sans-serif;
        }
        .emoji-exit { opacity: 0 !important; transform: scale(0.1) !important; }

        .paper-flap {
            position: absolute; 
            top: -1px; left: -1px; 
            z-index: 9999;
            width: 0; height: 0;
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            background: linear-gradient(135deg, var(--ht-flap-start) 30%, var(--ht-flap-end) 100%);
            
            filter: drop-shadow(-5px -5px 8px rgba(0,0,0,0.25));
            
            transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none; border-bottom-right-radius: 3px; 
        }

        #corner-interaction-wrapper.show .paper-flap {
            width: 60px; height: 60px;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .paper-flap {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        #corner-interaction-wrapper.is-open .paper-flap {
            width: 110px; height: 110px !important; 
            
            filter: drop-shadow(-8px -8px 16px rgba(0,0,0,0.35)); 
            
            transform: translate(0, 0);
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .paper-flap { width: 0 !important; height: 0 !important; filter: none; }

        @keyframes beckon {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, -2px); }
        }

        .ht-modal-overlay {

    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.45);

}

            border-radius: 0; width: 210px; min-height: 315px;

        #htModalTitle {
            color: var(--ht-modal-text); font-size: 1.15rem; font-weight: 700; 
            transform: scaleX(0.97); transform-origin: left center; letter-spacing: -0.5px; white-space: nowrap;
        }
        .ht-close-btn {
            position: absolute; right: 10px; top: 6px;
            font-family: Arial, sans-serif; font-size: 2.0rem; font-weight: 900; line-height: 1; cursor: pointer;
            color: #fff; -webkit-text-stroke: 2.5px #ff6b6b; paint-order: stroke fill;
        }
        .ht-close-btn:hover { color: #ff9999; }
        .ht-modal-inner {
            background-color: var(--ht-modal-inner-bg); border-radius: 0; flex: 1;
            display: flex; flex-direction: column; align-items: center; padding: 20px 10px 10px 15px; 
        }
        .ht-icon-box {
            width: 70px; height: 70px; 
            background-color: var(--ht-icon-bg); border: none; 
            display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
            border-radius: 0; 
        }

        .ht-modal-icon { 
            font-size: 3.5rem; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2)); 
            font-family: 'Noto Color Emoji', sans-serif;
        }
        .ht-modal-desc {
            font-size: 1.1rem; color: var(--ht-modal-text); line-height: 1.6; font-weight: 500; 
            word-break: keep-all; transform: scaleX(0.97); transform-origin: top center; text-align: center; margin-bottom: 15px; 
        }
        .ht-counter-box {
            margin-top: auto; background-color: var(--ht-icon-bg); color: var(--ht-modal-subtext); 
            padding: 4px 12px; font-size: 1.0rem; font-weight: 700; transform: scaleX(0.97); 
        }
        @keyframes htSnapIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>

<script>
const TreasureMemory = (function() {

    const itemsData = [
        { title: '青い薔薇', icon: '🌹', desc: 'ファントムハイヴ家の庭園に咲く、ありえない色の薔薇。気高い気品を纏っている。' },

        { title: '緑の瞳の宝玉', icon: '💠', desc: '美しくも底知れない狂気を湛えた、アロイスの瞳を思わせる鮮やかな緑の石。' },
        { title: 'トレイシー伯爵のタグ', icon: '🏷️', desc: '忌まわしき過去と呪縛を思い起こさせる、血にまみれた古いタグ。' },
        { title: '革製の旅行鞄', icon: '👝', desc: '女王の番犬としてイギリス中を駆け巡る際、常に携帯している重厚な鞄。' },
        { title: '黒猫のぬいぐるみ', icon: '🐈', desc: 'クローディアスが愛していた猫を模した、少し古びた手触りの人形。' },
        { title: '琥珀色のブランデー', icon: '🍸', desc: '大人の嗜みとして、夜な夜なグラスに注がれる芳醇で強いお酒。' },
        { title: 'アールグレイティー', icon: '☕', desc: 'ファントムハイヴ邸で常に最高の淹れ方で提供される、香り高い紅茶。' },
        { title: 'ウィスキーグラス', icon: '🥃', desc: '氷がカランと音を立てる、冷たく澄んだクリスタルのグラス。' },
        { title: '領収書', icon: '🧾', desc: 'ファントム社のおもちゃや菓子の大口取引の記録。莫大な金額が並ぶ。' },
        { title: '調査報告書', icon: '📋', desc: '裏社会の事件やサーカス団の失踪事件に関する、極秘の調査データ。' },
        { title: '万年筆のメモ', icon: '📝', desc: 'シエルが鋭い筆跡で次なる命ずるべき事項を書き留めた紙片。' },
        { title: '特製オレンジジャム', icon: '🍊', desc: 'レイラが作ったとされる、甘酸っぱくも隠し味のありそうなジャム。' },
        { title: '英国貴族院の書類', icon: '📑', desc: '政治的謀略や裏の取引が記された、表に出せない極秘の公文書。' },

        { title: '輝くクラゲの標本', icon: '🪼', desc: 'トランシー邸の怪しげな部屋に飾られている、幻想的な海の生物。' },
        { title: '窓辺の鉢植え', icon: '🪴', desc: '手入れが行き届きながらも、静寂に包まれた部屋でひっそりと育つ植物。' },
        { title: 'スケジュール帳', icon: '🗒️', desc: '多忙な当主の分刻みのスケジュールと、死の予感が混ざり合う手帳。' },
        { title: 'ガラスペン', icon: '🖋', desc: 'インクを吸い込み、冷たい文字を美しく紡ぎ出すための美しい筆記具。' },
        { title: 'ロンドンの地図', icon: '🗺️', desc: '霧深き裏社会の事件現場や、怪しげな館の位置が赤く記された地図。' },

        { title: '満開の桜の枝', icon: '🌸', desc: 'どこか儚く、美しく散りゆく運命を暗示するかのような一枝。' },

        { title: '朝刊新聞', icon: '📰', desc: 'ロンドン市内の怪奇事件や、ジャック・ザ・リッパーの噂を伝える紙面。' },
        { title: '光り輝く宝石の指輪', icon: '💍', desc: '華やかな社交界で目を引く、気品あふれる高価なジュエリー。' },
        { title: '古びた鍵', icon: '🗝️', desc: 'トランシー邸の開かずの扉、またはファントムハイヴの秘密の地下室を開ける鍵。' },
        { title: 'くまのぬいぐるみ', icon: '🧸', desc: 'アロイスが大切に抱きしめていた、愛情の飢えを感じさせる古い玩具。' },
        { title: '象牙の櫛', icon: '🪮', desc: '美しい銀髪を艶やかに整えるために使われる、職人技の光る高級な櫛。' },
        { title: '高級アロマオイル', icon: '🧴', desc: '甘い香りで心を惑わせる、トランシー邸の退廃的な雰囲気を象徴する小瓶。' },
        { title: '天蓋付きのベッド', icon: '🛏️', desc: '悪夢と孤独に苛まれながら、主が眠りにつくための重厚な寝具。' },
        { title: '深紅のマフラー', icon: '🧣', desc: '寒さを凌ぐためだけでなく、首元に纏う血の色を想起させる鮮烈な布。' },
        { title: 'ビジネス用アタッシュケース', icon: '💼', desc: 'ファントム社の一大事業の契約書や, 裏の資金が詰まった硬質な鞄。' },
        { title: 'ミントキャンディ', icon: '🍬', desc: '口に入れた瞬間、ピリッとした刺激と強い清涼感が広がる甘いお菓子。' },
        { title: '封蝋された手紙', icon: '✉️', desc: '漆黒のワックスでしっかりと封がされた、差出人不明の危険な予告状。' },
        { title: '甘い香りのラブレター', icon: '💌', desc: '純粋な恋心と、どこか歪んだ執着心が入り混じった秘密の恋文。' }
    ];

    let currentHiddenItem = null;
    const cornerWrapper = document.getElementById('corner-interaction-wrapper');
    const hiddenEmojiSpan = document.getElementById('hiddenEmoji');

    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasTriggeredOpen = false; 

    function getSeenItems() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
    }

    function markItemAsSeen(title) {
        const seen = getSeenItems();
        if (!seen.includes(title)) {
            seen.push(title);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
        }
    }

function initHiddenItem() {
        const STORAGE_KEY_SKIP_NEXT = 'treasure_skip_next';

        window.addEventListener('beforeunload', function() {
            if (localStorage.getItem(STORAGE_KEY_PENDING)) {
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
            }
            localStorage.removeItem(STORAGE_KEY_PENDING);
        });

        document.addEventListener('click', function(e) {
            const targetLink = e.target.closest('a');
            
            if (!targetLink || !targetLink.href || targetLink.target === '_blank' || targetLink.href.startsWith('javascript:')) return;

            if (cornerWrapper.classList.contains('show') && 
                !cornerWrapper.classList.contains('is-open') && 
                !cornerWrapper.classList.contains('is-flat')) {
                
                e.preventDefault(); 

                const emojiEl = document.getElementById('hiddenEmoji');
                if (emojiEl) emojiEl.classList.add('emoji-exit');
                flattenPaper();
                
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
                localStorage.removeItem(STORAGE_KEY_PENDING);

                setTimeout(() => {
                    window.location.href = targetLink.href;
                }, 700);
            }
        });

        if (localStorage.getItem(STORAGE_KEY_SKIP_NEXT)) {
            localStorage.removeItem(STORAGE_KEY_SKIP_NEXT); 
            cornerWrapper.style.display = 'none';
            return; 
        }
        const pendingTitle = localStorage.getItem(STORAGE_KEY_PENDING);
        if (pendingTitle) {
            const found = itemsData.find(item => item.title === pendingTitle);
            if (found) {
                currentHiddenItem = found;
                displayItem(found);
                return;
            }
        }

let shouldAppear = true; // 항상 등장하도록 수정
        let currentSeenList = getSeenItems();

        // 만약 모든 아이템을 다 모았을 때 다시 처음부터 순환하게 만드는 기존 로직 유지
        if (currentSeenList.length >= itemsData.length) {
            currentSeenList = [];
            localStorage.removeItem(STORAGE_KEY);
        }

        if (currentSeenList.length >= itemsData.length) {
            currentSeenList = [];
            localStorage.removeItem(STORAGE_KEY);
        }

        const weightedPool = [];
        itemsData.forEach(item => {
            const isSeen = currentSeenList.includes(item.title);
            const weight = isSeen ? 1 : 100; 
            for(let i=0; i < weight; i++) weightedPool.push(item);
        });

        const randomIndex = Math.floor(Math.random() * weightedPool.length);
        currentHiddenItem = weightedPool[randomIndex];

        localStorage.setItem(STORAGE_KEY_PENDING, currentHiddenItem.title);
        displayItem(currentHiddenItem);
    }

    function displayItem(item) {
        hiddenEmojiSpan.innerText = item.icon;
        cornerWrapper.style.display = 'block';
        
        addInteractionEvents();

        setTimeout(() => {
            cornerWrapper.classList.add('show');
        }, 100);
    }

function addInteractionEvents() {
        cornerWrapper.addEventListener('touchstart', handleStart, {passive: false});
        cornerWrapper.addEventListener('touchmove', handleMove, {passive: false});
        cornerWrapper.addEventListener('touchend', handleEnd);

        cornerWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove); 
        window.addEventListener('mouseup', handleEnd);
        
        cornerWrapper.addEventListener('click', function(e) {
            if (!hasTriggeredOpen && isInsideCorner(e)) {
                togglePaper();
            }
        });
    }

        function isInsideCorner(e) {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return true;

        const rect = cornerWrapper.getBoundingClientRect();
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        
        const localX = clientX - rect.left;
        const localY = clientY - rect.top;

        return (localX + localY) <= 100;
    }

    function handleStart(e) {
        if (cornerWrapper.classList.contains('is-open')) return;

        if (!isInsideCorner(e)) return;

        isDragging = true;
        hasTriggeredOpen = false;

        if (e.type === 'touchstart') {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else {
            startX = e.clientX;
            startY = e.clientY;
        }
    }

    function handleMove(e) {
        if (!isDragging || hasTriggeredOpen) return;

        let currentX, currentY;

        if (e.type === 'touchmove') {
            if(e.cancelable) e.preventDefault(); 
            currentX = e.touches[0].clientX;
            currentY = e.touches[0].clientY;
        } else {
            currentX = e.clientX;
            currentY = e.clientY;
        }

        const moveX = currentX - startX;
        const moveY = currentY - startY;
        
        if ((moveX + moveY) > 50) { 
            togglePaper();
            hasTriggeredOpen = true; 
            isDragging = false; 
        }
    }

    function handleEnd(e) {
        isDragging = false;
    }

    function togglePaper() {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return;
        
        cornerWrapper.classList.add('is-open');

        if (currentHiddenItem) {
            markItemAsSeen(currentHiddenItem.title);
            localStorage.removeItem(STORAGE_KEY_PENDING);
        }

        setTimeout(() => {
            const emojiEl = document.getElementById('hiddenEmoji');
            if(emojiEl) emojiEl.classList.add('emoji-exit');
        }, 600);

        setTimeout(() => {
            if (currentHiddenItem) {
                const index = itemsData.indexOf(currentHiddenItem) + 1;
                const total = itemsData.length;
                openModal(currentHiddenItem.title, currentHiddenItem.icon, currentHiddenItem.desc, index, total);
            }
        }, 700);
    }

    function openModal(title, icon, desc, index, total) {
        const modal = document.getElementById('itemModal');
        document.getElementById('htModalTitle').innerText = title;
        document.getElementById('htModalIcon').innerText = icon;
        document.getElementById('htModalDesc').innerHTML = desc;

        document.getElementById('htItemCounter').innerText = `${index} / ${total} 번째 기억`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('itemModal').style.display = 'none';
        flattenPaper(); 
    }

    function flattenPaper() {
        cornerWrapper.classList.remove('is-open'); 
        cornerWrapper.classList.add('is-flat');      
    }

    return {
        init: initHiddenItem,
        closeModal: closeModal
    };
})();

window.addEventListener('load', function() {
    TreasureMemory.init();
});
    </script>

<!--
  펫 위젯 — topping 사이트 삽입용
  사용법: 이 <div class="pet-widget">...</div> 블록과 <style>/<script>를
  index.html에 그대로 붙여넣고, PET_API_URL만 배포된 Apps Script /exec 주소로 교체하세요.
---------------------------------------------------------------->
<div class="pet-widget" id="pet-widget">
  <div class="pet-stage" id="pet-stage">
    <div class="pet-speech" id="pet-speech"></div>
    <div class="pet-sprite" id="pet-sprite">🥚</div>

  </div>

  <div class="pet-bars">
    <div class="pet-bar-row">
      <span class="pet-bar-icon">🍚</span>
      <div class="pet-bar-track"><div class="pet-bar-fill hunger" id="pet-hunger-bar"></div></div>
    </div>
    <div class="pet-bar-row">
      <span class="pet-bar-icon">✨</span>
      <div class="pet-bar-track"><div class="pet-bar-fill joy" id="pet-joy-bar"></div></div>
    </div>
  </div>

  <div class="pet-stats">
    <span>친밀도 <b id="pet-bond">0</b></span>

  </div>

<style>
  .pet-widget {
    --pet-ink: #3a2e26;
    --pet-cream: #fbf3e7;
    --pet-panel: #fff8ef;
    --pet-hunger: #e8a33d;
    --pet-joy: #6fb3a8;
    --pet-accent: #c9704f;

    width: 260px;
    padding: 16px;
    border-radius: 18px;
    background: var(--pet-panel);
    border: 2px solid var(--pet-ink);
    box-shadow: 4px 4px 0 var(--pet-ink);
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--pet-ink);
    box-sizing: border-box;
    display: felx;
    justify-content: center;
    align-items: center;
  }

  .pet-stage {
    position: relative;
    height: 120px;
    border-radius: 12px;
    background: var(--pet-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: visible;
  }

  .pet-sprite {
    font-size: 52px;
    line-height: 1;
    animation: pet-bob 2.4s ease-in-out infinite;
  }

  @keyframes pet-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .pet-speech {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translate(-50%, -100%) scale(0.9);
    background: #fff;
    border: 2px solid var(--pet-ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  .pet-speech.show {
    opacity: 1;
    transform: translate(-50%, -110%) scale(1);
  }

  .pet-label {
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .pet-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pet-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pet-bar-icon {
    font-size: 13px;
    width: 16px;
    text-align: center;
  }

  .pet-bar-track {
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(58, 46, 38, 0.12);
    overflow: hidden;
  }

  .pet-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .pet-bar-fill.hunger { background: var(--pet-hunger); }
  .pet-bar-fill.joy { background: var(--pet-joy); }

  .pet-stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: 0.75;
    margin-bottom: 10px;
  }

  .pet-away-notice {
    display: none;
    font-size: 11px;
    text-align: center;
    background: rgba(201, 112, 79, 0.12);
    border: 1px dashed var(--pet-accent);
    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 8px;
  }

  .pet-widget.is-away .pet-away-notice { display: block; }
  .pet-widget.is-away #pet-actions { display: none; }
  .pet-find-row { display: none; }
  .pet-widget.is-away .pet-find-row { display: flex; }

  .pet-actions {
    display: flex;
    gap: 6px;
  }

  .pet-actions button {
    flex: 1;
    padding: 7px 4px;
    border-radius: 8px;
    border: 2px solid var(--pet-ink);
    background: #fff;
    color: var(--pet-ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .pet-actions button:hover {
    background: var(--pet-accent);
    color: #fff;
  }

  .pet-actions button:active {
    transform: scale(0.95);
  }
</style>

<script>
(function () {
  const PET_API_URL = 'https://script.google.com/macros/s/AKfycbzbnaQTr8esxEbwjc-kHWBSTJ-um3QdQ1PYsX2gj9_ntnRDze1XEj1oHvrEPOorRBqH/exec'; // ← 교체

  const STAGE_EMOJI = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐤', 5: '🦉' };

  async function petAction(act) {
    try {
      const res = await fetch(PET_API_URL, {
        method: 'POST',
        body: new URLSearchParams({ act })
      });
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 액션 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 API 호출 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  async function petStatus() {
    try {
      const res = await fetch(PET_API_URL);
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 상태 조회 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 상태 조회 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  function updateUI(data) {
    const s = data.state;
    document.getElementById('pet-stage-label').textContent = s.stageLabel;
    document.getElementById('pet-hunger-bar').style.width = s.hunger + '%';
    document.getElementById('pet-joy-bar').style.width = s.joy + '%';
    document.getElementById('pet-bond').textContent = s.bond;
    document.getElementById('pet-exp').textContent = s.exp;

    const widget = document.getElementById('pet-widget');
    widget.classList.toggle('is-away', !!s.away);
    document.getElementById('pet-last-seen').textContent = s.lastSeen || '-';
    document.getElementById('pet-sprite').textContent = s.away ? '❓' : (STAGE_EMOJI[s.stage] || '🥚');

    if (data.saying) showSpeech(data.saying);
  }

  let speechTimer = null;
  function showSpeech(text) {
    const bubble = document.getElementById('pet-speech');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => bubble.classList.remove('show'), 2600);
  }

  document.addEventListener('DOMContentLoaded', function () {
    petStatus();
    document.getElementById('pet-feed-btn').addEventListener('click', () => petAction('feed'));
    document.getElementById('pet-pet-btn').addEventListener('click', () => petAction('pet'));
    document.getElementById('pet-greet-btn').addEventListener('click', () => petAction('greet'));
    document.getElementById('pet-find-btn').addEventListener('click', () => petAction('find'));
  });
})();
</script>
