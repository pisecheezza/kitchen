<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<body>
     
     <div class="frame-container">
        <img src="image.png" alt="image">
        <img src="bach.jpg" alt="image">
        <img src="chopin.jpg" alt="image">
        <img src="liszt.png" alt="image">
     </div>

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -75px;
    left: -75px;
    right: -75px;
    bottom: -75px;
    
    border-image-source: url('border.png');
    border-image-slice: 26%;
    border-width: 150px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}
</style>

<script>
    // Intersection Observer를 이용해 스크롤 감지
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1 // 이미지가 10% 정도 보일 때 애니메이션 실행
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
                // 한 번 나타난 후 관찰을 멈추려면 아래 주석 해제
                // observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.querySelectorAll('.frame-container img').forEach(img => {
        observer.observe(img);
    });
</script>
     
<!-- 로딩 오버레이와 스피너 HTML 구조 예시 -->
<div id="loading-overlay" style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.5); top:0; left:0; z-index:9999;"></div>
<div id="loading-spinner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:10000;">Loading...</div>
     
<style>
.loading-spinner {
    position: fixed; /* 화면에 고정 */
    top: 50%; /* 세로 중앙 */
    left: 50%; /* 가로 중앙 */
    transform: translate(-50%, -50%); /* 정확한 중앙 정렬 */
    width: 10rem; /* 160px */
    height: 10rem; /* 160px */
    z-index: 9999;
    display: none; /* 초기에는 숨김 */
}

dotlottie-wc {
    width: 100%;
    height: 100%;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(var(--color-background-light-rgb), 0.7); /* 반투명 배경색 */
    z-index: 9998; /* 스피너보다 아래 */
    display: none; /* 초기에는 숨김 */
}
</style>
<script>
function showLoading() {
    document.getElementById('loading-overlay').style.display = 'block';
    document.getElementById('loading-spinner').style.display = 'block';
}
function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'none';
}
showLoading();
setTimeout(() => {
    hideLoading();
}, 2000);
</script>
</body>
</html>
