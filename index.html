<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の一言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #EDEAE3;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(124,144,112,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(82,92,122,0.07), transparent 45%);
    font-family: 'EB Garamond', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #2E2B26;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .backdrop-hint {
    text-align: center;
    color: #8A8578;
    font-size: 15px;
    line-height: 1.9;
  }
  .backdrop-hint b { color: #2E2B26; font-weight: 600; }

  /* ── アイコンは右下に縦一列 ── */
  .fab {
    position: fixed;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    z-index: 10;
  }
  .fab:hover { transform: translateY(-2px); }
  .fab:active { transform: translateY(0) scale(0.96); }
  .fab svg { width: 23px; height: 23px; }

  #fab-time  { bottom: 28px;  background: #2E2B26; box-shadow: 0 8px 20px rgba(46,43,38,0.25); }
  #fab-time:hover { box-shadow: 0 10px 24px rgba(46,43,38,0.3); }

  #fab-tea   { bottom: 100px; background: #6B4A3A; box-shadow: 0 8px 20px rgba(107,74,58,0.3); }
  #fab-tea:hover { box-shadow: 0 10px 24px rgba(107,74,58,0.36); }

  #fab-tarot { bottom: 172px; background: #211B2E; box-shadow: 0 8px 20px rgba(33,27,46,0.4); }
  #fab-tarot:hover { box-shadow: 0 10px 24px rgba(33,27,46,0.48); }

  /* ── メッセージはアイコンの左側に表示（他のアイコンを隠さないように） ── */
  .toast {
    position: fixed;
    right: 96px; /* icon 56px + gap 16px + edge 24px */
    width: min(280px, calc(100vw - 160px));
    padding: 20px 20px 18px;
    border-radius: 20px;
    opacity: 0;
    transform: translateX(10px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(.2,.8,.2,1), transform 0.35s cubic-bezier(.2,.8,.2,1);
    z-index: 5;
    cursor: pointer;
  }
  .toast.show { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }

  #toast-time  { bottom: 14px; }
  #toast-tea   { bottom: 86px; }
  #toast-tarot { bottom: 148px; }

  .toast .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .toast .dot { width: 7px; height: 7px; border-radius: 50%; }
  .toast .msg {
    font-size: 16.5px;
    line-height: 1.75;
    letter-spacing: 0.01em;
  }

  #toast-time {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(46,43,38,0.08);
    box-shadow: 0 20px 45px rgba(46,43,38,0.16);
  }
  #toast-time .tag { color: #6B6759; }
  #toast-time .msg { color: #2E2B26; }

  #toast-tea {
    background: rgba(250,244,232,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(107,74,58,0.12);
    box-shadow: 0 20px 45px rgba(107,74,58,0.2);
  }
  #toast-tea .tag { color: #8A5C3D; }
  #toast-tea .msg { color: #4A3327; }

  /* タロットは装飾を抑えた「普通の案内文」トーン。カード名だけ英語のまま優雅に。 */
  #toast-tarot {
    background: linear-gradient(160deg, #241D33, #1B1626);
    border: 1px solid rgba(201,162,39,0.35);
    box-shadow: 0 24px 50px rgba(20,15,30,0.45), inset 0 0 0 1px rgba(201,162,39,0.06);
  }
  #toast-tarot .tag { color: #C9A227; text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; }
  #toast-tarot .dot { background: #C9A227; box-shadow: 0 0 6px rgba(201,162,39,0.7); }
  #toast-tarot .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21px;
    color: #F1E9D2;
    margin: 2px 0 8px;
  }
  #toast-tarot .divider {
    width: 28px;
    height: 1px;
    background: rgba(201,162,39,0.5);
    margin: 10px 0 12px;
  }
  #toast-tarot .msg {
    color: #D8CFE0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }

  @media (max-width: 460px) {
    .toast { width: calc(100vw - 130px); right: 88px; }
  }
</style>
</head>
<body>

<p class="backdrop-hint">下のアイコンをお試しください<br><b>時計 ・ お茶 ・ タロット</b></p>

<!-- 時計（時間帯別メッセージ） -->
<button class="fab" id="fab-time" aria-label="今の時間にふさわしい一言">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="8.5" stroke="#EDEAE3" stroke-width="1.6"/>
    <path d="M12 7.5V12L15 14" stroke="#EDEAE3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- お茶 -->
<button class="fab" id="fab-tea" aria-label="お茶の時間の一言">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5 10h12v4.5A4.5 4.5 0 0 1 12.5 19h-3A4.5 4.5 0 0 1 5 14.5V10z" stroke="#F7EFE2" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M17 11h1.5a2.3 2.3 0 0 1 0 4.6H17" stroke="#F7EFE2" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M8 6.5c.5-1 1.5-1 2 0" stroke="#F7EFE2" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
</button>

<!-- タロット -->
<button class="fab" id="fab-tarot" aria-label="今日のタロットカード">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="7" y="4" width="10" height="16" rx="2" stroke="#C9A227" stroke-width="1.5"/>
    <path d="M12 8.5l1.3 2.6 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z" fill="#C9A227"/>
  </svg>
</button>

<div class="toast" id="toast-time">
  <div class="tag"><span class="dot" id="toastDotTime"></span><span id="toastTagTime">タグ</span></div>
  <div class="msg" id="toastMsgTime">メッセージ</div>
</div>

<div class="toast" id="toast-tea">
  <div class="tag"><span class="dot" id="toastDotTea"></span><span id="toastTagTea">タグ</span></div>
  <div class="msg" id="toastMsgTea">メッセージ</div>
</div>

<div class="toast" id="toast-tarot">
  <div class="tag"><span class="dot" id="toastDotTarot"></span><span>本日のカード</span></div>
  <div class="card-name" id="toastCardTarot">Card Name</div>
  <div class="divider"></div>
  <div class="msg" id="toastMsgTarot">メッセージ</div>
</div>

<script>
/* ────────────────────────────────────────────────
   SHEET_API_BASE_URL 에 Apps Script 웹앱 배포 URL을 넣으세요.
   세 아이콘 모두 이 URL 하나를 공유하고, ?type=time / ?type=tea / ?type=tarot 만 다르게 붙습니다.
   시트: 한 스프레드시트 안에 Time / Tea / Tarot 탭(시트) 3개
   각 탭 형식: key(A열) | value(B열) — {date}, {name} 치환 지원
   ──────────────────────────────────────────────── */
const SHEET_API_BASE_URL = "https://script.google.com/macros/s/AKfycbwHou9yZgkYdvwYIkeFlJeJhvZ6BjYPWLQcl5GMcl6jhi7YzpKKo9o3HTHjpjskQup9/exec";
const USER_NAME = "坊っちゃん"; // used wherever {name} appears

function formatDate() {
  const d = new Date();
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function fillTemplate(raw) {
  return raw.replace("{date}", formatDate()).replace("{name}", USER_NAME);
}
function groupByKey(rows) {
  const grouped = {};
  rows.forEach(({ key, value }) => (grouped[key] ||= []).push(value));
  return grouped;
}
function pickFrom(values) {
  return values[Math.floor(Math.random() * values.length)];
}
// weights 예: { "The Fool": 2, "The Hermit": 0.5 } — 숫자가 클수록 더 자주 나옴, 미지정 key는 기본값 1
function weightedPickKey(grouped, weights = {}) {
  const keys = Object.keys(grouped);
  const total = keys.reduce((sum, k) => sum + (weights[k] ?? 1), 0);
  let r = Math.random() * total;
  for (const k of keys) {
    r -= (weights[k] ?? 1);
    if (r <= 0) return k;
  }
  return keys[keys.length - 1];
}

/* ============ ① 時間帯別メッセージ ============ */
const TIME_TAG_COLORS = { "朝": "#8FA383", "昼": "#C9A24B", "夕": "#B4703F", "夜": "#525C7A" };
function getCurrentPeriod() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return "朝";
  if (h >= 11 && h < 17) return "昼";
  if (h >= 17 && h < 21) return "夕";
  return "夜";
}
async function loadTimeRows() {
  const res = await fetch(`${SHEET_API_BASE_URL}?type=time`);
  return res.json();
}
let timeRowsCache = null, timeHideTimer = null;
const toastTime = document.getElementById('toast-time');

async function fillTimeToast() {
  if (!timeRowsCache) timeRowsCache = await loadTimeRows();
  const grouped = groupByKey(timeRowsCache);
  const period = getCurrentPeriod();
  const candidates = grouped[period] || [];
  if (!candidates.length) return;
  document.getElementById('toastTagTime').textContent = period;
  document.getElementById('toastMsgTime').textContent = fillTemplate(pickFrom(candidates));
  document.getElementById('toastDotTime').style.background = TIME_TAG_COLORS[period] || "#8A8578";
}
function resetTimeTimer() {
  clearTimeout(timeHideTimer);
  timeHideTimer = setTimeout(() => toastTime.classList.remove('show'), 5000);
}
document.getElementById('fab-time').addEventListener('click', async () => {
  if (toastTime.classList.contains('show')) {
    toastTime.classList.remove('show');
    clearTimeout(timeHideTimer);
    return;
  }
  await fillTimeToast();
  toastTime.classList.add('show');
  resetTimeTimer();
});
toastTime.addEventListener('click', async () => {
  await fillTimeToast();
  resetTimeTimer();
});

/* ============ ② お茶の時間のメッセージ（1日1回の"おやつ"ルール付き） ============ */

const TEA_COOLDOWN_HOURS = 4;
const TEA_TAG_COLORS = { "本日のお茶": "#8A5C3D" };
const TEA_KEY_WEIGHTS = {};

const TEA_LIMIT_TAG_COLOR = "#B4703F";
const TEA_LIMIT_MESSAGES = [
  "誠に恐れ入りますが、おやつは一日に一度までと定めております、{name}。",
  "本日はすでにお持ちいたしました。おやつは一日一度が心得でございます。"
];

async function loadTeaRows() {
  const res = await fetch(`${SHEET_API_BASE_URL}?type=tea`);
  return res.json();
}

let teaLastShownMemory = 0;
function getLastTeaTime() {
  try { return parseInt(localStorage.getItem('teaLastShown') || '0', 10); }
  catch (e) { return teaLastShownMemory; }
}
function setLastTeaTime(ts) {
  try { localStorage.setItem('teaLastShown', String(ts)); }
  catch (e) { teaLastShownMemory = ts; }
}
function formatRemaining(ms) {
  const totalMin = Math.max(1, Math.ceil(ms / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h}時間${m}分` : `${m}分`;
}

let teaRowsCache = null, teaHideTimer = null;
const toastTea = document.getElementById('toast-tea');

let teaLastMessageMemory = null;
function getLastTeaMessage() {
  try { return JSON.parse(localStorage.getItem('teaLastMessage') || 'null'); }
  catch (e) { return teaLastMessageMemory; }
}
function setLastTeaMessage(msg) {
  try { localStorage.setItem('teaLastMessage', JSON.stringify(msg)); }
  catch (e) { teaLastMessageMemory = msg; }
}

function renderTeaMessage({ tag, text }) {
  document.getElementById('toastTagTea').textContent = tag;
  document.getElementById('toastMsgTea').textContent = text;
  document.getElementById('toastDotTea').style.background = TEA_TAG_COLORS[tag] || "#8A5C3D";
}
function showTeaLimitNotice(remainingMs) {
  document.getElementById('toastTagTea').textContent = "本日はここまで";
  document.getElementById('toastDotTea').style.background = TEA_LIMIT_TAG_COLOR;
  const notice = fillTemplate(pickFrom(TEA_LIMIT_MESSAGES));
  document.getElementById('toastMsgTea').textContent =
    `${notice} 次にお持ちできるのは、あと${formatRemaining(remainingMs)}ほどかと存じます。`;
}
function resetTeaTimer() {
  clearTimeout(teaHideTimer);
  teaHideTimer = setTimeout(() => toastTea.classList.remove('show'), 5000);
}

async function fillTeaToast() {
  if (!teaRowsCache) teaRowsCache = await loadTeaRows();
  const grouped = groupByKey(teaRowsCache);
  const key = weightedPickKey(grouped, TEA_KEY_WEIGHTS);
  const content = { tag: key, text: fillTemplate(pickFrom(grouped[key])) };
  setLastTeaMessage(content);
  renderTeaMessage(content);
}

async function openTeaToast() {
  const cooldownMs = TEA_COOLDOWN_HOURS * 60 * 60 * 1000;
  const last = getLastTeaTime();
  const remaining = cooldownMs - (Date.now() - last);

  if (last && remaining > 0) {
    const cached = getLastTeaMessage();
    if (cached) renderTeaMessage(cached);
    else showTeaLimitNotice(remaining);
  } else {
    await fillTeaToast();
    setLastTeaTime(Date.now());
  }
  toastTea.classList.add('show');
  resetTeaTimer();
}

document.getElementById('fab-tea').addEventListener('click', () => {
  if (toastTea.classList.contains('show')) {
    toastTea.classList.remove('show');
    clearTimeout(teaHideTimer);
    return;
  }
  openTeaToast();
});

toastTea.addEventListener('click', () => {
  const cooldownMs = TEA_COOLDOWN_HOURS * 60 * 60 * 1000;
  const last = getLastTeaTime();
  const remaining = cooldownMs - (Date.now() - last);
  if (last && remaining > 0) {
    showTeaLimitNotice(remaining);
  } else {
    fillTeaToast();
    setLastTeaTime(Date.now());
  }
  resetTeaTimer();
});
 
/* ============ ③ タロットカード（普通の案内文） ============ */
// シート形式：key（A列）= カード名（英語のまま）、value（B列）= そのカードの案内文
// 同じカード名を複数行に分けて書くと、その中からランダムに選ばれます。
// key(カード名)ごとの出現しやすさ。大きいほど出やすく、未指定は既定値1として扱われます。
/* ============ ③ タロットカード（1日1回・注意文なし） ============ */
// key(カード名)ごとの出現しやすさ。大きいほど出やすく、未指定は既定値1として扱われます。
const TAROT_KEY_WEIGHTS = {
  "The Fool": 1.5,
  "The Star": 1,
  "The Moon": 1,
  "Strength": 1,
  "The Sun": 1,
  "The Hermit": 0.6
};

async function loadTarotRows() {
  const res = await fetch(`${SHEET_API_BASE_URL}?type=tarot`);
  return res.json();
}

let tarotRowsCache = null, tarotHideTimer = null;
const toastTarot = document.getElementById('toast-tarot');

function resetTarotTimer() {
  clearTimeout(tarotHideTimer);
  tarotHideTimer = setTimeout(() => toastTarot.classList.remove('show'), 6000);
}

function getTodayDateKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

let tarotLastDateMemory = null;
let tarotLastCardMemory = null;

function getTarotLastDate() {
  try { return localStorage.getItem('tarotLastDate'); }
  catch (e) { return tarotLastDateMemory; }
}
function setTarotLastDate(dateKey) {
  try { localStorage.setItem('tarotLastDate', dateKey); }
  catch (e) { tarotLastDateMemory = dateKey; }
}
function getTarotLastCard() {
  try { return JSON.parse(localStorage.getItem('tarotLastCard') || 'null'); }
  catch (e) { return tarotLastCardMemory; }
}
function setTarotLastCard(card) {
  try { localStorage.setItem('tarotLastCard', JSON.stringify(card)); }
  catch (e) { tarotLastCardMemory = card; }
}

async function drawNewTarotCard() {
  if (!tarotRowsCache) tarotRowsCache = await loadTarotRows();
  const grouped = groupByKey(tarotRowsCache);
  const card = weightedPickKey(grouped, TAROT_KEY_WEIGHTS);
  const text = fillTemplate(pickFrom(grouped[card]));
  setTarotLastCard({ card, text });
  document.getElementById('toastCardTarot').textContent = card;
  document.getElementById('toastMsgTarot').textContent = text;
}

async function openTarotToast() {
  const today = getTodayDateKey();
  const lastDate = getTarotLastDate();

  if (lastDate === today) {
    const cached = getTarotLastCard();
    if (cached) {
      document.getElementById('toastCardTarot').textContent = cached.card;
      document.getElementById('toastMsgTarot').textContent = cached.text;
    } else {
      await drawNewTarotCard();
    }
  } else {
    await drawNewTarotCard();
    setTarotLastDate(today);
  }
  toastTarot.classList.add('show');
  resetTarotTimer();
}

document.getElementById('fab-tarot').addEventListener('click', () => {
  if (toastTarot.classList.contains('show')) {
    toastTarot.classList.remove('show');
    clearTimeout(tarotHideTimer);
    return;
  }
  openTarotToast();
});

toastTarot.addEventListener('click', () => {
  resetTarotTimer();
});
 
 Promise.all([
  loadTimeRows().then(rows => timeRowsCache = rows).catch(() => {}),
  loadTeaRows().then(rows => teaRowsCache = rows).catch(() => {}),
  loadTarotRows().then(rows => tarotRowsCache = rows).catch(() => {})
]);
</script>
<!--
  펫 위젯 — topping 사이트 삽입용
  사용법: 이 <div class="pet-widget">...</div> 블록과 <style>/<script>를
  index.html에 그대로 붙여넣고, PET_API_URL만 배포된 Apps Script /exec 주소로 교체하세요.
-->

<div class="pet-widget" id="pet-widget">
  <div class="pet-stage" id="pet-stage">
    <div class="pet-speech" id="pet-speech"></div>
    <div class="pet-sprite" id="pet-sprite">🥚</div>
  </div>

  <div class="pet-label" id="pet-stage-label">알</div>

  <div class="pet-bars">
    <div class="pet-bar-row">
      <span class="pet-bar-icon">🍚</span>
      <div class="pet-bar-track"><div class="pet-bar-fill hunger" id="pet-hunger-bar"></div></div>
    </div>
    <div class="pet-bar-row">
      <span class="pet-bar-icon">✨</span>
      <div class="pet-bar-track"><div class="pet-bar-fill joy" id="pet-joy-bar"></div></div>
    </div>
  </div>

  <div class="pet-stats">
    <span>친밀도 <b id="pet-bond">0</b></span>
    <span>경험치 <b id="pet-exp">0</b></span>
  </div>

  <div class="pet-actions">
    <button id="pet-feed-btn" type="button">먹이주기</button>
    <button id="pet-pet-btn" type="button">쓰다듬기</button>
    <button id="pet-greet-btn" type="button">인사하기</button>
  </div>
</div>

<style>
  .pet-widget {
    --pet-ink: #3a2e26;
    --pet-cream: #fbf3e7;
    --pet-panel: #fff8ef;
    --pet-hunger: #e8a33d;
    --pet-joy: #6fb3a8;
    --pet-accent: #c9704f;

    width: 260px;
    padding: 16px;
    border-radius: 18px;
    background: var(--pet-panel);
    border: 2px solid var(--pet-ink);
    box-shadow: 4px 4px 0 var(--pet-ink);
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--pet-ink);
    box-sizing: border-box;
  }

  .pet-stage {
    position: relative;
    height: 120px;
    border-radius: 12px;
    background: var(--pet-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: visible;
  }

  .pet-sprite {
    font-size: 52px;
    line-height: 1;
    animation: pet-bob 2.4s ease-in-out infinite;
  }

  @keyframes pet-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .pet-speech {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translate(-50%, -100%) scale(0.9);
    background: #fff;
    border: 2px solid var(--pet-ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  .pet-speech.show {
    opacity: 1;
    transform: translate(-50%, -110%) scale(1);
  }

  .pet-label {
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .pet-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pet-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pet-bar-icon {
    font-size: 13px;
    width: 16px;
    text-align: center;
  }

  .pet-bar-track {
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(58, 46, 38, 0.12);
    overflow: hidden;
  }

  .pet-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .pet-bar-fill.hunger { background: var(--pet-hunger); }
  .pet-bar-fill.joy { background: var(--pet-joy); }

  .pet-stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: 0.75;
    margin-bottom: 10px;
  }

  .pet-actions {
    display: flex;
    gap: 6px;
  }

  .pet-actions button {
    flex: 1;
    padding: 7px 4px;
    border-radius: 8px;
    border: 2px solid var(--pet-ink);
    background: #fff;
    color: var(--pet-ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .pet-actions button:hover {
    background: var(--pet-accent);
    color: #fff;
  }

  .pet-actions button:active {
    transform: scale(0.95);
  }
</style>

<script>
(function () {
  const PET_API_URL = 'https://script.google.com/macros/s/AKfycbzbnaQTr8esxEbwjc-kHWBSTJ-um3QdQ1PYsX2gj9_ntnRDze1XEj1oHvrEPOorRBqH/exec'; // ← 교체

  const STAGE_EMOJI = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐤', 5: '🦉' };

  async function petAction(act) {
    try {
      const res = await fetch(PET_API_URL, {
        method: 'POST',
        body: new URLSearchParams({ act })
      });
      const data = await res.json();
      if (data.ok) updateUI(data);
      else console.warn('펫 액션 실패:', data.error);
    } catch (err) {
      console.error('펫 API 호출 오류:', err);
    }
  }

  async function petStatus() {
    try {
      const res = await fetch(PET_API_URL);
      const data = await res.json();
      if (data.ok) updateUI(data);
    } catch (err) {
      console.error('펫 상태 조회 오류:', err);
    }
  }

  function updateUI(data) {
    const s = data.state;
    document.getElementById('pet-stage-label').textContent = s.stageLabel;
    document.getElementById('pet-hunger-bar').style.width = s.hunger + '%';
    document.getElementById('pet-joy-bar').style.width = s.joy + '%';
    document.getElementById('pet-bond').textContent = s.bond;
    document.getElementById('pet-exp').textContent = s.exp;
    document.getElementById('pet-sprite').textContent = STAGE_EMOJI[s.stage] || '🥚';
    if (data.saying) showSpeech(data.saying);
  }

  let speechTimer = null;
  function showSpeech(text) {
    const bubble = document.getElementById('pet-speech');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => bubble.classList.remove('show'), 2600);
  }

  document.addEventListener('DOMContentLoaded', function () {
    petStatus();
    document.getElementById('pet-feed-btn').addEventListener('click', () => petAction('feed'));
    document.getElementById('pet-pet-btn').addEventListener('click', () => petAction('pet'));
    document.getElementById('pet-greet-btn').addEventListener('click', () => petAction('greet'));
  });
})();
</script>
</body>
</html>
