  <script>
    // 설정할 목표 날짜 (YYYY-MM-DD 형식으로 입력하세요)
    const targetDate = new Date("2026-12-31T00:00:00");
    
    function updateDDay() {
      const today = new Date();
      
      const distance = targetDate.setHours(0,0,0,0) - today.setHours(0,0,0,0);
      const diffDays = Math.ceil(distance / (1000 * 60 * 60 * 24));
      
      const counterEl = document.getElementById("d-day-counter");
      
      if (diffDays > 0) {
        counterEl.innerText = `D - ${diffDays}`;
      } else if (diffDays === 0) {
        counterEl.innerText = `D - DAY 🎉`;
      } else {
        counterEl.innerText = `D + ${Math.abs(diffDays)}`;
      }
    }

    updateDDay();
  </script>

<script>
(function () {
  const PET_API_URL = 'https://script.google.com/macros/s/AKfycbzbnaQTr8esxEbwjc-kHWBSTJ-um3QdQ1PYsX2gj9_ntnRDze1XEj1oHvrEPOorRBqH/exec'; // ← 교체

  const STAGE_EMOJI = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐤', 5: '🦉' };

  async function petAction(act) {
    try {
      const res = await fetch(PET_API_URL, {
        method: 'POST',
        body: new URLSearchParams({ act })
      });
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 액션 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 API 호출 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  async function petStatus() {
    try {
      const res = await fetch(PET_API_URL);
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 상태 조회 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 상태 조회 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  function updateUI(data) {
    const s = data.state;
    document.getElementById('pet-stage-label').textContent = s.stageLabel;
    document.getElementById('pet-hunger-bar').style.width = s.hunger + '%';
    document.getElementById('pet-joy-bar').style.width = s.joy + '%';
    document.getElementById('pet-bond').textContent = s.bond;
    document.getElementById('pet-exp').textContent = s.exp;

    const widget = document.getElementById('pet-widget');
    widget.classList.toggle('is-away', !!s.away);
    document.getElementById('pet-last-seen').textContent = s.lastSeen || '-';
    document.getElementById('pet-sprite').textContent = s.away ? '❓' : (STAGE_EMOJI[s.stage] || '🥚');

    if (data.saying) showSpeech(data.saying);
  }

  let speechTimer = null;
  function showSpeech(text) {
    const bubble = document.getElementById('pet-speech');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => bubble.classList.remove('show'), 2600);
  }

  document.addEventListener('DOMContentLoaded', function () {
    petStatus();
    document.getElementById('pet-feed-btn').addEventListener('click', () => petAction('feed'));
    document.getElementById('pet-pet-btn').addEventListener('click', () => petAction('pet'));
    document.getElementById('pet-greet-btn').addEventListener('click', () => petAction('greet'));
    document.getElementById('pet-find-btn').addEventListener('click', () => petAction('find'));
  });
})();
</script>

<style>
  /* 전체 타임라인 컨테이너 */
.timeline-container {
    position: relative;
    max-width: 1000px;
    margin: 50px auto;
    padding: 40px 0;
}

/* 1. 웹 페이지 가운데에 검정 실선 배치 */
.timeline-container::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background-color: #000000;
    transform: translateX(-50%);
}

/* 각 행 구조 (좌측 내용 | 중앙 마커 | 우측 내용) */
.timeline-row {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    align-items: start; /* 좌우 내용의 맨 위 선을 수평으로 정확히 일치시킴 */
    margin-bottom: 80px;
    position: relative;
}

/* 좌우 콘텐츠 디자인 (가독성을 위한 박스 스타일) */
.timeline-content {
    padding: 15px 20px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

.timeline-content.left {
    text-align: right;
    margin-right: 15px;
}

.timeline-content.right {
    text-align: left;
    margin-left: 15px;
}

/* 중앙 마커 영역 */
.timeline-marker {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
}

/* 2. 원형 포인트 (Glow, Colored, Blurry Shadow 효과 적용) */
.timeline-dot {
    width: 20px;
    height: 20px;
    background-color: #3b82f6; /* 원하는 컬러 포인트로 변경 가능 */
    border-radius: 50%;
    /* 블러 처리된 그림자와 빛나는(glow) 효과 */
    box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6, 0 0 35px rgba(59, 130, 246, 0.7);
    z-index: 2;
}

/* 3. 원형 포인트 바로 위에 위치하는 제목 */
.timeline-title {
    position: absolute;
    bottom: calc(100% + 10px); /* 원형 포인트 위로 간격을 두고 배치 */
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;

}
