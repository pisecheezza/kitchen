<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の一言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(124,144,112,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(82,92,122,0.07), transparent 45%);
    font-family: 'EB Garamond', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #2E2B26;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
<!--
  펫 위젯 — topping 사이트 삽입용
  사용법: 이 <div class="pet-widget">...</div> 블록과 <style>/<script>를
  index.html에 그대로 붙여넣고, PET_API_URL만 배포된 Apps Script /exec 주소로 교체하세요.
-->

<div class="pet-widget" id="pet-widget">
  <div class="pet-stage" id="pet-stage">
    <div class="pet-speech" id="pet-speech"></div>
    <div class="pet-sprite" id="pet-sprite">🥚</div>
  </div>

  <div class="pet-label" id="pet-stage-label">알</div>

  <div class="pet-away-notice" id="pet-away-notice">
    외출 중 · 마지막 목격일 <b id="pet-last-seen">-</b>
  </div>

  <div class="pet-bars">
    <div class="pet-bar-row">
      <span class="pet-bar-icon">🍚</span>
      <div class="pet-bar-track"><div class="pet-bar-fill hunger" id="pet-hunger-bar"></div></div>
    </div>
    <div class="pet-bar-row">
      <span class="pet-bar-icon">✨</span>
      <div class="pet-bar-track"><div class="pet-bar-fill joy" id="pet-joy-bar"></div></div>
    </div>
  </div>

  <div class="pet-stats">
    <span>친밀도 <b id="pet-bond">0</b></span>
    <span>경험치 <b id="pet-exp">0</b></span>
  </div>

  <div class="pet-actions" id="pet-actions">
    <button id="pet-feed-btn" type="button">먹이주기</button>
    <button id="pet-pet-btn" type="button">쓰다듬기</button>
    <button id="pet-greet-btn" type="button">인사하기</button>
  </div>

  <div class="pet-actions pet-find-row" id="pet-find-row">
    <button id="pet-find-btn" type="button">찾아오기</button>
  </div>
</div>

<style>
  .pet-widget {
    --pet-ink: #3a2e26;
    --pet-cream: #fbf3e7;
    --pet-panel: #fff8ef;
    --pet-hunger: #e8a33d;
    --pet-joy: #6fb3a8;
    --pet-accent: #c9704f;

    width: 260px;
    padding: 16px;
    border-radius: 18px;
    background: var(--pet-panel);
    border: 2px solid var(--pet-ink);
    box-shadow: 4px 4px 0 var(--pet-ink);
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--pet-ink);
    box-sizing: border-box;
  }

  .pet-stage {
    position: relative;
    height: 120px;
    border-radius: 12px;
    background: var(--pet-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: visible;
  }

  .pet-sprite {
    font-size: 52px;
    line-height: 1;
    animation: pet-bob 2.4s ease-in-out infinite;
  }

  @keyframes pet-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .pet-speech {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translate(-50%, -100%) scale(0.9);
    background: #fff;
    border: 2px solid var(--pet-ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  .pet-speech.show {
    opacity: 1;
    transform: translate(-50%, -110%) scale(1);
  }

  .pet-label {
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .pet-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pet-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pet-bar-icon {
    font-size: 13px;
    width: 16px;
    text-align: center;
  }

  .pet-bar-track {
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(58, 46, 38, 0.12);
    overflow: hidden;
  }

  .pet-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .pet-bar-fill.hunger { background: var(--pet-hunger); }
  .pet-bar-fill.joy { background: var(--pet-joy); }

  .pet-stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: 0.75;
    margin-bottom: 10px;
  }

  .pet-away-notice {
    display: none;
    font-size: 11px;
    text-align: center;
    background: rgba(201, 112, 79, 0.12);
    border: 1px dashed var(--pet-accent);
    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 8px;
  }

  .pet-widget.is-away .pet-away-notice { display: block; }
  .pet-widget.is-away #pet-actions { display: none; }
  .pet-find-row { display: none; }
  .pet-widget.is-away .pet-find-row { display: flex; }

  .pet-actions {
    display: flex;
    gap: 6px;
  }

  .pet-actions button {
    flex: 1;
    padding: 7px 4px;
    border-radius: 8px;
    border: 2px solid var(--pet-ink);
    background: #fff;
    color: var(--pet-ink);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .pet-actions button:hover {
    background: var(--pet-accent);
    color: #fff;
  }

  .pet-actions button:active {
    transform: scale(0.95);
  }
</style>

<script>
(function () {
  const PET_API_URL = 'https://script.google.com/macros/s/AKfycbzbnaQTr8esxEbwjc-kHWBSTJ-um3QdQ1PYsX2gj9_ntnRDze1XEj1oHvrEPOorRBqH/exec'; // ← 교체

  const STAGE_EMOJI = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐤', 5: '🦉' };

  async function petAction(act) {
    try {
      const res = await fetch(PET_API_URL, {
        method: 'POST',
        body: new URLSearchParams({ act })
      });
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 액션 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 API 호출 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  async function petStatus() {
    try {
      const res = await fetch(PET_API_URL);
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 상태 조회 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 상태 조회 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  function updateUI(data) {
    const s = data.state;
    document.getElementById('pet-stage-label').textContent = s.stageLabel;
    document.getElementById('pet-hunger-bar').style.width = s.hunger + '%';
    document.getElementById('pet-joy-bar').style.width = s.joy + '%';
    document.getElementById('pet-bond').textContent = s.bond;
    document.getElementById('pet-exp').textContent = s.exp;

    const widget = document.getElementById('pet-widget');
    widget.classList.toggle('is-away', !!s.away);
    document.getElementById('pet-last-seen').textContent = s.lastSeen || '-';
    document.getElementById('pet-sprite').textContent = s.away ? '❓' : (STAGE_EMOJI[s.stage] || '🥚');

    if (data.saying) showSpeech(data.saying);
  }

  let speechTimer = null;
  function showSpeech(text) {
    const bubble = document.getElementById('pet-speech');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => bubble.classList.remove('show'), 2600);
  }

  document.addEventListener('DOMContentLoaded', function () {
    petStatus();
    document.getElementById('pet-feed-btn').addEventListener('click', () => petAction('feed'));
    document.getElementById('pet-pet-btn').addEventListener('click', () => petAction('pet'));
    document.getElementById('pet-greet-btn').addEventListener('click', () => petAction('greet'));
    document.getElementById('pet-find-btn').addEventListener('click', () => petAction('find'));
  });
})();
</script>
<div class="loading-overlay" id="loading-overlay"></div>
<div class="loading-spinner" id="loading-spinner">
<img src="spinda.gif"
alt="Loading..."
style="width: 100%; height: 100%;" />
</div>



<style>
/* css/loading.css */
/*
   이 파일은 웹사이트 로딩 중 표시되는 스피너와 오버레이의 스타일을 정의합니다.
*/

/* --- 로딩 스피너 (Loading Spinner) --- */
.loading-spinner {
    position: fixed; /* 화면에 고정 */
    top: 50%; /* 세로 중앙 */
    left: 50%; /* 가로 중앙 */
    transform: translate(-50%, -50%); /* 정확한 중앙 정렬 */
    width: 10rem; /* 160px */
    height: 10rem; /* 160px */
    z-index: 9999;
    display: none; /* 초기에는 숨김 */
}

/* --- DotLottie 웹 컴포넌트 (DotLottie Web Component) --- */
/*
   Lottie 애니메이션을 표시하는 웹 컴포넌트에 대한 스타일입니다.
   애니메이션이 컨테이너에 맞게 채워지도록 합니다.
*/
dotlottie-wc {
    width: 100%;
    height: 100%;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(var(--color-background-light-rgb), 0.7); /* 반투명 배경색 */
    z-index: 9998; /* 스피너보다 아래 */
    display: none; /* 초기에는 숨김 */
}
</style>
 <script>
// 로딩 스피너 및 오버레이 표시
function showLoading() {
    document.getElementById('loading-overlay').style.display = 'block';
    document.getElementById('loading-spinner').style.display = 'block';
}

// 로딩 스피너 및 오버레이 숨김
function hideLoading() {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'none';
}

// 예시: 페이지가 로드될 때 테스트용으로 3초 동안 로딩 띄우기
showLoading();
setTimeout(() => {
    hideLoading();
}, 3000);

  
 </script>
</body>
</html>
