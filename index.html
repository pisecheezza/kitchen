    <style>
    .antique-frame-box {
    /* 프레임의 두께 설정 (프레임 이미지의 모서리 두께에 맞춰 조절) */
    border: 35px solid transparent; 
    
    /* 
      border-image: url('프레임이미지경로') 슬라이스값(숫자) 채우기방식(round 또는 stretch) 
      - round: 패턴이 잘리지 않고 반복됨
      - stretch: 패턴이 늘어남
    */
    border-image: url('antique.png') 35 stretch;
    
    /* 전체 프레임 박스의 크기 및 배치 설정 */
    width: 350px; /* 원하는 크기로 지정 */
    margin: 30px auto;
    background-color: #ffffff; /* 이미지가 로드되기 전이나 투명 영역 뒷받침용 */
    box-sizing: border-box;
}

.antique-frame-box img {
    width: 100%;
    height: auto; /* 이미지의 원래 비율을 유지하며 가로폭에 맞춤 */
    display: block; /* 이미지 아래 미세한 여백 제거 */

        </style>
<script>
(function() {
    // 1. 캔버스 생성 및 스타일 설정 (좌하단 고정, 클릭 방해 안 함)
    const canvas = document.createElement('canvas');
    canvas.id = 'pixel-cobweb';
    canvas.style.position = 'fixed';
    canvas.style.bottom = '0';
    canvas.style.left = '0';
    // 더 작고 선명하게 보이도록 캔버스 크기 축소 (실제 표시 크기)
    canvas.style.width = '250px'; 
    canvas.style.height = '250px';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '999999';
    document.body.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    
    // 내부 해상도 설정 (작을수록 도트가 큼, 해상도를 키우면 도트가 작아짐)
    // 이전 버전(100)보다 해상도를 높여 도트를 작고 촘촘하게 만듭니다.
    const INTERNAL_SIZE = 150; 
    canvas.width = INTERNAL_SIZE;
    canvas.height = INTERNAL_SIZE;
    ctx.imageSmoothingEnabled = false;

    // 2. 체류 시간 및 성장 변수
    let secondsElapsed = 0;
    const maxStages = 10; // 최대 성장 단계

    // 3. 초선명 도트 선 긋기 함수 (정밀한 rect 방식)
    function drawPixelLine(x0, y0, x1, y1) {
        let dx = Math.abs(x1 - x0);
        let dy = Math.abs(y1 - y0);
        let sx = (x0 < x1) ? 1 : -1;
        let sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        // 픽셀 그리드 정렬을 위한 0.5 오프셋 보정
        ctx.save();
        ctx.translate(0.5, 0.5);

        while (true) {
            // rect로 정확한 픽셀 사각형 그리기
            ctx.rect(x0, y0, 1, 1);

            if (x0 === x1 && y0 === y1) break;
            let e2 = 2 * err;
            if (e2 > -dy) {
                err -= dy;
                x0 += sx;
            }
            if (e2 < dx) {
                err += dx;
                y0 += sy;
            }
        }
        ctx.restore();
    }

    // 4. 거미줄 그리기 로직 (색상 및 선명도 개선)
    function drawCobweb(stage) {
        ctx.clearRect(0, 0, INTERNAL_SIZE, INTERNAL_SIZE);
        
        // --- 배경 대응 색상 설정 ---
        // 다크 모드일 때는 흰색 테두리를, 라이트 모드일 때는 진한 회색을 그립니다.
        // CSS 변수를 활용하여 현재 모드를 감지합니다. (body의 color가 흰색이면 다크모드로 간주)
        const bodyColor = getComputedStyle(document.body).color;
        const isDarkMode = bodyColor.includes('255') || bodyColor.includes('rgb(255');

        if (isDarkMode) {
            // 다크 모드용: 밝은 회색 도트 + 약간의 흰색 글로우(테두리) 효과
            ctx.fillStyle = '#d1d1d1'; 
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 1;
        } else {
            // 라이트 모드용: 진한 회색 도트
            ctx.fillStyle = '#555555';
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        // 드로잉 시작
        ctx.beginPath();

        // 중심점 (좌하단 구석)
        const cx = 0;
        const cy = INTERNAL_SIZE;

        // 단계별 방사형 줄(가닥) 개수와 최대 길이 조절
        const rayCount = Math.min(4 + Math.floor(stage * 0.9), 12);
        const maxLen = Math.min(30 + stage * 10, 130);

        let rayEndpoints = [];

        // 방사형 선 그리기
        for (let i = 0; i < rayCount; i++) {
            const angle = (i / (rayCount - 1)) * (Math.PI / 2);
            const length = maxLen * (0.85 + (i % 2) * 0.15);
            
            const ex = Math.round(cx + Math.cos(angle) * length);
            const ey = Math.round(cy - Math.sin(angle) * length);

            rayEndpoints.push({ x: ex, y: ey });
            drawPixelLine(cx, cy, ex, ey);
        }

        // 가로지르는 나선형(곡선) 줄 그리기
        const ringCount = Math.min(Math.floor(stage * 1.1), 10);
        for (let r = 1; r <= ringCount; r++) {
            const ratio = r / (ringCount + 1);
            
            for (let i = 0; i < rayEndpoints.length - 1; i++) {
                const p1x = Math.round(cx + (rayEndpoints[i].x - cx) * ratio);
                const p1y = Math.round(cy + (rayEndpoints[i].y - cy) * ratio);
                const p2x = Math.round(cx + (rayEndpoints[i+1].x - cx) * ratio);
                const p2y = Math.round(cy + (rayEndpoints[i+1].y - cy) * ratio);

                drawPixelLine(p1x, p1y, p2x, p2y);
            }
        }
        
        // 경로 한번에 채우기 (성능 향상 및 픽셀 뭉침 방지)
        ctx.fill();
    }

    // 초기 상태 그리기
    drawCobweb(0);

    // 5. 타이머 설정: 3초마다 성장
    const intervalTime = 3000; 
    const timer = setInterval(() => {
        secondsElapsed++;
        const currentStage = Math.floor((secondsElapsed * 3000) / intervalTime);
        
        if (currentStage <= maxStages) {
            drawCobweb(currentStage);
        } else {
            clearInterval(timer);
        }
    }, intervalTime);

})();
</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap');

        :root {
            --mem-flap-start: #ffffff;
            --mem-flap-end: #e8e8e8;
            --mem-hole-bg: #dcdcdc;
            --mem-modal-bg-grad-start: #dce4eb;
            --mem-modal-bg-grad-end: #f5f5f5;
            --mem-modal-inner-bg: #ffffff;
            --mem-modal-text: #333333;
            --mem-modal-subtext: #555555;
            --mem-icon-bg: #dce4eb;
            --mem-border-color: #d0d0d0;
        }

        .theme-dark, body[data-theme="dark"] {
            --mem-flap-start: #555555;
            --mem-flap-end: #333333;
            --mem-hole-bg: #2d2d2d;
            --mem-modal-bg-grad-start: #333333; 
            --mem-modal-bg-grad-end: #1a1a1a;
            --mem-modal-inner-bg: #222222;
            --mem-modal-text: #e2e8f0;
            --mem-modal-subtext: #a0aec0;
            --mem-icon-bg: #333333;
            --mem-border-color: #555;
        }

        #corner-interaction-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 150px; height: 150px;
            z-index: 9000;
            cursor: pointer;
            display: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
            user-select: none;
        }

        #corner-interaction-wrapper.is-flat { pointer-events: none; cursor: default; }

        .corner-hole {
            position: absolute; top: 0; left: 0; z-index: 1;
            width: 0; height: 0; border-style: solid;
            border-width: 0; 
            border-color: var(--mem-hole-bg) transparent transparent transparent; 
            transition: border-width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.show .corner-hole {
            border-width: 60px 60px 0 0;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .corner-hole {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        
        #corner-interaction-wrapper.is-open .corner-hole {
            border-width: 110px 110px 0 0 !important;
            border-color: var(--mem-border-color) transparent transparent transparent;
            transform: translate(0, 0);
            transition: border-width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .corner-hole { 
            border-width: 0 !important; 
            border-color: var(--mem-hole-bg) transparent transparent transparent; 
        }

        .hidden-emoji-wrapper {
            position: absolute; 
            top: -2px; left: 0; 
            z-index: 5; 
            pointer-events: none;
            
            transform: translate(0px, 0px) scale(0.5) rotate(-15deg);
            opacity: 0;

            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }
        
        #corner-interaction-wrapper.show .hidden-emoji-wrapper {
            opacity: 0.8;
            transform: translate(-15px, -15px) scale(0.5) rotate(-15deg);
            transition-delay: 0.6s;
        }

        #corner-interaction-wrapper.is-open .hidden-emoji-wrapper {
            z-index: 20; opacity: 1;
            transform: translate(15px, 15px) scale(0.7) rotate(0deg); 
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition-delay: 0s;
        }


        #hiddenEmoji {
            font-size: 5.2rem; 
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
            display: block; transition: all 0.2s ease; 
            font-family: 'Noto Color Emoji', sans-serif;
        }
        .emoji-exit { opacity: 0 !important; transform: scale(0.1) !important; }

        .paper-flap {
            position: absolute; 
            top: -1px; left: -1px; 
            z-index: 10;
            width: 0; height: 0;
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            background: linear-gradient(135deg, var(--mem-flap-start) 30%, var(--mem-flap-end) 100%);
            
            filter: drop-shadow(-5px -5px 8px rgba(0,0,0,0.25));
            
            transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none; border-bottom-right-radius: 3px; 
        }

        #corner-interaction-wrapper.show .paper-flap {
            width: 60px; height: 60px;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .paper-flap {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        #corner-interaction-wrapper.is-open .paper-flap {
            width: 110px; height: 110px !important; 
            
            filter: drop-shadow(-8px -8px 16px rgba(0,0,0,0.35)); 
            
            transform: translate(0, 0);
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .paper-flap { width: 0 !important; height: 0 !important; filter: none; }

        @keyframes beckon {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, -2px); }
        }

        .mem-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            justify-content: center;
            align-items: center;

        }
        .mem-modal-frame {
            background: linear-gradient(to bottom, var(--mem-modal-bg-grad-start) 0%, var(--mem-modal-bg-grad-end) 100%);
            border-radius: 0; width: 210px; min-height: 315px; 
            position: relative; display: flex; flex-direction: column; padding: 42px 10px 10px 10px;

        #memModalTitle {

        .mem-close-btn {

        .mem-close-btn:hover { color: #ff9999; }
        .mem-modal-inner {

        .mem-icon-box {

        .mem-modal-icon { 
            font-size: 3.5rem; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));

        }
        .mem-modal-desc {

        .mem-counter-box {

        }
        @keyframes memSnapIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>

        { title: '◇ 꽃잎 책갈피', icon: '🌸', desc: '책상 서랍 깊은 곳에서 찾은 책갈피. \'우리의 영원한 안녕을 바라며\'라는 문구와 함께, 어느 날의 애송이가 건네주었던 꽃잎 하나가 붙어 있다.'},
        { title: '◇ 폭신한 크로핀 인형', icon: '🦭', desc: '다트 대회에서 백발백중으로 따낸 커다란 인형. 의기양양해하는 애송이를 보며, 통령의 입가에는 하루 종일 숨길 수 없는 미소가 걸려 있었다.' },
        { title: '◇ 철 지난 지역 신문', icon: '📰', desc: '여름 축제를 다룬 기사가 1면에 실려 있다. 화려한 불꽃놀이 사진 구석에, 인파를 빠져나가는 두 사람의 뒷모습이 아주 작게 찍혀 있을지도 모른다.' },
        { title: '◇ 사파이어 반지', icon: '💍', desc: '바다를 닮은 푸른 보석이 자리한 약속의 증표. 원석에 작은 흠이라도 나면 가만두지 않겠다는 엄포 속에 장인이 밤을 지새워 만들어냈다는 후문이 있다.' },
        { title: '◇ 메디치 저택의 열쇠', icon: '🗝️', desc: '두 사람이 함께 머무는 저택의 문을 여는 묵직한 열쇠. 손잡이 부분에는 가문을 상징하는 닻 문양과 함께 파도 무늬가 섬세하게 새겨져 있다.' },
        { title: '◇ 낡은 곰인형', icon: '🧸', desc: '악몽이 찾아오던 밤마다 아이의 곁을 지켜주던 애착 인형. 조심스레 품에 안겨주곤 했던 누군가의 온기를 간직한 채, 지금은 침대 머리맡에 놓여 있다.' },
        { title: '◇ 자개로 장식한 머리빗', icon: '🪮', desc: '햇빛을 받으면 자개 장식이 영롱하게 반짝이는 머리빗. 주말 아침, 길고 풍성한 금발을 조심스레 빗어줄 때면 방 안에는 기분 좋은 나른함이 감돈다.' },
        { title: '◇ 은은한 향의 바디로션', icon: '🧴', desc: '욕조에서 한바탕 물장난을 치고 나올 연인을 위해 준비된 로션. 촉촉하게 물기가 남은 살결 위로, 포근한 향과 함께 무심한 듯 다정한 손길이 닿아온다.' },
        { title: '◇ 베개 맡에 두고 간 쪽지', icon: '🛏️', desc: '먼저 일어난 이가 아직 꿈나라를 헤매는 애송이의 머리맡에 남겨둔 쪽지. \'더 자렴. 아침은 거르지 말고.\'라는 간결한 문장에서 은근한 애정이 묻어난다.'},
        { title: '◇ 서툴게 뜬 목도리', icon: '🧣', desc: '겨울 바닷바람이 차다며 애송이가 며칠 밤을 새워 뜬 삐뚤빼뚤한 목도리. 통령은 \'귀찮게 이런 걸 왜 하냐\'면서도 외출할 때면 늘 두르고 나선다.' },
        { title: '◇ 출장용 서류가방', icon: '💼', desc: '긴 출장을 떠날 때마다 챙기는 가방. 짐을 싸는 건 야무진 보좌관의 몫이 된 지 오래다. \'보고 싶을 거예요\'라고 적힌 쪽지와 계피사탕 몇 알이 필수품처럼 들어가 있다.' },
        { title: '◇ 계피 사탕 몇 알', icon: '🍬', desc: '출장 길에 필수품처럼 챙겨가는 사탕. 달짝지근하면서도 알싸한 향이 입안에 퍼질 때면, 자신을 배웅하며 손을 흔들던 울망한 얼굴이 자연스레 떠오른다.' },
        { title: '◇ 정갈한 필체의 편지', icon: '✉️', desc: '<em>...부정했던 시간이 길었던 만큼, 너를 영원히 내 곁에 두고 싶다는 욕심이 났어. 내 삶에 스며든 나의 파도야, 부디 이 닻에 오래도록 머물러 주렴.</em>' },
        { title: '◇ 동글동글한 글씨의 편지', icon: '💌', desc: '<em>...사랑해요, 나의 닻. 함께 발맞춰 걷는 이 해변의 모래사장 위에서, 우리의 그림자가 영원히 하나로 포개지기를 바라요.</em>'}
    ];

    let currentHiddenItem = null;
    const cornerWrapper = document.getElementById('corner-interaction-wrapper');
    const hiddenEmojiSpan = document.getElementById('hiddenEmoji');

    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasTriggeredOpen = false; 

    function getSeenItems() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
    }

    function markItemAsSeen(title) {
        const seen = getSeenItems();
        if (!seen.includes(title)) {
            seen.push(title);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
        }
    }

function initHiddenItem() {
        const STORAGE_KEY_SKIP_NEXT = 'sardina_skip_next';

        window.addEventListener('beforeunload', function() {
            if (localStorage.getItem(STORAGE_KEY_PENDING)) {
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
            }
            localStorage.removeItem(STORAGE_KEY_PENDING);
        });

        document.addEventListener('click', function(e) {
            const targetLink = e.target.closest('a');
            
            if (!targetLink || !targetLink.href || targetLink.target === '_blank' || targetLink.href.startsWith('javascript:')) return;

            if (cornerWrapper.classList.contains('show') && 
                !cornerWrapper.classList.contains('is-open') && 
                !cornerWrapper.classList.contains('is-flat')) {
                
                e.preventDefault(); 

                const emojiEl = document.getElementById('hiddenEmoji');
                if (emojiEl) emojiEl.classList.add('emoji-exit');
                flattenPaper();
                
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
                localStorage.removeItem(STORAGE_KEY_PENDING);

                setTimeout(() => {
                    window.location.href = targetLink.href;
                }, 700);
            }
        });

        if (localStorage.getItem(STORAGE_KEY_SKIP_NEXT)) {
            localStorage.removeItem(STORAGE_KEY_SKIP_NEXT); 
            cornerWrapper.style.display = 'none';
            return; 
        }
        const pendingTitle = localStorage.getItem(STORAGE_KEY_PENDING);
        if (pendingTitle) {
            const found = itemsData.find(item => item.title === pendingTitle);
            if (found) {
                currentHiddenItem = found;
                displayItem(found);
                return;
            }
        }

        let shouldAppear = false;
        let currentSeenList = getSeenItems();
        const hasFoundFirstItem = currentSeenList.length > 0;

        if (!hasFoundFirstItem) {
            let searchCount = parseInt(localStorage.getItem(STORAGE_KEY_FIRST_SEARCH)) || 0;
            searchCount++;
            localStorage.setItem(STORAGE_KEY_FIRST_SEARCH, searchCount);

            if (searchCount >= 3) {
                shouldAppear = true;
            } else {
                shouldAppear = Math.random() <= APPEAR_PROBABILITY;
            }
        } else {
            shouldAppear = Math.random() <= APPEAR_PROBABILITY;
        }

        if (!shouldAppear) {
            cornerWrapper.style.display = 'none';
            return; 
        } else {
            if (!hasFoundFirstItem) {
                localStorage.removeItem(STORAGE_KEY_FIRST_SEARCH);
            }
        }

        if (currentSeenList.length >= itemsData.length) {
            currentSeenList = [];
            localStorage.removeItem(STORAGE_KEY);
        }

        const weightedPool = [];
        itemsData.forEach(item => {
            const isSeen = currentSeenList.includes(item.title);
            const weight = isSeen ? 1 : 100; 
            for(let i=0; i < weight; i++) weightedPool.push(item);
        });

        const randomIndex = Math.floor(Math.random() * weightedPool.length);
        currentHiddenItem = weightedPool[randomIndex];

        localStorage.setItem(STORAGE_KEY_PENDING, currentHiddenItem.title);
        displayItem(currentHiddenItem);
    }

    function displayItem(item) {
        hiddenEmojiSpan.innerText = item.icon;
        cornerWrapper.style.display = 'block';
        
        addInteractionEvents();

        setTimeout(() => {
            cornerWrapper.classList.add('show');
        }, 100);
    }

function addInteractionEvents() {
        cornerWrapper.addEventListener('touchstart', handleStart, {passive: false});
        cornerWrapper.addEventListener('touchmove', handleMove, {passive: false});
        cornerWrapper.addEventListener('touchend', handleEnd);

        cornerWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove); 
        window.addEventListener('mouseup', handleEnd);
        
        cornerWrapper.addEventListener('click', function(e) {
            if (!hasTriggeredOpen && isInsideCorner(e)) {
                togglePaper();
            }
        });
    }

        function isInsideCorner(e) {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return true;

        const rect = cornerWrapper.getBoundingClientRect();
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        
        const localX = clientX - rect.left;
        const localY = clientY - rect.top;

        return (localX + localY) <= 100;
    }

    function handleStart(e) {
        if (cornerWrapper.classList.contains('is-open')) return;

        if (!isInsideCorner(e)) return;

        isDragging = true;
        hasTriggeredOpen = false;

        if (e.type === 'touchstart') {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else {
            startX = e.clientX;
            startY = e.clientY;
        }
    }

    function handleMove(e) {
        if (!isDragging || hasTriggeredOpen) return;

        let currentX, currentY;

        if (e.type === 'touchmove') {
            if(e.cancelable) e.preventDefault(); 
            currentX = e.touches[0].clientX;
            currentY = e.touches[0].clientY;
        } else {
            currentX = e.clientX;
            currentY = e.clientY;
        }

        const moveX = currentX - startX;
        const moveY = currentY - startY;
        
        if ((moveX + moveY) > 50) { 
            togglePaper();
            hasTriggeredOpen = true; 
            isDragging = false; 
        }
    }

    function handleEnd(e) {
        isDragging = false;
    }

    function togglePaper() {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return;
        
        cornerWrapper.classList.add('is-open');

        if (currentHiddenItem) {
            markItemAsSeen(currentHiddenItem.title);
            localStorage.removeItem(STORAGE_KEY_PENDING);
        }

        setTimeout(() => {
            const emojiEl = document.getElementById('hiddenEmoji');
            if(emojiEl) emojiEl.classList.add('emoji-exit');
        }, 600);

        setTimeout(() => {
            if (currentHiddenItem) {
                const index = itemsData.indexOf(currentHiddenItem) + 1;
                const total = itemsData.length;
                openModal(currentHiddenItem.title, currentHiddenItem.icon, currentHiddenItem.desc, index, total);
            }
        }, 700);
    }

    function openModal(title, icon, desc, index, total) {
        const modal = document.getElementById('itemModal');
        document.getElementById('memModalTitle').innerText = title;
        document.getElementById('memModalIcon').innerText = icon;
        document.getElementById('memModalDesc').innerHTML = desc;

        document.getElementById('memItemCounter').innerText = `${index} / ${total} 번째 기억`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('itemModal').style.display = 'none';
        flattenPaper(); 
    }

    function flattenPaper() {
        cornerWrapper.classList.remove('is-open'); 
        cornerWrapper.classList.add('is-flat');      
    }

    return {
        init: initHiddenItem,
        closeModal: closeModal
    };
})();

window.addEventListener('load', function() {
    SardinaMemory.init();
});
    </script>
</div>

    // 설정할 목표 날짜 (YYYY-MM-DD 형식으로 입력하세요)
    const targetDate = new Date("2026-12-31T00:00:00");
    
    function updateDDay() {
      const today = new Date();
      
      const distance = targetDate.setHours(0,0,0,0) - today.setHours(0,0,0,0);
      const diffDays = Math.ceil(distance / (1000 * 60 * 60 * 24));
      
      const counterEl = document.getElementById("d-day-counter");
      
      if (diffDays > 0) {
        counterEl.innerText = `D - ${diffDays}`;
      } else if (diffDays === 0) {
        counterEl.innerText = `D - DAY 🎉`;
      } else {
        counterEl.innerText = `D + ${Math.abs(diffDays)}`;
      }
    }

    updateDDay();
  </script>

<style>
  .pet-widget {
    --pet-ink: #3a2e26;
    --pet-cream: #fbf3e7;
    --pet-panel: #fff8ef;
    --pet-hunger: #e8a33d;
    --pet-joy: #6fb3a8;
    --pet-accent: #c9704f;

    width: 260px;
    padding: 16px;
    border-radius: 18px;
    background: var(--pet-panel);
    border: 2px solid var(--pet-ink);
    box-shadow: 4px 4px 0 var(--pet-ink);
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--pet-ink);
    box-sizing: border-box;
  }

  .pet-stage {
    position: relative;
    height: 120px;
    border-radius: 12px;
    background: var(--pet-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: visible;
  }

  .pet-sprite {
    font-size: 52px;
    line-height: 1;
    animation: pet-bob 2.4s ease-in-out infinite;
  }

  @keyframes pet-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .pet-speech {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translate(-50%, -100%) scale(0.9);
    background: #fff;
    border: 2px solid var(--pet-ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  .pet-speech.show {
    opacity: 1;
    transform: translate(-50%, -110%) scale(1);
  }

  .pet-label {
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .pet-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .pet-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pet-bar-icon {
    font-size: 13px;
    width: 16px;
    text-align: center;
  }

  .pet-bar-track {
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(58, 46, 38, 0.12);
    overflow: hidden;
  }

  .pet-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .pet-bar-fill.hunger { background: var(--pet-hunger); }
  .pet-bar-fill.joy { background: var(--pet-joy); }

  .pet-stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: 0.75;
    margin-bottom: 10px;
  }

  .pet-away-notice {
    display: none;
    font-size: 11px;
    text-align: center;

    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 8px;
  }

  .pet-widget.is-away .pet-away-notice { display: block; }
  .pet-widget.is-away #pet-actions { display: none; }
  .pet-find-row { display: none; }
  .pet-widget.is-away .pet-find-row { display: flex; }

  .pet-actions {
    display: flex;
    gap: 6px;
  }

    color: #fff;
  }

  .pet-actions button:active {
    transform: scale(0.95);
  }
</style>

<script>
(function () {
  const PET_API_URL = 'https://script.google.com/macros/s/AKfycbzbnaQTr8esxEbwjc-kHWBSTJ-um3QdQ1PYsX2gj9_ntnRDze1XEj1oHvrEPOorRBqH/exec'; // ← 교체

  const STAGE_EMOJI = { 1: '🥚', 2: '🐣', 3: '🐥', 4: '🐤', 5: '🦉' };

  async function petAction(act) {
    try {
      const res = await fetch(PET_API_URL, {
        method: 'POST',
        body: new URLSearchParams({ act })
      });
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 액션 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 API 호출 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  async function petStatus() {
    try {
      const res = await fetch(PET_API_URL);
      const data = await res.json();
      if (data.ok) updateUI(data);
      else alert('펫 상태 조회 실패: ' + data.error); // 디버깅용 — 문제 해결 후 지우세요
    } catch (err) {
      alert('펫 상태 조회 오류: ' + err); // 디버깅용 — 문제 해결 후 지우세요
    }
  }

  function updateUI(data) {
    const s = data.state;
    document.getElementById('pet-stage-label').textContent = s.stageLabel;
    document.getElementById('pet-hunger-bar').style.width = s.hunger + '%';
    document.getElementById('pet-joy-bar').style.width = s.joy + '%';
    document.getElementById('pet-bond').textContent = s.bond;
    document.getElementById('pet-exp').textContent = s.exp;

    const widget = document.getElementById('pet-widget');
    widget.classList.toggle('is-away', !!s.away);
    document.getElementById('pet-last-seen').textContent = s.lastSeen || '-';
    document.getElementById('pet-sprite').textContent = s.away ? '❓' : (STAGE_EMOJI[s.stage] || '🥚');

    if (data.saying) showSpeech(data.saying);
  }

  let speechTimer = null;
  function showSpeech(text) {
    const bubble = document.getElementById('pet-speech');
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => bubble.classList.remove('show'), 2600);
  }

  document.addEventListener('DOMContentLoaded', function () {
    petStatus();
    document.getElementById('pet-feed-btn').addEventListener('click', () => petAction('feed'));
    document.getElementById('pet-pet-btn').addEventListener('click', () => petAction('pet'));
    document.getElementById('pet-greet-btn').addEventListener('click', () => petAction('greet'));
    document.getElementById('pet-find-btn').addEventListener('click', () => petAction('find'));
  });
})();
</script>
