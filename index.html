<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お試しキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5); /* 어두운 반투명 배경 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-gif {
  width: 80px;
  height: auto;
}
    
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-color: black;
    margin: 0;
    padding: 50px 0;
}

.outer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 120px; /* 여러 개의 액자 프레임 사이의 간격 */
    padding: 75px; 
}

.frame-container {
    position: relative; 
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    margin-bottom: 120px; /* 액자 사이의 간격 */
    
    /* 애니메이션 초기 상태 (컨테이너 전체에 적용) */
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

/* 스크롤에 의해 show 클래스가 붙었을 때 애니메이션 실행 */
.frame-container.show {
    opacity: 1;
    transform: translateY(0);
}

/* 테두리를 위로 올리기 위해 가상 요소(::after) 활용 */
.frame-container::after {
    content: "";
    position: absolute;
    top: -45px;
    left: -45px;
    right: -45px;
    bottom: -45px;
    
    border-image-source: url('border.png');
    border-image-slice: 20%;
    border-width: 60px;
    border-style: solid;
    border-image-repeat: round;
    z-index: 10; 
    pointer-events: none; 
}

.frame-container img {
    display: block;
    width: 400px; 
    height: auto;
    position: relative;
    z-index: 1; 
}

.sticky-hamburger {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    
    /* バロック調のゴールドグラデーション（少し落ち着きのある気品ある色合い） */
    background: linear-gradient(135deg, #d4af37, #fff8dc, #aa771c);
    border: 1px solid #4a3505;
    color: #3b2808;
    
    /* サイズを小さく調整 */
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1;
    
    cursor: pointer;
    
    /* 贅沢感を演出する二重の影と角丸 */
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.6);
    border-radius: 2px;
    
    /* スムーズなアニメーション */
    transition: all 0.3s ease;
}

.sticky-hamburger:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #ffe066, #fffff0, #d4af37);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.8);
}

.sticky-hamburger:active {
    transform: translateY(0);
}

        /* 2. 편지 메뉴 컨테이너 */
        .royal-menu-container {
            position: fixed;
            top: 90px;
            left: -320px;
            width: 150px;
            z-index: 999;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .royal-menu-container.open {
            left: 20px;
        }

        /* 3. 액자 컨테이너 및 가상 요소 적용 방식 */
        .royal-scroll-sheet {
            position: relative;
            background-color: #f4ebd0; /* 양피지 질감 배경 */
            color: #3b220c;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 10px 15px 30px rgba(0, 0, 0, 0.8);
        }

        .royal-scroll-sheet::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -35px;
            right: -35px;
            bottom: -25px;
            border-image-source: url('frame.png');
            border-image-slice: 34%;
            border-width: 50px;
            border-style: solid;
            border-image-repeat: round;
            z-index: 10;
            pointer-events: none;
        }

        /* 4. 메뉴 내용 및 소분류 디자인 */
        .royal-scroll-sheet h2 {
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: #5a3d02;
            position: relative;
            z-index: 11;
        }

        .royal-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 11;
        }

        .royal-menu-item {
            margin-bottom: 8px;
        }

        .menu-toggle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px dashed #d3bc8b;
            color: #4a3319;
            font-weight: bold;
            font-size: 14px;
            font-family: 'Georgia', serif;
            padding: 6px 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-toggle-btn:hover {
            color: #b8860b;
            background-color: rgba(184, 134, 11, 0.1);
        }

        /* 소분류 (아코디언) */
        .submenu {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s ease;
            border-left: 2px solid #c5a059;
        }

        .royal-menu-item.active .submenu {
            max-height: 200px;
            padding-top: 5px;
            padding-bottom: 5px;
            transition: max-height 0.4s ease-in;
        }

        .submenu li a {
            color: #6b5336;
            text-decoration: none;
            font-size: 12px;
            display: block;
            padding: 3px 0;
        }

        .submenu li a:hover {
            color: #b8860b;
            text-decoration: underline;
        }

</style>
</head>
<body>    
     <div class="outer-wrap">
         <div class="frame-container">
             <img src="image.png" alt="image">
         </div>
         <div class="frame-container">
             <img src="bach.jpg" alt="image">
         </div>
         <div class="frame-container">
             <img src="chopin.JPG" alt="image">
         </div>
         <div class="frame-container">
             <img src="liszt.png" alt="image">
         </div>
     </div>
    
<button class="sticky-hamburger" onclick="toggleRoyalMenu()">
        <span>📜 칙서</span>
    </button>

    <div class="royal-menu-container" id="royalMenu">
        <div class="royal-scroll-sheet">
            <h2>Decrees</h2>
            <ul class="royal-menu-list">
                <li class="royal-menu-item" id="menu1">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu1')">⚖️ 국왕실 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 침실</a></li>
                        <li><a href="#">- 집무실</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu2">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu2')">🛡️ 복도 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 갤러리</a></li>
                        <li><a href="#">- 서재</a></li>
                        <li><a href="#">- 정자</a></li>
                    </ul>
                </li>
                <li class="royal-menu-item" id="menu3">
                    <button class="menu-toggle-btn" onclick="toggleSubmenu('menu3')">⚔️ 접견실 ▾</button>
                    <ul class="submenu">
                        <li><a href="#">- 티 테이블</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>


<!-- 로딩 오버레이와 스피너 HTML 구조 -->
<div id="loading" class="loading-container">
  <img src="spinda.gif" alt="spinning..." class="loading-gif">
</div>
     
<script>
async function loadData() {
  const loader = document.getElementById('loading');

  try {
    // 가짜 2초 대기 (실제 API 호출 대신 테스트용)
    await new Promise(resolve => setTimeout(resolve, 2000));
  } finally {
    loader.style.display = 'none';
  }
}

loadData();
</script>

    <style>


        /* 플로팅 버튼 스타일 (우측 하단 고정) */
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #52b788;
            color: #081c15;
            border: none;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.2s, background 0.2s;
        }
        .floating-btn:hover {
            transform: scale(1.1);
            background: #74c69d;
        }

        /* 플로팅 아이콘 옆에 뜨는 게임 팝오버 박스 */
        .game-popover {
            position: fixed;
            bottom: 95px;
            right: 20px;
            background: #1b4332;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #52b788;
            max-width: 360px;
            width: calc(100vw - 40px);
            z-index: 999;
            display: none;
            animation: popIn 0.2s ease-out forwards;
        }
        .game-popover.active {
            display: block;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 { font-size: 18px; margin: 0 0 4px 0; color: #b7e4c7; text-align: center; }
        p { font-size: 11px; color: #95d5b2; margin: 0 0 8px 0; text-align: center; }

        .grid-maze {
            display: grid;
            grid-template-columns: repeat(15, 18px);
            grid-template-rows: repeat(15, 18px);
            gap: 1px; background: #081c15;
            padding: 6px; margin: 6px auto;
            width: fit-content; border-radius: 8px;
            border: 2px solid #52b788;
        }
        .cell {
            width: 18px; height: 18px;
            background: #d8f3dc;
            border-radius: 1px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
        }
        .wall { 
            background: #2d6a4f;
            border-radius: 2px;
        }
        .goal { 
            background: #ffb703;
            border-radius: 2px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(2, 40px);
            gap: 5px;
            justify-content: center;
            margin-top: 8px;
        }
        .ctrl-btn {
            background: #52b788; color: #081c15;
            border: none; border-radius: 10px;

            cursor: pointer;

            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .ctrl-btn:active { background: #40916c; transform: scale(0.93); color: white; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .restart-btn {
            margin-top: 8px; padding: 6px 14px;
            background: #2d6a4f; color: white;
            border: 1px solid #52b788; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .restart-btn:active { background: #1b4332; }

        /* 화면 한가운데에 뜨는 토스트 메시지 스타일 */
        .toast-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ffb703;
            color: #081c15;
            padding: 16px 32px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
    <!-- 플로팅 토글 버튼 -->
    <button class="floating-btn" id="floatingToggleBtn">🌿</button>
    <!-- 화면 한가운데에 나타날 토스트 메시지 -->
    <div id="toastMessage" class="toast-message">잡았다!</div>
    <!-- 플로팅 아이콘 옆에 뜨는 게임 팝오버 박스 -->
    <div class="game-popover" id="gamePopover">
        <h1>🌿 이상한 나라의 숲속 미로</h1>
        <p>👧(앨리스)를 움직여 🫖(찻주전자) 목적지에 도달하세요!</p>
        
        <div id="gridMaze" class="grid-maze"></div>

        <div class="d-pad">
            <button class="ctrl-btn btn-up" id="move-up">⬆️</button>
            <button class="ctrl-btn btn-left" id="move-left">⬅️</button>
            <button class="ctrl-btn btn-down" id="move-down">⬇️</button>
            <button class="ctrl-btn btn-right" id="move-right">➡️</button>
        </div>

        <button class="restart-btn" id="btn-restart">🔄 New Round</button>
    </div>

    <script>
        const gridContainer = document.getElementById('gridMaze');
        const restartBtn = document.getElementById('btn-restart');
        const floatingToggleBtn = document.getElementById('floatingToggleBtn');
        const gamePopover = document.getElementById('gamePopover');
        const toastMessage = document.getElementById('toastMessage');

        const SIZE = 15; 
        let mazeMap = [];
        let player = { x: 0, y: 0 };
        let cells = [];
        let isGameInitialized = false;

        // 플로팅 버튼 클릭 시 게임 팝오버 열기/닫기
        floatingToggleBtn.addEventListener('click', () => {
            gamePopover.classList.toggle('active');
            if (gamePopover.classList.contains('active') && !isGameInitialized) {
                initMaze();
                isGameInitialized = true;
            }
        });

        // 토스트 메시지 출력 함수 (화면 정중앙)
        function showToast(message) {
            toastMessage.textContent = message;
            toastMessage.classList.add('show');
            setTimeout(() => {
                toastMessage.classList.remove('show');
            }, 1200);
        }

        function generateProceduralMaze() {
            let map;
            let goalX, goalY;

            while (true) {
                map = Array.from({ length: SIZE }, () => Array(SIZE).fill(1));

                function isValid(x, y) {
                    return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
                }

                function carve(x, y) {
                    map[y][x] = 0;

                    const directions = [
                        { dx: 0, dy: -2 },
                        { dx: 0, dy: 2 },
                        { dx: -2, dy: 0 },
                        { dx: 2, dy: 0 }
                    ].sort(() => Math.random() - 0.5);

                    for (let dir of directions) {
                        let nx = x + dir.dx;
                        let ny = y + dir.dy;

                        if (isValid(nx, ny) && map[ny][nx] === 1) {
                            map[y + dir.dy / 2][x + dir.dx / 2] = 0;
                            carve(nx, ny);
                        }
                    }
                }

                carve(0, 0);

                for (let i = 1; i < SIZE - 1; i++) {
                    for (let j = 1; j < SIZE - 1; j++) {
                        if (map[i][j] === 1 && Math.random() < 0.12) {
                            map[i][j] = 0;
                        }
                    }
                }

                map[0][0] = 0;

                let availableGoals = [];
                for (let r = SIZE - 4; r < SIZE; r++) {
                    for (let c = SIZE - 4; c < SIZE; c++) {
                        if (map[r][c] === 0 && !(r === 0 && c === 0)) {
                            availableGoals.push({ r, c });
                        }
                    }
                }

                if (availableGoals.length > 0) {
                    let chosen = availableGoals[Math.floor(Math.random() * availableGoals.length)];
                    goalY = chosen.r;
                    goalX = chosen.c;
                    map[goalY][goalX] = 2;
                    break;
                }
            }

            return map;
        }

        function initMaze() {
            mazeMap = generateProceduralMaze();
            player = { x: 0, y: 0 };
            gridContainer.innerHTML = '';
            cells = [];

            gridContainer.style.gridTemplateColumns = `repeat(${SIZE}, 18px)`;
            gridContainer.style.gridTemplateRows = `repeat(${SIZE}, 18px)`;

            for (let r = 0; r < SIZE; r++) {
                cells[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (mazeMap[r][c] === 1) cell.classList.add('wall');
                    if (mazeMap[r][c] === 2) {
                        cell.classList.add('goal');
                        cell.innerHTML = '🫖';
                    }
                    gridContainer.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (mazeMap[r][c] !== 2) {
                        cells[r][c].innerHTML = '';
                    } else {
                        cells[r][c].innerHTML = '🫖';
                    }
                }
            }
            cells[player.y][player.x].innerHTML = '👧';
        }

        function movePlayer(dx, dy) {
            if (!gamePopover.classList.contains('active')) return;

            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && mazeMap[ny][nx] !== 1) {
                player.x = nx;
                player.y = ny;
                updatePlayerPosition();

                if (mazeMap[ny][nx] === 2) {
                    setTimeout(() => {
                        showToast('잡았다!');
                        initMaze(); 
                    }, 100);
                }
            }
        }

        restartBtn.addEventListener('click', () => {
            initMaze();
        });

        document.getElementById('move-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('move-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('move-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('move-right').addEventListener('click', () => movePlayer(1, 0));

        window.addEventListener('keydown', (e) => {
            if (!gamePopover.classList.contains('active')) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); 
            }
            if (e.key === 'ArrowUp') movePlayer(0, -1);
            if (e.key === 'ArrowDown') movePlayer(0, 1);
            if (e.key === 'ArrowLeft') movePlayer(-1, 0);
            if (e.key === 'ArrowRight') movePlayer(1, 0);
        });
    </script>
</body>
</html>
