    /* 기본 초기화 */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #f9f9f9;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background-color: #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 햄버거 버튼 디자인 */
.hamburger-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 30px;
  height: 22px;
  z-index: 1001;
}

.hamburger-btn span {
  display: block;
  width: 100%;
  height: 3px;
  background-color: #333;
  transition: all 0.3s ease;
}

/* 햄버거 버튼 클릭 시 X자로 변하는 애니메이션 */
.hamburger-btn.is-active span:nth-child(1) {
  transform: translateY(9.5px) rotate(45deg);
}
.hamburger-btn.is-active span:nth-child(2) {
  opacity: 0;
}
.hamburger-btn.is-active span:nth-child(3) {
  transform: translateY(-9.5px) rotate(-45deg);
}

.slide-menu {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  
  /* 배경색을 예쁜 하늘색이나 어두운 톤으로 깔고, 구름 이미지를 반복 또는 배치합니다 */
  background-color: #1a2a3a; /* 구름이 돋보이는 어두운 남색 계열 (원하시는 색으로 변경 가능) */
  background-image: url('window.png');
  background-size: 200px; /* 구름 이미지의 크기 조절 */
  background-repeat: no-repeat; /* 구름 패턴처럼 반복해서 배치 */
  background-position: top 20px right 20px;
  
  box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
  transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
  z-index: 1000;
  overflow-y: auto;
}


/* 햄버거 버튼 클릭 시 슬라이드 인 */
.slide-menu.is-active {
  right: 0;
}
/* 메뉴 리스트 스타일 */
.menu-list {
  list-style: none;
  padding: 90px 40px 40px 40px;
  margin: 0;
}

.menu-item {
  margin-bottom: 24px;
}

.menu-title a {
  font-size: 24px;
  font-weight: bold;
  text-decoration: none;
  color: #222;
  transition: color 0.2s;
  text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8); /* 구름 배경 위 글자 가독성 확보 */
}

.sub-menu a {
  font-size: 16px;
  color: #444;
  text-decoration: none;
  transition: color 0.2s;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8); /* 소분류 글자도 동일하게 적용 */
}

.menu-title a:hover {
  color: #007bff;
}

/* 소분류 열기/닫기 토글 버튼 */

  background: none;

  cursor: pointer;

  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 소분류 메뉴 스타일 (아코디언 구조) */
.sub-menu {
  list-style: none;
  padding: 0;
  margin: 8px 0 0 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease-out, padding 0.35s ease-out;
}

.sub-menu li {
  margin-top: 8px;
  background: rgba(255, 255, 255, 0.85); /* 소분류 글자 뒤에도 동일하게 배경 적용 */
  padding: 8px 14px;
  border-radius: 6px;
}

.sub-menu a {
  font-size: 15px;
  color: #444;
  text-decoration: none;
  display: block;
}

/* 소분류가 열렸을 때 */
.menu-item.is-open .sub-menu {
  max-height: 400px;
}

  <script>
    document.addEventListener('DOMContentLoaded', () => {
  // 1. 햄버거 메뉴 열기/닫기 토글
  const hamburgerBtn = document.querySelector('.hamburger-btn');
  const slideMenu = document.querySelector('.slide-menu');

  hamburgerBtn.addEventListener('click', () => {
    slideMenu.classList.toggle('is-active');
    hamburgerBtn.classList.toggle('is-active');
  });

  // 2. 소분류 아코디언 메뉴 토글 (가변 길이 대응)
  const subToggleBtns = document.querySelectorAll('.toggle-sub');

  subToggleBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const menuItem = e.target.closest('.menu-item');
      menuItem.classList.toggle('is-open');
      
      // 버튼 아이콘 기호 변경 (+ / -)
      if (menuItem.classList.contains('is-open')) {
        btn.textContent = '-';
      } else {
        btn.textContent = '+';
      }
    });
  });
});


  </script>
</body>
