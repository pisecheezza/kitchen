<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구름 배경 슬라이드 메뉴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 메인 헤더 영역 -->
  <header class="main-header">
    <h1>My Website</h1>
    <!-- 햄버거 버튼 -->
    <button class="hamburger-btn" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- 슬라이드 메뉴 레이아웃 -->
<!-- 슬라이드 메뉴 레이아웃 -->
<nav class="slide-menu">
  <!-- (기존의 <div class="menu-background"></div>는 삭제했습니다) -->

  <ul class="menu-list">
    <!-- 대분류 1 (소분류 있음) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Service</a>
        <button class="toggle-sub" aria-label="소분류 열기">+</button>
      </div>
      <ul class="sub-menu">
        <li><a href="#none">Web Design</a></li>
        <li><a href="#none">Development</a></li>
        <li><a href="#none">Marketing</a></li>
      </ul>
    </li>

    <!-- 대분류 2 (단독) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">About</a>
      </div>
    </li>

    <!-- 대분류 3 (소분류 있음) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Portfolio</a>
        <button class="toggle-sub" aria-label="소분류 열기">+</button>
      </div>
      <ul class="sub-menu">
        <li><a href="#none">Project A</a></li>
        <li><a href="#none">Project B</a></li>
        <li><a href="#none">Project C</a></li>
        <li><a href="#none">Project D</a></li>
      </ul>
    </li>

    <!-- 대분류 4 (단독) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Contact</a>
      </div>
    </li>
  </ul>
</nav>

  <style>
/* 기본 초기화 */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #f9f9f9;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background-color: #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 햄버거 버튼 디자인 */
.hamburger-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 30px;
  height: 22px;
  z-index: 1001;
}

.hamburger-btn span {
  display: block;
  width: 100%;
  height: 3px;
  background-color: #333;
  transition: all 0.3s ease;
}

.hamburger-btn.is-active span:nth-child(1) {
  transform: translateY(9.5px) rotate(45deg);
}
.hamburger-btn.is-active span:nth-child(2) {
  opacity: 0;
}
.hamburger-btn.is-active span:nth-child(3) {
  transform: translateY(-9.5px) rotate(-45deg);
}

/* 슬라이드 메뉴: 구름 이미지만 배경으로 사용 (배경색 없음) */
.slide-menu {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  
  /* 구름 이미지 파일 연결 */
  background-image: url('window.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  
  box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
  transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
  z-index: 1000;
  overflow-y: auto;
}

/* 햄버거 버튼 클릭 시 슬라이드 인 */
.slide-menu.is-active {
  right: 0;
}

/* 메뉴 리스트 스타일 */
.menu-list {
  list-style: none;
  padding: 90px 30px 40px 30px;
  margin: 0;
}

.menu-item {
  margin-bottom: 24px;
}

/* 구름 배경 위에 글자 바로 배치 (배경 박스 없음) */
.menu-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu-title a {
  font-size: 24px;
  font-weight: bold;
  text-decoration: none;
  color: #ffffff; /* 구름 위에서 돋보이는 흰색 */
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); /* 가독성을 위한 그림자 */
}

/* 소분류 열기/닫기 토글 버튼 */
.toggle-sub {
  background: none;
  border: none;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  color: #ffffff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 소분류 메뉴 스타일 (아코디언 구조) */
.sub-menu {
  list-style: none;
  padding: 0 0 0 10px;
  margin: 8px 0 0 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease-out, padding 0.35s ease-out;
}

.sub-menu li {
  margin-top: 10px;
}

.sub-menu a {
  font-size: 16px;
  color: #f0f0f0; /* 소분류도 흰색 계열로 설정 */
  text-decoration: none;
  display: block;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

/* 소분류가 열렸을 때 */
.menu-item.is-open .sub-menu {
  max-height: 400px;
  padding-top: 4px;
}

  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
  // 1. 햄버거 메뉴 열기/닫기 토글
  const hamburgerBtn = document.querySelector('.hamburger-btn');
  const slideMenu = document.querySelector('.slide-menu');

  hamburgerBtn.addEventListener('click', () => {
    slideMenu.classList.toggle('is-active');
    hamburgerBtn.classList.toggle('is-active');
  });

  // 2. 소분류 아코디언 메뉴 토글 (가변 길이 대응)
  const subToggleBtns = document.querySelectorAll('.toggle-sub');

  subToggleBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const menuItem = e.target.closest('.menu-item');
      menuItem.classList.toggle('is-open');
      
      // 버튼 아이콘 기호 변경 (+ / -)
      if (menuItem.classList.contains('is-open')) {
        btn.textContent = '-';
      } else {
        btn.textContent = '+';
      }
    });
  });
});


  </script>
</body>
</html>
