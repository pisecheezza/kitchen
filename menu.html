<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금색 액자 적용</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="frame-container">
        <img src="image.png" alt="캐릭터 이미지">
    </div>

  <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a; /* 액자가 돋보이도록 어두운 배경 설정 */
    margin: 0;
}

.frame-container {
    /* 1. 새로운 테두리 이미지 경로 */
    border-image-source: url('border.png');
    
    /* 2. 퍼센트(%) 단위를 사용하여 이미지 전체 크기에 맞춰 유연하게 9분할 */
    border-image-slice: 35%;
    
    /* 3. 테두리 두께 설정 (액자의 두께감에 따라 숫자를 조절하세요) */
    border-width: 50px;
    border-style: solid;
    
    /* 4. 패턴 반복 방식 */
    border-image-repeat: round;
    
    /* 5. 정렬 및 내부 공간 최적화 */
    display: inline-block;
    line-height: 0;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
}

.frame-container img {
    display: block;
    max-width: 90%;
    height: auto;
}

  </style>

</body>
</html>
