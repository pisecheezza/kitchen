<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구름 배경 슬라이드 메뉴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 메인 헤더 영역 -->
  <header class="main-header">
    <h1>My Website</h1>
    <!-- 햄버거 버튼 -->
    <button class="hamburger-btn" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- 슬라이드 메뉴 레이아웃 -->
<!-- 슬라이드 메뉴 레이아웃 -->
<nav class="slide-menu">
  <!-- (기존의 <div class="menu-background"></div>는 삭제했습니다) -->

  <ul class="menu-list">
    <!-- 대분류 1 (소분류 있음) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Service</a>
        <button class="toggle-sub" aria-label="소분류 열기">+</button>
      </div>
      <ul class="sub-menu">
        <li><a href="#none">Web Design</a></li>
        <li><a href="#none">Development</a></li>
        <li><a href="#none">Marketing</a></li>
      </ul>
    </li>

    <!-- 대분류 2 (단독) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">About</a>
      </div>
    </li>

    <!-- 대분류 3 (소분류 있음) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Portfolio</a>
        <button class="toggle-sub" aria-label="소분류 열기">+</button>
      </div>
      <ul class="sub-menu">
        <li><a href="#none">Project A</a></li>
        <li><a href="#none">Project B</a></li>
        <li><a href="#none">Project C</a></li>
        <li><a href="#none">Project D</a></li>
      </ul>
    </li>

    <!-- 대분류 4 (단독) -->
    <li class="menu-item">
      <div class="menu-title">
        <a href="#none">Contact</a>
      </div>
    </li>
  </ul>
</nav>

  <style>
    /* 기본 초기화 */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #f9f9f9;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background-color: #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 햄버거 버튼 디자인 */
.hamburger-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 30px;
  height: 22px;
  z-index: 1001;
}

.hamburger-btn span {
  display: block;
  width: 100%;
  height: 3px;
  background-color: #333;
  transition: all 0.3s ease;
}

/* 햄버거 버튼 클릭 시 X자로 변하는 애니메이션 */
.hamburger-btn.is-active span:nth-child(1) {
  transform: translateY(9.5px) rotate(45deg);
}
.hamburger-btn.is-active span:nth-child(2) {
  opacity: 0;
}
.hamburger-btn.is-active span:nth-child(3) {
  transform: translateY(-9.5px) rotate(-45deg);
}

/* 슬라이드 메뉴 기본 스타일 (구름 배경 직접 적용) */
.slide-menu {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  
  /* 구름 이미지와 은은한 흰색 오버레이를 동시에 적용 */
  background-image: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)), 
                    url('https://images.unsplash.com/photo-1534088568595-a066fa41088a?auto=format&fit=crop&w=1000&q=80');
  background-size: cover;
  background-position: center;
  
  box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
  transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
  z-index: 1000;
  overflow-y: auto; /* 내용이 길어지면 스크롤 가능 */
}

/* 햄버거 버튼 클릭 시 슬라이드 인 */
.slide-menu.is-active {
  right: 0;
}
/* 메뉴 리스트 스타일 */
.menu-list {
  list-style: none;
  padding: 90px 40px 40px 40px;
  margin: 0;
}

.menu-item {
  margin-bottom: 24px;
}

.menu-title a {
  font-size: 24px;
  font-weight: bold;
  text-decoration: none;
  color: #222;
  transition: color 0.2s;
  text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8); /* 구름 배경 위 글자 가독성 확보 */
}

.sub-menu a {
  font-size: 16px;
  color: #444;
  text-decoration: none;
  transition: color 0.2s;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8); /* 소분류 글자도 동일하게 적용 */
}

.menu-title a:hover {
  color: #007bff;
}

/* 소분류 열기/닫기 토글 버튼 */
.toggle-sub {
  background: none;
  border: none;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  color: #555;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s;
}

/* 소분류 메뉴 스타일 (아코디언 구조) */
.sub-menu {
  list-style: none;
  padding: 0 0 0 10px;
  margin: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease-out, padding 0.35s ease-out;
}

.sub-menu li {
  margin-top: 12px;
}

.sub-menu a {
  font-size: 16px;
  color: #666;
  text-decoration: none;
  transition: color 0.2s;
}

.sub-menu a:hover {
  color: #007bff;
}

/* 소분류가 열렸을 때 (JS로 .is-open 클래스 제어) */
.menu-item.is-open .sub-menu {
  max-height: 400px; /* 소분류가 늘어나도 충분히 수용할 수 있는 넉넉한 높이 */
  padding-top: 6px;
}

  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
  // 1. 햄버거 메뉴 열기/닫기 토글
  const hamburgerBtn = document.querySelector('.hamburger-btn');
  const slideMenu = document.querySelector('.slide-menu');

  hamburgerBtn.addEventListener('click', () => {
    slideMenu.classList.toggle('is-active');
    hamburgerBtn.classList.toggle('is-active');
  });

  // 2. 소분류 아코디언 메뉴 토글 (가변 길이 대응)
  const subToggleBtns = document.querySelectorAll('.toggle-sub');

  subToggleBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const menuItem = e.target.closest('.menu-item');
      menuItem.classList.toggle('is-open');
      
      // 버튼 아이콘 기호 변경 (+ / -)
      if (menuItem.classList.contains('is-open')) {
        btn.textContent = '-';
      } else {
        btn.textContent = '+';
      }
    });
  });
});


  </script>
</body>
</html>
