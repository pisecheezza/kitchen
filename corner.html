<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접힌 종이 효과</title>
<div id="treasure-hunt-component">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap');

        :root {
            --ht-flap-start: #ffffff;
            --ht-flap-end: #e8e8e8;
            --ht-hole-bg: #dcdcdc;
            --ht-modal-bg-grad-start: #dce4eb;
            --ht-modal-bg-grad-end: #f5f5f5;
            --ht-modal-inner-bg: #ffffff;
            --ht-modal-text: #333333;
            --ht-modal-subtext: #555555;
            --ht-icon-bg: #dce4eb;
            --ht-border-color: #d0d0d0;
        }

        .theme-dark, body[data-theme="dark"] {
            --ht-flap-start: #555555;
            --ht-flap-end: #333333;
            --ht-hole-bg: #2d2d2d;
            --ht-modal-bg-grad-start: #333333; 
            --ht-modal-bg-grad-end: #1a1a1a;
            --ht-modal-inner-bg: #222222;
            --ht-modal-text: #e2e8f0;
            --ht-modal-subtext: #a0aec0;
            --ht-icon-bg: #333333;
            --ht-border-color: #555;
        }

        #corner-interaction-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 150px; height: 150px;
            z-index: 9000;
            cursor: pointer;
            display: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
            user-select: none;
        }

        #corner-interaction-wrapper.is-flat { pointer-events: none; cursor: default; }

        .corner-hole {
            position: absolute; top: 0; left: 0; z-index: 1;
            width: 0; height: 0; border-style: solid;
            border-width: 0; 
            border-color: var(--ht-hole-bg) transparent transparent transparent; 
            transition: border-width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.show .corner-hole {
            border-width: 60px 60px 0 0;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .corner-hole {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        
        #corner-interaction-wrapper.is-open .corner-hole {
            border-width: 110px 110px 0 0 !important;
            border-color: var(--ht-border-color) transparent transparent transparent;
            transform: translate(0, 0);
            transition: border-width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .corner-hole { 
            border-width: 0 !important; 
            border-color: var(--ht-hole-bg) transparent transparent transparent; 
        }

        .hidden-emoji-wrapper {
            position: absolute; 
            top: -20px; left: -10px; 
            z-index: 5; 
            pointer-events: none;
            
            transform: translate(0px, 0px) scale(0.5) rotate(-15deg);
            opacity: 0;

            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }
        
        #corner-interaction-wrapper.show .hidden-emoji-wrapper {
            opacity: 0.8;
            transform: translate(-15px, -15px) scale(0.5) rotate(-15deg);
            transition-delay: 0.6s;
        }

        #corner-interaction-wrapper.is-open .hidden-emoji-wrapper {
            z-index: 20; opacity: 1;
            transform: translate(15px, 15px) scale(0.7) rotate(0deg); 
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition-delay: 0s;
        }


        #hiddenEmoji {
            font-size: 5.2rem; 
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
            display: block; transition: all 0.2s ease; 
            font-family: 'Noto Color Emoji', sans-serif;
        }
        .emoji-exit { opacity: 0 !important; transform: scale(0.1) !important; }

        .paper-flap {
            position: absolute; 
            top: -1px; left: -1px; 
            z-index: 9999;
            width: 0; height: 0;
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            background: linear-gradient(135deg, var(--ht-flap-start) 30%, var(--ht-flap-end) 100%);
            
            filter: drop-shadow(-5px -5px 8px rgba(0,0,0,0.25));
            
            transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none; border-bottom-right-radius: 3px; 
        }

        #corner-interaction-wrapper.show .paper-flap {
            width: 60px; height: 60px;
        }

        #corner-interaction-wrapper.show:not(.is-open):not(.is-flat) .paper-flap {
            animation: beckon 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        #corner-interaction-wrapper.is-open .paper-flap {
            width: 110px; height: 110px !important; 
            
            filter: drop-shadow(-8px -8px 16px rgba(0,0,0,0.35)); 
            
            transform: translate(0, 0);
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        #corner-interaction-wrapper.is-flat .paper-flap { width: 0 !important; height: 0 !important; filter: none; }

        @keyframes beckon {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, -2px); }
        }

        .ht-modal-overlay {

    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}
        .ht-modal-frame {
            background: linear-gradient(to bottom, var(--ht-modal-bg-grad-start) 0%, var(--ht-modal-bg-grad-end) 100%);
            border-radius: 0; width: 210px; min-height: 315px; 
            position: relative; display: flex; flex-direction: column; padding: 42px 10px 10px 10px; 
            animation: htSnapIn 0.2s cubic-bezier(0, 1, 0.5, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .ht-modal-header {
            position: absolute; top: 0; left: 0; width: 100%; height: 42px;
            display: flex; align-items: center; justify-content: flex-start; padding-left: 12px; 
        }
        #htModalTitle {
            color: var(--ht-modal-text); font-size: 1.15rem; font-weight: 700; 
            transform: scaleX(0.97); transform-origin: left center; letter-spacing: -0.5px; white-space: nowrap;
        }
        .ht-close-btn {
            position: absolute; right: 10px; top: 6px;
            font-family: Arial, sans-serif; font-size: 2.0rem; font-weight: 900; line-height: 1; cursor: pointer;
            color: #fff; -webkit-text-stroke: 2.5px #ff6b6b; paint-order: stroke fill;
        }
        .ht-close-btn:hover { color: #ff9999; }
        .ht-modal-inner {
            background-color: var(--ht-modal-inner-bg); border-radius: 0; flex: 1;
            display: flex; flex-direction: column; align-items: center; padding: 20px 10px 10px 15px; 
        }
        .ht-icon-box {
            width: 70px; height: 70px; 
            background-color: var(--ht-icon-bg); border: none; 
            display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
            border-radius: 0; 
        }

        .ht-modal-icon { 
            font-size: 3.5rem; 
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2)); 
            font-family: 'Noto Color Emoji', sans-serif;
        }
        .ht-modal-desc {
            font-size: 1.1rem; color: var(--ht-modal-text); line-height: 1.6; font-weight: 500; 
            word-break: keep-all; transform: scaleX(0.97); transform-origin: top center; text-align: center; margin-bottom: 15px; 
        }
        .ht-counter-box {
            margin-top: auto; background-color: var(--ht-icon-bg); color: var(--ht-modal-subtext); 
            padding: 4px 12px; font-size: 1.0rem; font-weight: 700; transform: scaleX(0.97); 
        }
        @keyframes htSnapIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>

    <div id="corner-interaction-wrapper">
        <div class="paper-flap"></div>
        <div class="hidden-emoji-wrapper">
            <span id="hiddenEmoji">❓</span>
        </div>
        <div class="corner-hole"></div>
    </div>

    <div id="itemModal" class="ht-modal-overlay">
        <div class="ht-modal-frame">
            <div class="ht-modal-header">
                <span id="htModalTitle">아이템 이름</span>
                <div class="ht-close-btn" onclick="TreasureMemory.closeModal()">&times;</div>
            </div>
            <div class="ht-modal-inner">
                <div class="ht-icon-box">
                    <span id="htModalIcon" class="ht-modal-icon"></span>
                </div>
                <div id="htModalDesc" class="ht-modal-desc"></div>
                <div id="htItemCounter" class="ht-counter-box">0 / 0 번째 기억</div>
            </div>
        </div>
    </div>

<script>
const TreasureMemory = (function() {
    const APPEAR_PROBABILITY = 0.3;
    const STORAGE_KEY = 'treasure_collected_items';
    const STORAGE_KEY_PENDING = 'treasure_pending_item';
    
    const STORAGE_KEY_FIRST_SEARCH = 'treasure_first_search_count'; 

    const itemsData = [
        { title: '◇ 낡은 동화책', icon: '📖', desc: '호기심 많은 인어와 바다를 사랑한 소녀의 우정이 담긴 동화책. 사르디나의 아이라면 누구나 한 번쯤은 듣고 자랐을 법한 이야기이다.' },
        { title: '◇ 편지가 담긴 유리병', icon: '🫙', desc: '코르크 마개로 입구가 단단히 봉인된 병. 그 안에는 해저 왕국의 오랜 친구에게 보내는, 닿을 수 없는 그리움과 안녕을 묻는 편지가 담겨 있다.' },
        { title: '◇ 오래된 편지', icon: '📜', desc: '부치지 못한 듯 서랍 깊은 곳에 남겨진 편지. \'베로니카...\'로 시작하는 첫 문장 뒤로는 온통 잉크가 번져 얼룩진 탓에 더 이상 읽을 수가 없다.' },
        { title: '◇ 작은 소라 껍데기', icon: '🐚', desc: '해변가에서 주워온 소라 껍데기. 귀를 기울이면 평범한 파도 소리 대신 다정한 목소리가 들려온다. 지친 마음을 어루만져 주는 신비한 힘이 깃들어 있는 듯하다.' },
        { title: '◇ 짚으로 짠 바구니', icon: '🧺', desc: '거친 파도를 넘어 가까스로 해변에 닿았던 작은 요람. 짠 바다 내음 대신 누군가의 품 같은 포근한 햇살 냄새가 옅게 남아 있다.' },
        { title: '◇ 선물 받은 초콜릿 상자', icon: '💝', desc: '긴 항해에서 돌아온 통령이 내 입에는 너무 달다며 건넨 상자. 행복한 순간마다 한 조각씩 꺼내 먹으며 그 기쁨이 닳지 않기를 바랐던 어린 마음이 남아있다.' },
        { title: '◇ 푸른 원석 목걸이', icon: '💠', desc: '긴 출장을 다녀온 통령이 무심하게 건넨 선물. 별것 아니라는 듯 퉁명스러운 말씨로 포장했지만, 그 뒤에는 내심 받는 이가 기뻐하기를 바라는 마음이 담겨 있다.' },
        { title: '◇ 보좌관의 명패', icon: '🏷️', desc: '사관학교 졸업 후, 파도 기사단을 거쳐 마침내 안착한 자리. 명패에 새겨진 \'통령 직속 보좌관\'이라는 직함에는 동경의 결실이 맺은 자부심마저 깃들어 있다.' },
        { title: '◇ 묵직한 동전지갑', icon: '👝', desc: '외근을 나서던 애송이에게 맛있는 거나 사 먹으라며 건넨 지갑. 고급 디저트를 잔뜩 사고도 남을 만큼의 골드가 들어 있지만, 당사자는 소소한 군것질로 만족하는 듯하다.' },
        { title: '◇ 의회당 뒷편의 고양이', icon: '🐈', desc: '점심시간만 되면 어김없이 의회당 뒷문 근처를 서성이는 녀석. 주머니에 간식을 챙겨 다니는 누군가의 발소리가 들리면 꼬리를 세우고 달려와 유독 잘 따른다.' },
        { title: '◇ 짭잘한 올리브 절임', icon: '🍸', desc: '드라이 마티니의 가니쉬. 향을 음미하며 잔을 기울이는 어른의 세계를 동경해 보지만, 달콤한 것에 익숙한 애송이가 그 깊은 맛을 알기에는 이른 듯하다.' },
        { title: '◇ 깔루아 밀크 한 잔', icon: '☕', desc: '애송이의 입맛에 맞는 달콤한 칵테일. 술 같지도 않다는 핀잔을 듣곤 하지만, 약한 사람은 한 잔만 마셔도 금세 취기로 발그레하게 물들어 버린다.' },
        { title: '◇ 숙성된 럼 한 잔', icon: '🥃', desc: '세월의 무게만큼 묵직한 술. 통령에게는 가벼운 음료겠지만 주량이 약한 애송이에게는 한 모금만으로도 세상이 빙글빙글 도는 경험을 선사한다.' },
        { title: '◇ 술 냄새 나는 쪽지', icon: '🧾', desc: '글씨체마저 비틀거리는 쪽지. \'통령님 조아해요, 히히\' 등의 문장이 적혀 있다. 다음날 이 쪽지를 발견한 본인은 쥐구멍에라도 숨고 싶었을 것이다.'},
        { title: '◇ 비품 관리 대장', icon: '📋', desc: '애송이에게 주어진 첫 업무. 깃펜의 개수부터 잉크병의 재고까지 꼼꼼하게 기록된 장부에서 동경하는 대상에게 인정받고자 했던 노력이 엿보인다.'},
        { title: '◇ 급하게 휘갈긴 경위서', icon: '📝', desc: '졸다가 실수라도 한 건지, 죄송하다는 말이 백 번쯤 적혀 있는 경위서. \'그래도 통령님 꿈을 꿔서 좋았어요...\'라는 맹랑한 변명이 덧붙여져 있다.'},
        { title: '◇ 신선한 오렌지 주스', icon: '🍊', desc: '숙취에 시달리는 애송이에게 무심한 듯 건넨 음료. 어서 정신 차리고 일이나 하라는 무언의 압박과, 그 뒤에 숨겨진 애정 어린 마음이 동시에 느껴진다.' },
        { title: '◇ 사라졌던 업무 보고서', icon: '📑', desc: '행방을 알 수 없던 업무 보고서 묶음. 산더미처럼 쌓인 서류 더미를 온종일 뒤지다 타 부서의 자료 사이에 섞여 들어가 있던 것을 겨우 발견했다.' },
        { title: '◇ 반쯤 먹은 초콜릿 쿠키', icon: '🍪', desc: '휴게실에서 몰래 가져와 야금거리던 간식. 앞섶에 떨어진 부스러기 때문에 금세 들키고 말았지만, 무슨 일인지 통령은 모른 척 넘어가 주었다.' },
        { title: '◇ 작은 해파리 모빌', icon: '🪼', desc: '창가에 걸어둔 해파리 모양의 유리 장식품. 집무실에는 영 어울리지 않는다며 핀잔을 주었지만, 이따금 바람에 흔들리는 모습을 볼 때마다 남몰래 미소를 짓곤 한다.' },
        { title: '◇ 책상 위의 화분', icon: '🪴', desc: '삭막한 집무실에 생기를 불어넣겠다며 들고 온 식물. 햇빛이 잘 드는 자리에 놓인 채, 두 사람의 애정 어린 눈길을 받으며 무럭무럭 자라고 있다.' },
        { title: '◇ 작은 업무용 수첩', icon: '🗒️', desc: '지루한 오후 업무 중 구석에 몰래 끄적였던 낙서가 보인다. 통령을 향한 애정 어린 하트나 \'저녁 뭐 먹지?\' 같은 잡념들이 적혀 있다.' },
        { title: '◇ 잉크가 묻은 만년필', icon: '🖋', desc: '꾸벅꾸벅 졸다 손에서 힘이 빠져 놓쳐버린 펜. 책상 위를 굴러가며 서류 위에 검푸른 궤적을 남겼다. 허둥지둥 닦아내려 했던 손자국마저 선명히 남아있다.' },
        { title: '◇ 손때 묻은 사르디나 지도', icon: '🗺️', desc: '산책 삼아 거닐던 해변가, 노을이 예쁜 언덕, 자주 가는 단골 바 등... 두 사람이 나란히 거닐었던 장소마다 작은 표시와 함께 짧은 메모가 남아 있다.' },
        { title: '◇ 수제 연어 샌드위치', icon: '🥪', desc: '첫 데이트를 앞두고, 설레는 마음으로 새벽부터 일어나 준비한 샌드위치. 속재료를 가득 채운 야무진 손길에서 숨길 수 없는 애정이 묻어난다.' },
        { title: '◇ 반려된 휴가 신청서', icon: '📃', desc: '반려 도장이 찍힌 휴가 신청서. \'나를 두고 어딜 혼자 가려고?\'라는 사유가 적혀 있다. 결국엔 둘이 함께 떠나는 휴가로 변경되었다.'},
        { title: '◇ 업무 지시 문서의 일부', icon: '📄', desc: '금일 14:00 정기 회의 <br> 자료 준비 건에 관하여 <br> ...(후략) <br><br> p.s.저녁으로는 무얼 먹고 싶니?'},
        { title: '◇ 꽃잎 책갈피', icon: '🌸', desc: '책상 서랍 깊은 곳에서 찾은 책갈피. \'우리의 영원한 안녕을 바라며\'라는 문구와 함께, 어느 날의 애송이가 건네주었던 꽃잎 하나가 붙어 있다.'},
        { title: '◇ 폭신한 크로핀 인형', icon: '🦭', desc: '다트 대회에서 백발백중으로 따낸 커다란 인형. 의기양양해하는 애송이를 보며, 통령의 입가에는 하루 종일 숨길 수 없는 미소가 걸려 있었다.' },
        { title: '◇ 철 지난 지역 신문', icon: '📰', desc: '여름 축제를 다룬 기사가 1면에 실려 있다. 화려한 불꽃놀이 사진 구석에, 인파를 빠져나가는 두 사람의 뒷모습이 아주 작게 찍혀 있을지도 모른다.' },
        { title: '◇ 사파이어 반지', icon: '💍', desc: '바다를 닮은 푸른 보석이 자리한 약속의 증표. 원석에 작은 흠이라도 나면 가만두지 않겠다는 엄포 속에 장인이 밤을 지새워 만들어냈다는 후문이 있다.' },
        { title: '◇ 메디치 저택의 열쇠', icon: '🗝️', desc: '두 사람이 함께 머무는 저택의 문을 여는 묵직한 열쇠. 손잡이 부분에는 가문을 상징하는 닻 문양과 함께 파도 무늬가 섬세하게 새겨져 있다.' },
        { title: '◇ 낡은 곰인형', icon: '🧸', desc: '악몽이 찾아오던 밤마다 아이의 곁을 지켜주던 애착 인형. 조심스레 품에 안겨주곤 했던 누군가의 온기를 간직한 채, 지금은 침대 머리맡에 놓여 있다.' },
        { title: '◇ 자개로 장식한 머리빗', icon: '🪮', desc: '햇빛을 받으면 자개 장식이 영롱하게 반짝이는 머리빗. 주말 아침, 길고 풍성한 금발을 조심스레 빗어줄 때면 방 안에는 기분 좋은 나른함이 감돈다.' },
        { title: '◇ 은은한 향의 바디로션', icon: '🧴', desc: '욕조에서 한바탕 물장난을 치고 나올 연인을 위해 준비된 로션. 촉촉하게 물기가 남은 살결 위로, 포근한 향과 함께 무심한 듯 다정한 손길이 닿아온다.' },
        { title: '◇ 베개 맡에 두고 간 쪽지', icon: '🛏️', desc: '먼저 일어난 이가 아직 꿈나라를 헤매는 애송이의 머리맡에 남겨둔 쪽지. \'더 자렴. 아침은 거르지 말고.\'라는 간결한 문장에서 은근한 애정이 묻어난다.'},
        { title: '◇ 서툴게 뜬 목도리', icon: '🧣', desc: '겨울 바닷바람이 차다며 애송이가 며칠 밤을 새워 뜬 삐뚤빼뚤한 목도리. 통령은 \'귀찮게 이런 걸 왜 하냐\'면서도 외출할 때면 늘 두르고 나선다.' },
        { title: '◇ 출장용 서류가방', icon: '💼', desc: '긴 출장을 떠날 때마다 챙기는 가방. 짐을 싸는 건 야무진 보좌관의 몫이 된 지 오래다. \'보고 싶을 거예요\'라고 적힌 쪽지와 계피사탕 몇 알이 필수품처럼 들어가 있다.' },
        { title: '◇ 계피 사탕 몇 알', icon: '🍬', desc: '출장 길에 필수품처럼 챙겨가는 사탕. 달짝지근하면서도 알싸한 향이 입안에 퍼질 때면, 자신을 배웅하며 손을 흔들던 울망한 얼굴이 자연스레 떠오른다.' },
        { title: '◇ 정갈한 필체의 편지', icon: '✉️', desc: '<em>...부정했던 시간이 길었던 만큼, 너를 영원히 내 곁에 두고 싶다는 욕심이 났어. 내 삶에 스며든 나의 파도야, 부디 이 닻에 오래도록 머물러 주렴.</em>' },
        { title: '◇ 동글동글한 글씨의 편지', icon: '💌', desc: '<em>...사랑해요, 나의 닻. 함께 발맞춰 걷는 이 해변의 모래사장 위에서, 우리의 그림자가 영원히 하나로 포개지기를 바라요.</em>'}
    ];

    let currentHiddenItem = null;
    const cornerWrapper = document.getElementById('corner-interaction-wrapper');
    const hiddenEmojiSpan = document.getElementById('hiddenEmoji');

    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasTriggeredOpen = false; 

    function getSeenItems() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
    }

    function markItemAsSeen(title) {
        const seen = getSeenItems();
        if (!seen.includes(title)) {
            seen.push(title);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
        }
    }

function initHiddenItem() {
        const STORAGE_KEY_SKIP_NEXT = 'treasure_skip_next';

        window.addEventListener('beforeunload', function() {
            if (localStorage.getItem(STORAGE_KEY_PENDING)) {
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
            }
            localStorage.removeItem(STORAGE_KEY_PENDING);
        });

        document.addEventListener('click', function(e) {
            const targetLink = e.target.closest('a');
            
            if (!targetLink || !targetLink.href || targetLink.target === '_blank' || targetLink.href.startsWith('javascript:')) return;

            if (cornerWrapper.classList.contains('show') && 
                !cornerWrapper.classList.contains('is-open') && 
                !cornerWrapper.classList.contains('is-flat')) {
                
                e.preventDefault(); 

                const emojiEl = document.getElementById('hiddenEmoji');
                if (emojiEl) emojiEl.classList.add('emoji-exit');
                flattenPaper();
                
                localStorage.setItem(STORAGE_KEY_SKIP_NEXT, 'true');
                localStorage.removeItem(STORAGE_KEY_PENDING);

                setTimeout(() => {
                    window.location.href = targetLink.href;
                }, 700);
            }
        });

        if (localStorage.getItem(STORAGE_KEY_SKIP_NEXT)) {
            localStorage.removeItem(STORAGE_KEY_SKIP_NEXT); 
            cornerWrapper.style.display = 'none';
            return; 
        }
        const pendingTitle = localStorage.getItem(STORAGE_KEY_PENDING);
        if (pendingTitle) {
            const found = itemsData.find(item => item.title === pendingTitle);
            if (found) {
                currentHiddenItem = found;
                displayItem(found);
                return;
            }
        }

let shouldAppear = true; // 항상 등장하도록 수정
        let currentSeenList = getSeenItems();

        // 만약 모든 아이템을 다 모았을 때 다시 처음부터 순환하게 만드는 기존 로직 유지
        if (currentSeenList.length >= itemsData.length) {
            currentSeenList = [];
            localStorage.removeItem(STORAGE_KEY);
        }

        if (currentSeenList.length >= itemsData.length) {
            currentSeenList = [];
            localStorage.removeItem(STORAGE_KEY);
        }

        const weightedPool = [];
        itemsData.forEach(item => {
            const isSeen = currentSeenList.includes(item.title);
            const weight = isSeen ? 1 : 100; 
            for(let i=0; i < weight; i++) weightedPool.push(item);
        });

        const randomIndex = Math.floor(Math.random() * weightedPool.length);
        currentHiddenItem = weightedPool[randomIndex];

        localStorage.setItem(STORAGE_KEY_PENDING, currentHiddenItem.title);
        displayItem(currentHiddenItem);
    }

    function displayItem(item) {
        hiddenEmojiSpan.innerText = item.icon;
        cornerWrapper.style.display = 'block';
        
        addInteractionEvents();

        setTimeout(() => {
            cornerWrapper.classList.add('show');
        }, 100);
    }

function addInteractionEvents() {
        cornerWrapper.addEventListener('touchstart', handleStart, {passive: false});
        cornerWrapper.addEventListener('touchmove', handleMove, {passive: false});
        cornerWrapper.addEventListener('touchend', handleEnd);

        cornerWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove); 
        window.addEventListener('mouseup', handleEnd);
        
        cornerWrapper.addEventListener('click', function(e) {
            if (!hasTriggeredOpen && isInsideCorner(e)) {
                togglePaper();
            }
        });
    }

        function isInsideCorner(e) {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return true;

        const rect = cornerWrapper.getBoundingClientRect();
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        
        const localX = clientX - rect.left;
        const localY = clientY - rect.top;

        return (localX + localY) <= 100;
    }

    function handleStart(e) {
        if (cornerWrapper.classList.contains('is-open')) return;

        if (!isInsideCorner(e)) return;

        isDragging = true;
        hasTriggeredOpen = false;

        if (e.type === 'touchstart') {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else {
            startX = e.clientX;
            startY = e.clientY;
        }
    }

    function handleMove(e) {
        if (!isDragging || hasTriggeredOpen) return;

        let currentX, currentY;

        if (e.type === 'touchmove') {
            if(e.cancelable) e.preventDefault(); 
            currentX = e.touches[0].clientX;
            currentY = e.touches[0].clientY;
        } else {
            currentX = e.clientX;
            currentY = e.clientY;
        }

        const moveX = currentX - startX;
        const moveY = currentY - startY;
        
        if ((moveX + moveY) > 50) { 
            togglePaper();
            hasTriggeredOpen = true; 
            isDragging = false; 
        }
    }

    function handleEnd(e) {
        isDragging = false;
    }

    function togglePaper() {
        if (cornerWrapper.classList.contains('is-open') || cornerWrapper.classList.contains('is-flat')) return;
        
        cornerWrapper.classList.add('is-open');

        if (currentHiddenItem) {
            markItemAsSeen(currentHiddenItem.title);
            localStorage.removeItem(STORAGE_KEY_PENDING);
        }

        setTimeout(() => {
            const emojiEl = document.getElementById('hiddenEmoji');
            if(emojiEl) emojiEl.classList.add('emoji-exit');
        }, 600);

        setTimeout(() => {
            if (currentHiddenItem) {
                const index = itemsData.indexOf(currentHiddenItem) + 1;
                const total = itemsData.length;
                openModal(currentHiddenItem.title, currentHiddenItem.icon, currentHiddenItem.desc, index, total);
            }
        }, 700);
    }

    function openModal(title, icon, desc, index, total) {
        const modal = document.getElementById('itemModal');
        document.getElementById('htModalTitle').innerText = title;
        document.getElementById('htModalIcon').innerText = icon;
        document.getElementById('htModalDesc').innerHTML = desc;

        document.getElementById('htItemCounter').innerText = `${index} / ${total} 번째 기억`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('itemModal').style.display = 'none';
        flattenPaper(); 
    }

    function flattenPaper() {
        cornerWrapper.classList.remove('is-open'); 
        cornerWrapper.classList.add('is-flat');      
    }

    return {
        init: initHiddenItem,
        closeModal: closeModal
    };
})();

window.addEventListener('load', function() {
    TreasureMemory.init();
});
    </script>
