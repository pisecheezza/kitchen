<!--
  shimeji.html — 화면을 돌아다니는 데스크톱 마스코트 위젯
  서버 필요 없음. body 끝에 이 블록을 그대로 붙여넣으면 됩니다.

  본인 스프라이트 이미지를 쓰려면 SPRITES 객체의 값을
  이모지 대신 <img src="..."> 를 넣는 img 태그 문자열로 바꾸세요.
  (움짤/스프라이트시트로 확장하려면 background-image + steps() 애니메이션 추천)
-->

<div id="shimeji" aria-hidden="true"></div>

<style>
  #shimeji {
    position: fixed;
    left: 0;
    bottom: 0;
    font-size: 40px;
    line-height: 1;
    z-index: 9999;
    pointer-events: none;
    user-select: none;
    transition: transform 0.1s linear;
    will-change: left, bottom;
  }

  #shimeji.flip { transform: scaleX(-1); }

  #shimeji.dragging {
    pointer-events: auto;
    cursor: grabbing;
  }
</style>

<script>
(function () {
  const el = document.getElementById('shimeji');
  if (!el) return;

  const SPRITES = { walk: '🐾', idle: '🐹', drag: '🙀', climb: '🐿️' };
  el.textContent = SPRITES.idle;
  el.style.pointerEvents = 'auto';
  el.style.cursor = 'grab';

  let x = 40;
  let y = 0; // bottom 기준
  let vx = 0;
  let state = 'idle';
  let stateTimer = 0;
  let dragging = false;
  let onWall = null; // 'left' | 'right' | null

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function pickState() {
    const roll = Math.random();
    if (roll < 0.4) { state = 'idle'; vx = 0; }
    else if (roll < 0.85) { state = 'walk'; vx = rand(0.6, 1.4) * (Math.random() < 0.5 ? -1 : 1); }
    else { state = 'idle'; vx = 0; }
    stateTimer = rand(2000, 5000);
    el.textContent = SPRITES[state] || SPRITES.idle;
    el.classList.toggle('flip', vx < 0);
  }

  function tick(dt) {
    if (dragging) return;

    stateTimer -= dt;
    if (stateTimer <= 0) pickState();

    const maxX = window.innerWidth - el.offsetWidth;
    x += vx * (dt / 16);

    if (x <= 0) { x = 0; vx = Math.abs(vx); el.classList.remove('flip'); }
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); el.classList.add('flip'); }

    el.style.left = x + 'px';
    el.style.bottom = y + 'px';
  }

  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;
    tick(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 드래그로 집어 옮기기
  el.addEventListener('pointerdown', (e) => {
    dragging = true;
    el.classList.add('dragging');
    el.textContent = SPRITES.drag;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    x = e.clientX - el.offsetWidth / 2;
    y = window.innerHeight - e.clientY - el.offsetHeight / 2;
    y = Math.max(0, y);
    el.style.left = x + 'px';
    el.style.bottom = y + 'px';
  });

  el.addEventListener('pointerup', () => {
    dragging = false;
    el.classList.remove('dragging');
    pickState();
  });

  pickState();
})();
</script>
