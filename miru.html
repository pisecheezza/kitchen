<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroque Noble Mansion Menu</title>
    <!-- 바로크 느낌을 살려주는 구글 우아한 세리프 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            min-height: 100vh;
            background-color: #121212;
            color: #e0d8c3;
        }

        /* 스티키 헤더 (바로크 골드 & 다크 우드 톤) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(20, 15, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 1000;
        }

        /* 햄버거 버튼 디자인 */
        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
        }

        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #d4af37; /* 금색 포인트 */
            border-radius: 2px;
            transition: background 0.3s;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.3rem;
            text-decoration: none;
            color: #d4af37;
            letter-spacing: 2px;
        }

        .header-right {
            width: 24px;
        }

        /* 햄버거 메뉴 내부 배경에 귀족 저택 이미지가 들어간 플로팅 윈도우 */
        .floating-menu {
            position: fixed;
            top: 85px;
            left: -280px; /* 숨겨진 상태 (폭을 260px로 좁힘) */
            width: 260px;
            /* 배경 이미지 + 텍스트 가독성을 위한 어두운 골드/브라운 톤 오버레이 적용 */
            background: linear-gradient(rgba(15, 10, 5, 0.88), rgba(15, 10, 5, 0.88)), 
                        url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80') no-repeat center center;
            background-size: cover;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4); /* 금빛 테두리 */
            /* 아주 느리고 우아한 글라이딩 애니메이션 */
            transition: left 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1100;
            padding: 25px 20px;
        }

        /* 메뉴가 활성화되었을 때 */
        .floating-menu.open {
            left: 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .menu-header h3 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #d4af37;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #d4af37;
            line-height: 1;
        }

        .menu-links {
            list-style: none;
        }

        .menu-links > li {
            margin-bottom: 12px;
        }

        /* 상위 메뉴 링크 */
        .menu-links a {
            text-decoration: none;
            font-size: 0.95rem;
            color: #e0d8c3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .menu-links > li > a:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            padding-left: 14px; /* 우아하게 살짝 밀려나는 효과 */
        }

        /* 드롭다운 소분류 스타일 (가변 세로 길이) */
        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease;
            padding-left: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin-top: 4px;
        }

        .has-submenu.open .submenu {
            max-height: 200px; /* 소분류가 펼쳐질 때 가변적으로 늘어나는 높이 */
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .submenu li {
            margin-bottom: 6px;
        }

        .submenu a {
            font-size: 0.85rem !important;
            color: #b3a792 !important;
            padding: 5px 8px !important;
        }

        .submenu a:hover {
            color: #d4af37 !important;
            background: none !important;
            padding-left: 12px !important;
        }

        /* 드롭다운 화살표 아이콘 회전 */
        .arrow {
            font-size: 0.7rem;
            transition: transform 0.4s ease;
            color: #d4af37;
        }

        .has-submenu.open .arrow {
            transform: rotate(180deg);
        }

        /* 배경 어둡게 처리하는 오버레이 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            z-index: 1050;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* 메인 콘텐츠 영역 */
        main {
            margin-top: 120px;
            padding: 40px 20px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .card {
            background: rgba(25, 20, 15, 0.75);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .card h1 {
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            font-size: 1.6rem;
            color: #d4af37;
            letter-spacing: 1px;
        }

        .card p {
            color: #b3a792;
            line-height: 1.8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 스티키 헤더 -->
    <header>
        <button class="hamburger-btn" id="menuOpenBtn" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="#" class="logo">Mansion de Baroque</a>
        <div class="header-right"></div>
    </header>

    <!-- 햄버거 메뉴 창 (저택 배경 이미지 포함 + 드롭다운 소분류) -->
    <nav class="floating-menu" id="floatingMenu">
        <div class="menu-header">
            <h3>MANORS</h3>
            <button class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">&times;</button>
        </div>
        <ul class="menu-links">
            <li><a href="#">대저택의 정원</a></li>
            
            <!-- 드롭다운 소분류 1 -->
            <li class="has-submenu" id="submenuToggle1">
                <a href="#none">바로크 예술품 <span class="arrow">▼</span></a>
                <ul class="submenu">
                    <li><a href="#">유화 컬렉션</a></li>
                    <li><a href="#">고전 조각상</a></li>
                    <li><a href="#">골동품 악기</a></li>
                </ul>
            </li>

            <!-- 드롭다운 소분류 2 -->
            <li class="has-submenu" id="submenuToggle2">
                <a href="#none">귀족 저택 소개 <span class="arrow">▼</span></a>
                <ul class="submenu">
                    <li><a href="#">역사적 배경</a></li>
                    <li><a href="#">건축 양식</a></li>
                    <li><a href="#">연회장 안내</a></li>
                </ul>
            </li>

            <li><a href="#">귀빈실 예약</a></li>
            <li><a href="#">오시는 길</a></li>
        </ul>
    </nav>

    <!-- 배경 오버레이 -->
    <div class="overlay" id="overlay"></div>

    <!-- 본문 내용 -->
    <main>
        <section class="card">
            <h1>Le Palais Baroque</h1>
            <p>좌측 상단의 햄버거 아이콘을 클릭해 보세요.<br>고풍스러운 저택의 실내 배경이 담긴 메뉴 창이 아주 천천히, 우아하게 밀려나옵니다.<br>카테고리를 클릭하면 소분류 메뉴가 세로 길이로 부드럽게 펼쳐집니다.</p>
        </section>
    </main>

    <!-- 인터랙션 자바스크립트 -->
    <script>
        const menuOpenBtn = document.getElementById('menuOpenBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const floatingMenu = document.getElementById('floatingMenu');
        const overlay = document.getElementById('overlay');

        // 메인 메뉴 열기/닫기
        function toggleMenu() {
            floatingMenu.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        menuOpenBtn.addEventListener('click', toggleMenu);
        menuCloseBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // 드롭다운 소분류 토글 기능 (가변 세로 길이 제어)
        const submenus = document.querySelectorAll('.has-submenu > a');
        submenus.forEach(menu => {
            menu.addEventListener('click', (e) => {
                e.preventDefault();
                const parentLi = menu.parentElement;
                parentLi.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
