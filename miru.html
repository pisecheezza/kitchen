<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroque Frame Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            min-height: 100vh;
            background-color: #0b0806;
            color: #e0d8c3;
        }

        /* 스티키 헤더 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(15, 11, 8, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 1000;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
        }

        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #d4af37;
            border-radius: 2px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.3rem;
            text-decoration: none;
            color: #d4af37;
            letter-spacing: 2px;
        }

        .header-right {
            width: 24px;
        }

        /* 9-Slice Scaling이 적용된 액자 메뉴 창 */
        .floating-menu {
            position: fixed;
            top: 90px;
            left: -320px; /* 숨겨진 상태 */
            width: 280px;
            
            /* 핵심: 액자 이미지를 9등분하여 모서리는 고정하고 중간만 반복(repeat) */
            border-image-source: url('frame.png');
            border-image-slice: 120 90 120 90 fill; /* 이미지 크기에 따라 상/우/하/좌 픽셀 조절 가능 */
            border-image-width: 45px 35px 45px 35px; /* 화면에 그려질 액자의 두께 */
            border-image-repeat: repeat; /* 세로 확장 시 중간 기둥 부분이 자연스럽게 반복됨 */
            
            /* 아주 느리고 우아한 글라이딩 애니메이션 */
            transition: left 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1100;
            padding: 30px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        /* 메뉴가 활성화되었을 때 */
        .floating-menu.open {
            left: 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        }

        .menu-header h3 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #d4af37;
            letter-spacing: 2px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #d4af37;
            line-height: 1;
        }

        .menu-links {
            list-style: none;
        }

        .menu-links > li {
            margin-bottom: 12px;
        }

        .menu-links a {
            text-decoration: none;
            font-size: 0.95rem;
            color: #e0d8c3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .menu-links > li > a:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            padding-left: 14px;
        }

        /* 소분류 드롭다운 (가변 세로 길이 대응) */
        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease;
            padding-left: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            margin-top: 4px;
        }

        .has-submenu.open .submenu {
            max-height: 200px; /* 소분류가 열릴 때 액자 전체 세로 길이가 자연스럽게 늘어남 */
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .submenu li {
            margin-bottom: 6px;
        }

        .submenu a {
            font-size: 0.85rem !important;
            color: #b3a792 !important;
            padding: 5px 8px !important;
        }

        .submenu a:hover {
            color: #d4af37 !important;
            background: none !important;
            padding-left: 12px !important;
        }

        .arrow {
            font-size: 0.7rem;
            transition: transform 0.4s ease;
            color: #d4af37;
        }

        .has-submenu.open .arrow {
            transform: rotate(180deg);
        }

        /* 배경 어둡게 처리하는 오버레이 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            z-index: 1050;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* 메인 콘텐츠 영역 */
        main {
            margin-top: 140px;
            padding: 40px 20px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .card {
            background: rgba(20, 15, 10, 0.85);
            padding: 50px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .card h1 {
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            font-size: 1.6rem;
            color: #d4af37;
            letter-spacing: 1px;
        }

        .card p {
            color: #b3a792;
            line-height: 1.8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 스티키 헤더 -->
    <header>
        <button class="hamburger-btn" id="menuOpenBtn" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="#" class="logo">Le Palais Baroque</a>
        <div class="header-right"></div>
    </header>

    <!-- 액자 이미지 배경이 적용된 플로팅 메뉴 창 -->
    <nav class="floating-menu" id="floatingMenu">
        <div class="menu-header">
            <h3>GALLERY</h3>
            <button class="close-btn" id="menuCloseBtn" aria-label="메뉴 닫기">&times;</button>
        </div>
        <ul class="menu-links">
            <li><a href="#">왕실의 정원</a></li>
            
            <!-- 드롭다운 소분류 1 -->
            <li class="has-submenu" id="submenuToggle1">
                <a href="#none">바로크 예술품 <span class="arrow">▼</span></a>
                <ul class="submenu">
                    <li><a href="#">유화 컬렉션</a></li>
                    <li><a href="#">고전 조각상</a></li>
                    <li><a href="#">골동품 악기</a></li>
                </ul>
            </li>

            <!-- 드롭다운 소분류 2 -->
            <li class="has-submenu" id="submenuToggle2">
                <a href="#none">귀족 저택 소개 <span class="arrow">▼</span></a>
                <ul class="submenu">
                    <li><a href="#">역사적 배경</a></li>
                    <li><a href="#">건축 양식</a></li>
                    <li><a href="#">연회장 안내</a></li>
                </ul>
            </li>

            <li><a href="#">귀빈실 예약</a></li>
            <li><a href="#">오시는 길</a></li>
        </ul>
    </nav>

    <!-- 배경 오버레이 -->
    <div class="overlay" id="overlay"></div>

    <!-- 본문 내용 -->
    <main>
        <section class="card">
            <h1>Le Cadre Doré</h1>
            <p>좌측 상단의 햄버거 아이콘을 눌러보세요.<br>액자의 모서리는 고정된 채, 메뉴(소분류)가 펼쳐질 때 중간 수직 기둥만 반복되며 우아하게 세로 길이가 가변적으로 늘어납니다.</p>
        </section>
    </main>

    <!-- 자바스크립트 -->
    <script>
        const menuOpenBtn = document.getElementById('menuOpenBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const floatingMenu = document.getElementById('floatingMenu');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            floatingMenu.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        menuOpenBtn.addEventListener('click', toggleMenu);
        menuCloseBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // 드롭다운 소분류 토글
        const submenus = document.querySelectorAll('.has-submenu > a');
        submenus.forEach(menu => {
            menu.addEventListener('click', (e) => {
                e.preventDefault();
                const parentLi = menu.parentElement;
                parentLi.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
