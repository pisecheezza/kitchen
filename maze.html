<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이상한 나라의 숲속 미로</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 10px;
            background: #0f2e21;
            color: #d8f3dc;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        h1 { font-size: 20px; margin: 0 0 4px 0; color: #b7e4c7; text-align: center; }
        p { font-size: 12px; color: #95d5b2; margin: 0 0 10px 0; text-align: center; }

        .game-container {
            background: #1b4332; padding: 15px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #52b788;
            max-width: 440px; width: 100%;
        }

        .grid-maze {
            display: grid;
            /* 18x18 크기의 정밀한 미로 설정 */
            grid-template-columns: repeat(18, 18px);
            grid-template-rows: repeat(18, 18px);
            gap: 1px; background: #081c15;
            padding: 6px; margin: 8px auto;
            width: fit-content; border-radius: 8px;
            border: 2px solid #52b788;
        }
        .cell {
            width: 18px; height: 18px;
            background: #d8f3dc;
            border-radius: 1px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
        }
        .wall { 
            background: #2d6a4f;
            border-radius: 2px;
        }
        .goal { 
            background: #ffb703;
            border-radius: 2px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 45px);
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }
        .ctrl-btn {
            background: #52b788; color: #081c15;
            border: none; border-radius: 10px;
            font-size: 20px; font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .ctrl-btn:active { background: #40916c; transform: scale(0.93); color: white; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .restart-btn {
            margin-top: 10px; padding: 8px 16px;
            background: #2d6a4f; color: white;
            border: 1px solid #52b788; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 13px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .restart-btn:active { background: #1b4332; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🌿 이상한 나라의 숲속 미로</h1>
        <p>👧(앨리스)를 움직여 🫖(찻주전자) 목적지에 도달하세요!</p>
        
        <div id="gridMaze" class="grid-maze"></div>

        <div class="d-pad">
            <button class="ctrl-btn btn-up" id="move-up">⬆️</button>
            <button class="ctrl-btn btn-left" id="move-left">⬅️</button>
            <button class="ctrl-btn btn-down" id="move-down">⬇️</button>
            <button class="ctrl-btn btn-right" id="move-right">➡️</button>
        </div>

        <button class="restart-btn" id="btn-restart">🔄 New Round</button>
    </div>

    <script>
        const gridContainer = document.getElementById('gridMaze');
        const restartBtn = document.getElementById('btn-restart');

        const SIZE = 15; // 미로 크기 
        let mazeMap = [];
        let player = { x: 0, y: 0 };
        let cells = [];

        function generateProceduralMaze() {
            let map;
            let goalX, goalY;

            while (true) {
                map = Array.from({ length: SIZE }, () => Array(SIZE).fill(1));

                function isValid(x, y) {
                    return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
                }

                function carve(x, y) {
                    map[y][x] = 0;

                    const directions = [
                        { dx: 0, dy: -2 },
                        { dx: 0, dy: 2 },
                        { dx: -2, dy: 0 },
                        { dx: 2, dy: 0 }
                    ].sort(() => Math.random() - 0.5);

                    for (let dir of directions) {
                        let nx = x + dir.dx;
                        let ny = y + dir.dy;

                        if (isValid(nx, ny) && map[ny][nx] === 1) {
                            map[y + dir.dy / 2][x + dir.dx / 2] = 0;
                            carve(nx, ny);
                        }
                    }
                }

                carve(0, 0);

                // 복잡도를 높이기 위해 일부 벽을 추가로 허물어 갈림길 생성
                for (let i = 1; i < SIZE - 1; i++) {
                    for (let j = 1; j < SIZE - 1; j++) {
                        if (map[i][j] === 1 && Math.random() < 0.12) {
                            map[i][j] = 0;
                        }
                    }
                }

                map[0][0] = 0;

                // 오른쪽 아래 구역에서 목적지 선정
                let availableGoals = [];
                for (let r = SIZE - 4; r < SIZE; r++) {
                    for (let c = SIZE - 4; c < SIZE; c++) {
                        if (map[r][c] === 0 && !(r === 0 && c === 0)) {
                            availableGoals.push({ r, c });
                        }
                    }
                }

                if (availableGoals.length > 0) {
                    let chosen = availableGoals[Math.floor(Math.random() * availableGoals.length)];
                    goalY = chosen.r;
                    goalX = chosen.c;
                    map[goalY][goalX] = 2;
                    break;
                }
            }

            return map;
        }

        function initMaze() {
            mazeMap = generateProceduralMaze();
            player = { x: 0, y: 0 };
            gridContainer.innerHTML = '';
            cells = [];

            // CSS Grid 스타일 동적 설정 반영
            gridContainer.style.gridTemplateColumns = `repeat(${SIZE}, 18px)`;
            gridContainer.style.gridTemplateRows = `repeat(${SIZE}, 18px)`;

            for (let r = 0; r < SIZE; r++) {
                cells[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (mazeMap[r][c] === 1) cell.classList.add('wall');
                    if (mazeMap[r][c] === 2) {
                        cell.classList.add('goal');
                        cell.innerHTML = '🫖';
                    }
                    gridContainer.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (mazeMap[r][c] !== 2) {
                        cells[r][c].innerHTML = '';
                    } else {
                        cells[r][c].innerHTML = '🫖';
                    }
                }
            }
            cells[player.y][player.x].innerHTML = '👧';
        }

        function movePlayer(dx, dy) {
            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && mazeMap[ny][nx] !== 1) {
                player.x = nx;
                player.y = ny;
                updatePlayerPosition();

                if (mazeMap[ny][nx] === 2) {
                    setTimeout(() => {
                        alert('🎉 성공! 앨리스가 무사히 다과회장에 도착했습니다!');
                        initMaze(); // 성공 시 자동으로 새로운 미로 시작
                    }, 100);
                }
            }
        }

        restartBtn.addEventListener('click', () => {
            initMaze();
        });

        document.getElementById('move-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('move-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('move-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('move-right').addEventListener('click', () => movePlayer(1, 0));

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); // 스크롤 방지
            }
            if (e.key === 'ArrowUp') movePlayer(0, -1);
            if (e.key === 'ArrowDown') movePlayer(0, 1);
            if (e.key === 'ArrowLeft') movePlayer(-1, 0);
            if (e.key === 'ArrowRight') movePlayer(1, 0);
        });

        // 페이지 진입 시 곧바로 미로 게임 시작
        window.onload = () => {
            initMaze();
        };
    </script>
</body>
</html>
