<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이상한 나라의 숲속 메뉴</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: #0f2e21; /* 깊은 숲속 야간 느낌의 배경 */
            color: #d8f3dc;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        h1 { font-size: 22px; margin-bottom: 5px; color: #b7e4c7; text-align: center; }
        p { font-size: 13px; color: #95d5b2; margin-bottom: 15px; text-align: center; padding: 0 10px; }

        /* 메인 메뉴 버튼 */
        .main-menu-btn {
            background: #2d6a4f; color: white;
            padding: 14px 28px; border-radius: 12px;
            font-size: 18px; font-weight: bold;
            border: 2px solid #52b788;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer; text-decoration: none;
            transition: all 0.2s;
        }
        .main-menu-btn:active { background: #1b4332; transform: scale(0.96); }

        /* 모달 오버레이 */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 15, 10, 0.85);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1b4332; padding: 20px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #52b788;
            max-width: 360px; width: 92%;
        }

        .modal-content h2 { margin-top: 0; color: #d8f3dc; font-size: 20px; }
        .modal-content p { font-size: 12px; color: #b7e4c7; margin-bottom: 10px; }

        /* 숲속 테마 미로 Grid (12x12) */
        .grid-maze {
            display: grid;
            grid-template-columns: repeat(12, 25px);
            grid-template-rows: repeat(12, 25px);
            gap: 1px; background: #081c15;
            padding: 6px; margin: 10px auto;
            width: fit-content; border-radius: 8px;
            border: 2px solid #52b788;
        }
        .cell {
            width: 25px; height: 25px;
            background: #d8f3dc; /* 풀밭 길 */
            border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .wall { 
            background: #2d6a4f; /* 나무 숲 벽 */
            border-radius: 3px;
        }
        .goal { 
            background: #ffb703; /* 다과회 목적지 */
            border-radius: 3px;
        }

        /* 모바일 터치 가상 방향키 패드 */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 50px);
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }
        .ctrl-btn {
            background: #52b788; color: #081c15;
            border: none; border-radius: 10px;
            font-size: 22px; font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .ctrl-btn:active { background: #40916c; transform: scale(0.93); color: white; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* 나가기 버튼 */
        .close-btn {
            margin-top: 15px; padding: 10px 20px;
            background: #d90429; color: white;
            border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .close-btn:active { background: #8d0801; }
    </style>
</head>
<body>

    <h1>🌿 이상한 나라의 숲속 메뉴</h1>
    <p>모바일 터치로 즐기는 복잡한 숲속 미로 탈출!</p>
    
    <a href="#" class="main-menu-btn" id="btn-open-maze">🌲 숲속 미로 모험 시작</a>

    <!-- 미로 모달 창 -->
    <div id="maze-modal" class="modal">
        <div class="modal-content">
            <h2>🪄 앨리스의 다과회 찾기</h2>
            <p>👧(앨리스)를 움직여 🫖(찻주전자) 목적지에 도달하세요!</p>
            
            <div id="gridMaze" class="grid-maze"></div>

            <!-- 모바일용 가상 패드 버튼 -->
            <div class="d-pad">
                <button class="ctrl-btn btn-up" id="move-up">⬆️</button>
                <button class="ctrl-btn btn-left" id="move-left">⬅️</button>
                <button class="ctrl-btn btn-down" id="move-down">⬇️</button>
                <button class="ctrl-btn btn-right" id="move-right">➡️</button>
            </div>

            <button class="close-btn" id="btn-close-maze">포기하고 나가기</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('maze-modal');
        const openBtn = document.getElementById('btn-open-maze');
        const closeBtn = document.getElementById('btn-close-maze');
        const gridContainer = document.getElementById('gridMaze');

        let mazeMap = [];
        let player = { x: 0, y: 0 };
        let cells = [];

        // 💡 DFS(깊이 우선 탐색) 알고리즘을 이용한 진짜 복잡한 무한 미로 생성 함수
        function generateProceduralMaze() {
            const size = 12;
            let map = Array.from({ length: size }, () => Array(size).fill(1)); // 1은 벽

            function isValid(x, y) {
                return x >= 0 && x < size && y >= 0 && y < size;
            }

            // DFS 길 생성 (2칸씩 건너뛰며 벽을 부수고 길을 만듦)
            function carve(x, y) {
                map[y][x] = 0; // 길로 설정

                // 상하좌우 무작위 섞기
                const directions = [
                    { dx: 0, dy: -2 },
                    { dx: 0, dy: 2 },
                    { dx: -2, dy: 0 },
                    { dx: 2, dy: 0 }
                ].sort(() => Math.random() - 0.5);

                for (let dir of directions) {
                    let nx = x + dir.dx;
                    let ny = y + dir.dy;

                    if (isValid(nx, ny) && map[ny][nx] === 1) {
                        // 중간 벽도 함께 뚫어줌
                        map[y + dir.dy / 2][x + dir.dx / 2] = 0;
                        carve(nx, ny);
                    }
                }
            }

            // (0,0)에서 출발
            carve(0, 0);

            // 미로가 너무 꼬여서 막힌 길이 많을 때를 대비해 무작위로 길을 조금 더 뚫어줌 (선택사항)
            for (let i = 1; i < size - 1; i++) {
                for (let j = 1; j < size - 1; j++) {
                    if (map[i][j] === 1 && Math.random() < 0.1) {
                        map[i][j] = 0;
                    }
                }
            }

            map[0][0] = 0;   // 시작점 안전 확보
            map[size - 1][size - 1] = 2; // 도착점(찻주전자) 설정
            return map;
        }

        function initMaze() {
            mazeMap = generateProceduralMaze();
            player = { x: 0, y: 0 };
            gridContainer.innerHTML = '';
            cells = [];

            for (let r = 0; r < 12; r++) {
                cells[r] = [];
                for (let c = 0; c < 12; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (mazeMap[r][c] === 1) cell.classList.add('wall');
                    if (mazeMap[r][c] === 2) {
                        cell.classList.add('goal');
                        cell.innerHTML = '🫖';
                    }
                    gridContainer.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            for (let r = 0; r < 12; r++) {
                for (let c = 0; c < 12; c++) {
                    if (mazeMap[r][c] !== 2) {
                        cells[r][c].innerHTML = '';
                    } else {
                        cells[r][c].innerHTML = '🫖';
                    }
                }
            }
            cells[player.y][player.x].innerHTML = '👧';
        }

        function movePlayer(dx, dy) {
            if (modal.style.display !== 'flex') return;
            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx >= 0 && nx < 12 && ny >= 0 && ny < 12 && mazeMap[ny][nx] !== 1) {
                player.x = nx;
                player.y = ny;
                updatePlayerPosition();

                if (mazeMap[ny][nx] === 2) {
                    setTimeout(() => {
                        alert('🎉 성공! 앨리스가 무사히 다과회장에 도착했습니다!');
                        modal.style.display = 'none';
                    }, 100);
                }
            }
        }

        openBtn.addEventListener('click', (e) => {
            e.preventDefault();
            modal.style.display = 'flex';
            initMaze();
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.getElementById('move-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('move-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('move-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('move-right').addEventListener('click', () => movePlayer(1, 0));

        window.addEventListener('keydown', (e) => {
            if (modal.style.display !== 'flex') return;
            if (e.key === 'ArrowUp') movePlayer(0, -1);
            if (e.key === 'ArrowDown') movePlayer(0, 1);
            if (e.key === 'ArrowLeft') movePlayer(-1, 0);
            if (e.key === 'ArrowRight') movePlayer(1, 0);
        });
    </script>
</body>
</html>
