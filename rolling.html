
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롤링 페이퍼</title>
    <!-- 여기에 CSS 스타일을 넣거나 <link> 태그로 연결하세요 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 롤링 페이퍼 뷰 컨테이너 -->
<div id="view-hbd" class="section-view active">
    <!-- 로딩 스피너 -->
    <div id="hbdLoader" class="hbd-loader" style="display: none;">
        <div class="spinner"></div>
        <p>전서구를 불러오는 중입니다...</p>
    </div>

    <!-- 롤링 페이퍼 벽 (그리드 영역) -->
    <div id="hbdWall" class="hbd-wall">
        <!-- JS에 의해 포스트잇, 엽서, 스티커들이 동적으로 채워집니다 -->
    </div>
</div>

<!-- 상세 내용 확인 모달 (포스트잇 / 엽서 클릭 시) -->
<div id="hbdModal" class="hbd-modal">
    <div class="hbd-modal-card">
        <button class="modal-close" onclick="closeModal('hbdModal')">&times;</button>
        <div id="hbdModalContent">
            <!-- 모달 내부 콘텐츠가 동적으로 채워집니다 -->
        </div>
    </div>
</div>

<!-- 이미지 확대 라이트박스 모달 -->
<div id="imageModal" class="image-modal">
    <button class="modal-close" onclick="closeModal('imageModal')">&times;</button>
    <div class="image-modal-content">
        <!-- 이미지 및 슬라이드 버튼 등 -->
    </div>
</div>

<!-- 글쓰기 모달 (+) -->
<div id="writeModal" class="write-modal">
    <!-- 글쓰기 폼 내용 -->
</div>

<style>
  /* ==========================================
   1. 롤링 페이퍼 뷰 & 그리드 벽 스타일
   ========================================== */
.section-view {
    display: none;
    width: 100%;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}
.section-view.active {
    display: block;
}

.hbd-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    gap: 15px;
    color: #666;
}

.hbd-wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    box-sizing: border-box;
}

/* ==========================================
   2. 포스트잇 & 엽서 & 스티커 공통 스타일
   ========================================== */
.post-it, .postcard {
    position: relative;
    padding: 16px;
    border-radius: 4px;
    box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    min-height: 200px;
}

.post-it:hover, .postcard:hover {
    transform: scale(1.03) rotate(0deg) !important;
    box-shadow: 4px 8px 16px rgba(0, 0, 0, 0.15);
    z-index: 10;
}

/* 포스트잇 색상 테마 */
.post-it.yellow {
    background-color: #fff9c4;
    border-bottom: 4px solid #fbc02d;
}
.post-it.pink {
    background-color: #f8bbd0;
    border-bottom: 4px solid #f48fb1;
}
.post-it.white {
    background-color: #ffffff;
    border: 2px dashed #ccc;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: #888;
}
.post-it.admin-post {
    background-color: #e8eaf6;
    border-bottom: 4px solid #7986cb;
}

/* 포스트잇 내부 텍스트 박스 */
.post-it-content-box {
    position: relative;
    flex-grow: 1;
    overflow: hidden;
    max-height: 130px;
}
.post-it-text-inner {
    font-size: 0.95rem;
    line-height: 1.4;
    color: #333;
    word-break: break-all;
}

/* 엽서 스타일 */
.postcard {
    background-color: #fafafa;
    padding: 10px;
    border: 1px solid #ddd;
    border-bottom: 6px solid #ccc;
}
.postcard img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 2px;
}
.postcard-from {
    text-align: right;
    margin-top: 8px;
    color: #555;
}

/* 스티커 스타일 */
.hbd-sticker {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
}
.hbd-sticker img {
    max-width: 120px;
    max-height: 120px;
    object-fit: contain;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
}

/* ==========================================
   3. 모달 레이아웃 스타일
   ========================================== */
.hbd-modal, .image-modal, .write-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.hbd-modal.open, .image-modal.open, .write-modal.open {
    display: flex;
}

.hbd-modal-card {
    background: #fff;
    width: 90%;
    max-width: 400px;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
    box-sizing: border-box;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
}

.modal-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
}

.hbd-modal-msg {
    margin-top: 15px;
    margin-bottom: 15px;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.5;
    color: #333;
}

.hbd-modal-sender {
    text-align: right;
    color: #666;
    border-top: 1px solid #eee;
    padding-top: 10px;
}

/* 엽서 모드 모달 내 이미지 그리드 */
.hbd-modal-img-container {
    display: grid;
    gap: 8px;
    margin-bottom: 10px;
}
.hbd-modal-img-container[data-count="1"] { grid-template-columns: 1fr; }
.hbd-modal-img-container[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
.hbd-modal-img-container[data-count="3"], 
.hbd-modal-img-container[data-count="4"] { grid-template-columns: repeat(2, 1fr); }

.hbd-modal-img-wrapper {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 1;
}
.hbd-modal-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
}
</style>


<script>
// ==========================================
// 1. 설정 및 전역 변수
// ==========================================
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzISeiBPtACvpocE4S3INgb2btygcrtnzoywq7mNuUMufR6CDkI3vou8g_DxnCq1FY/exec'; 
let hbdDataLoaded = false;
let hbdImageList = []; 
let currentHbdImgIndex = 0; 
let currentModalImages = []; 

// 폰트 매핑 테이블
const fontMap = {
    '어린이': 'YunChorokwoosanEoriniMinguk',
    '손글씨1': 'OngleipMugung',
    '손글씨2': 'OngleipRyudung',
    '손글씨3': 'OngleipYoonwoo',
    '영웅1': 'KyoboHandwriting2020ParkDoYeon',
    '로드': 'SimGyeongha',
    '시스템': 'Umdot',
    '온달': 'YesMyungjo',
    '브랜든': 'KimJeongCheolHandwriting',
    '로잔나': 'KyoboHandwriting2021Seongjiyoung'
};

// ==========================================
// 2. 유틸리티 함수
// ==========================================
window.checkPostItOverflow = function() {
    const contentBoxes = document.querySelectorAll('.post-it-content-box');
    contentBoxes.forEach(box => {
        const textHeight = box.children[0] ? box.children[0].scrollHeight : box.scrollHeight;
        const boxHeight = box.clientHeight;
        if (textHeight > boxHeight + 5) {
            box.classList.add('is-overflowing');
        } else {
            box.classList.remove('is-overflowing');
        }
    });
};

function getColorFromText(text) {
    let sum = 0;
    if (!text) return 'yellow';
    for (let i = 0; i < text.length; i++) {
        sum += text.charCodeAt(i);
    }
    return (sum % 7 < 4) ? 'pink' : 'yellow';
}

function getRotationFromText(text) {
    if (!text) return 0;
    let sum = 0;
    for (let i = 0; i < text.length; i++) {
        sum += text.charCodeAt(i);
    }
    return (Math.sin(sum * 12345) * 2).toFixed(1); 
}

function parseImageUrl(rawUrl) {
    if (!rawUrl) return '';
    let url = rawUrl.trim();

    if (url.includes('drive.google.com')) {
        let fileId = '';
        if (url.includes('id=')) {
            fileId = url.split('id=')[1].split('&')[0];
        } else if (url.includes('file/d/')) {
            fileId = url.split('file/d/')[1].split('/')[0];
        }
        if (fileId) {
            return `https://lh3.googleusercontent.com/d/${fileId}`;
        }
    }

    if (url.startsWith('http')) return url;
    if (url.startsWith('assets/images/')) return url;
    return `assets/images/${url}`;
}

// ==========================================
// 3. 데이터 로드 및 렌더링
// ==========================================
function loadHbdData() {
    const wall = document.getElementById('hbdWall');
    const loader = document.getElementById('hbdLoader');
    const hbdView = document.getElementById('view-hbd');
        
    wall.style.display = 'none';
    loader.style.display = 'flex';

    if (GOOGLE_SHEET_URL) {
        fetch(GOOGLE_SHEET_URL)
            .then(res => res.json())
            .then(data => {
                renderHbdWall(data);
                hbdDataLoaded = true;
                                 
                setTimeout(() => {
                    loader.style.display = 'none';
                    wall.style.display = 'grid';
                    window.checkPostItOverflow(); 
                }, 2000);
            })
            .catch(err => {
                console.error('Data Load Error:', err);
                loader.style.display = 'none';
                hbdDataLoaded = false; 
                if (typeof showToast === 'function') {
                    showToast("네트워크 연결이 원활하지 않습니다. <br> 다른 메뉴를 눌렀다 다시 진입해 주세요.");
                }
            });
    } else {
        setTimeout(() => {
            if (typeof dummyHbdData !== 'undefined') renderHbdWall(dummyHbdData);
            hbdDataLoaded = true;
            loader.style.display = 'none';
            wall.style.display = 'grid';
            window.checkPostItOverflow();
        }, 2000);
    }
}

function renderHbdWall(data) {
    const wall = document.getElementById('hbdWall');
    wall.innerHTML = '';

    const sticker1 = { type: 'sticker', image: 'assets/images/bday_sd_water_rosanna_illust.png' };
    const sticker2 = { type: 'sticker', image: 'assets/images/bday_sd_dark_rosanna_illust.png' };
    const sticker3 = { type: 'sticker', image: 'assets/images/bday_sd_fire_rosanna_illust.png' }; 
    const sticker4 = { type: 'sticker', image: 'assets/images/bday_sd_light_rosanna_illust.png' };
    const sticker5 = { type: 'sticker', image: 'assets/images/sd_summer_stiker.png' }; 

    const stickers = [sticker1, sticker2, sticker3, sticker4, sticker5];
    const insertPositions = [1, 7, 14, 22, 29];

    for (let i = 0; i < stickers.length; i++) {
        let targetIndex = insertPositions[i] + i;
        if (data.length >= targetIndex) {
            data.splice(targetIndex, 0, stickers[i]);
        } else {
            data.push(stickers[i]); 
        }
    }

    hbdImageList = [];

    data.forEach((item, index) => {
        const div = document.createElement('div');
        const rotateText = item.message || item.sender || `sticker_magic_${index}`;
        const rotate = getRotationFromText(rotateText);

        const fontName = item.font ? item.font.trim() : '손글씨1';
        const fontClass = `font-${fontName}`; 
        const realFontFamily = fontMap[fontName] || 'OngleipKimkonghae';

        if (item.type === 'sticker') {
            div.className = 'hbd-sticker';
            div.style.transform = `rotate(${rotate * 1.5}deg)`;
                        
            const img = document.createElement('img');
            img.onerror = function() { this.style.display = 'none'; }; 
            
            if (typeof loadAsBlob === 'function') {
                loadAsBlob(item.image, img);
            } else {
                img.src = item.image;
            }
                         
            div.appendChild(img);
        }
        else if (item.type === 'image') {
            div.className = `postcard ${fontClass}`; 
            div.style.transform = `rotate(${rotate}deg)`;

            const img = document.createElement('img');
            let imageList = [];
            if (item.image) {
                imageList = item.image.split(',').map(url => parseImageUrl(url));
            }

            if (imageList.length > 0) {
                hbdImageList.push(...imageList);
                img.src = imageList[0];
            } else {
                img.src = 'https://via.placeholder.com/300?text=No+Image';
            }

            img.onerror = function() { 
                this.onerror = null;
                this.src = 'https://i.imgur.com/0j1WzSz.png';
            };

            div.appendChild(img);

            const fromDiv = document.createElement('div');
            fromDiv.className = 'postcard-from';
            fromDiv.style.fontFamily = `"${realFontFamily}", cursive`;
            fromDiv.style.fontSize = `calc(1.1rem * var(--font-scale, 1))`;
            fromDiv.innerText = `From. ${item.sender}`;
            div.appendChild(fromDiv);

            div.onclick = () => openHbdModal('image', item, null, fontClass);
        }
        else {
            let displayMessage = item.message || "";
            let colorClass = "";
            
            if (displayMessage.startsWith("!admin:")) {
                displayMessage = displayMessage.replace("!admin:", "").trim(); 
                colorClass = "admin-post";
            } else {
                colorClass = getColorFromText(displayMessage || item.sender);
            }

            div.className = `post-it ${colorClass} ${fontClass}`; 
            div.style.transform = `rotate(${rotate}deg)`;
            div.dataset.color = colorClass; 

            const senderHtml = `
                <div style="text-align: right; margin-top: 10px; padding-right: 10px; color: #666; line-height: 0.8; word-break: keep-all; flex-shrink: 0;">
                    <span style="font-size:calc(0.9rem * var(--font-scale, 1)); opacity:0.8; margin-right: 0.1px;">From.</span>
                    <span style="font-size:calc(1.0rem * var(--font-scale, 1));">${item.sender}</span>
                </div>
            `;

            div.innerHTML = `
                <div class="post-it-content-box">
                    <div class="post-it-text-inner">
                        ${displayMessage}
                    </div>
                </div>
                ${senderHtml}
            `;

            div.onclick = () => openHbdModal('text', { ...item, message: displayMessage }, colorClass, fontClass);
        }
                
        wall.appendChild(div);
    });

    // 글쓰기(+) 버튼 추가
    const addBtn = document.createElement('div');
    addBtn.className = 'post-it white';
    addBtn.innerHTML = '<span>+</span>';
    addBtn.onclick = () => {
        const writeModal = document.getElementById('writeModal');
        if (!writeModal) return;
        
        writeModal.style.display = 'flex';
        setTimeout(() => { writeModal.classList.add('open'); }, 10);
        if (typeof pushModal === 'function') pushModal('writeModal');
    };
    wall.appendChild(addBtn);
}

// ==========================================
// 4. 모달 관리 함수
// ==========================================
function openHbdModal(type, item, colorClass, fontClass) {
    const modal = document.getElementById('hbdModal');
    if (!modal) return;
    
    const card = modal.querySelector('.hbd-modal-card');
    const content = document.getElementById('hbdModalContent');
    const closeBtn = card.querySelector('.modal-close');

    card.className = 'hbd-modal-card'; 
    if (fontClass) card.classList.add(fontClass);
    content.innerHTML = ''; 

    const msgDiv = document.createElement('div');
    msgDiv.className = 'hbd-modal-msg';
    msgDiv.style.overflowY = 'auto'; 

    const msgContent = document.createElement('div'); 
    msgContent.className = 'hbd-modal-msg-content';
    msgContent.innerText = item.message;
    msgDiv.appendChild(msgContent);

    const senderDiv = document.createElement('div');
    senderDiv.className = 'hbd-modal-sender';
    senderDiv.innerHTML = `<span style="font-size:0.8em; opacity:0.8; margin-right: 4px;">From.</span><span style="font-size:1.1em; word-break: keep-all;">${item.sender}</span>`;

    if (type === 'image') {
        card.classList.add('postcard-mode');
        closeBtn.style.color = '#333';

        const imgContainer = document.createElement('div');
        imgContainer.className = 'hbd-modal-img-container';

        let imageList = [];
        if (item.image) imageList = item.image.split(',').map(url => parseImageUrl(url));
        if (imageList.length === 0) imageList.push('https://via.placeholder.com/300?text=No+Image');

        currentModalImages = imageList.slice(0, 4);
        imgContainer.setAttribute('data-count', currentModalImages.length);

        currentModalImages.forEach((imgUrl) => {
            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'hbd-modal-img-wrapper';

            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'hbd-modal-img';
            img.onclick = () => openHbdImageModal(imgUrl);

            img.onerror = function() {
                this.onerror = null; 
                this.src = 'https://i.imgur.com/0j1WzSz.png';
            };

            imgWrapper.appendChild(img);
            imgContainer.appendChild(imgWrapper);
        });

        content.appendChild(imgContainer);
        msgDiv.style.textAlign = 'center'; 
        content.appendChild(msgDiv);
        content.appendChild(senderDiv);
    } else {
        card.classList.add(`postit-${colorClass}`);
        closeBtn.style.color = '#555';
        content.appendChild(msgDiv);
        content.appendChild(senderDiv);
    }

    modal.classList.add('open');
    if (typeof pushModal === 'function') pushModal('hbdModal');
}

function openHbdImageModal(src) {
    const modal = document.getElementById('imageModal');
    if (!modal) return;

    const cleanSrc = src.trim(); 
    currentHbdImgIndex = hbdImageList.findIndex(item => item.trim() === cleanSrc);
    if (currentHbdImgIndex === -1) currentHbdImgIndex = 0;

    window.isHbdMode = true; 
    
    if (typeof updateModalImage === 'function') {
        updateModalImage(cleanSrc); 
    }
    
    modal.classList.add('open');
    if (typeof showModalUI === 'function') showModalUI(); 
    if (typeof pushModal === 'function') pushModal('imageModal');
}
</script>
</body>
</html>
