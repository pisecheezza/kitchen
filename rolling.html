<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanted</title></title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #e0c9a6; margin: 0; padding: 0; }
        .section-view { display: none; width: 100%; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .section-view.active { display: block; }
        .hbd-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 15px; color: #666; }
        .hbd-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px; box-sizing: border-box; }
        
        .post-it, .postcard {
            position: relative; padding: 16px; border-radius: 4px; box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; min-height: 200px;
        }
        .post-it.yellow { background-color: #fff9c4; border-bottom: 4px solid #fbc02d; }
        .post-it.pink { background-color: #f8bbd0; border-bottom: 4px solid #f48fb1; }
        .post-it.white { background-color: #ffffff; border: 2px dashed #ccc; align-items: center; justify-content: center; font-size: 3rem; color: #888; }
        .post-it-content-box { flex-grow: 1; overflow: hidden; max-height: 130px; }
        .post-it-text-inner { font-size: 0.95rem; line-height: 1.4; color: #333; word-break: break-all; }
        .postcard { background-color: #fafafa; padding: 10px; border: 1px solid #ddd; border-bottom: 6px solid #ccc; }
        .postcard img { width: 100%; height: 140px; object-fit: cover; border-radius: 2px; }
        .postcard-from { text-align: right; margin-top: 8px; color: #555; }

        /* 모달 디자인 공통 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.open { display: flex; }
        .hbd-modal-card, .write-modal-card {
            background: #fff; width: 90%; max-width: 450px; padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; box-sizing: border-box; max-height: 90vh; overflow-y: auto;
        }
        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        /* 방명록 작성 모달 세부 스타일 */
        .write-modal-header { margin-bottom: 20px; }
        .write-modal-title { margin: 0 0 12px 0; font-size: 1.2rem; color: #333; }
        .write-tabs { display: flex; gap: 8px; }
        .write-tab-btn { flex: 1; padding: 8px; border: 1px solid #ddd; background: #f5f5f5; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .write-tab-btn.active { background: #333; color: #fff; border-color: #333; }
        .write-input-group { margin-bottom: 16px; }
        .write-input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #555; }
        .write-input, .write-textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        .write-textarea { resize: vertical; min-height: 100px; }
        .write-submit-btn { width: 100%; padding: 12px; background: #2b6cb0; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .write-submit-btn:hover { background: #2c5282; }
        .file-hint { font-size: 0.75rem; color: #e53e3e; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- 롤링 페이퍼 뷰 -->
    <div id="view-hbd" class="section-view active">
        <div id="hbdLoader" class="hbd-loader"><p>Loading...</p></div>
        <div id="hbdWall" class="hbd-wall" style="display: none;"></div>
    </div>

    <!-- 방명록 작성 모달 -->
    <div class="modal-overlay" id="writeModal">
        <div class="write-modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeWriteModal()">×</button>
            <div class="write-modal-header">
                <h3 class="write-modal-title">メッセージを残してください。</h3>
                <div class="write-tabs">
                    <button class="write-tab-btn active" id="tabText" onclick="switchWriteMode('text')">送る</button>
                    <button class="write-tab-btn" id="tabImage" onclick="switchWriteMode('image')">描く</button>
                </div>
            </div>
            <div class="write-modal-body">
                <div class="write-input-group">
                    <label>送り手</label>
                    <input type="text" id="writeSender" class="write-input" placeholder="領民" maxlength="20">
                </div>
                <div class="write-input-group">
                    <label>何で各課</label>
                    <select id="writeFont" class="write-input">
                        <option value="손글씨1">手書き（基本）</option>
                        <option value="손글씨2">手書き２</option>
                        <option value="손글씨3">手書き３</option>
                        <option value="로드">旅人</option>
                        <option value="시스템">使用人</option>
                    </select>
                </div>
                <div class="write-input-group" id="fileGroup" style="display: none;">
                    <label>イラスト(必修)</label>
                    <input type="file" id="writeFile" class="write-input" accept=".png">
                    <div class="file-hint">* .png のみ登録可能. (URLもOK)</div>
                </div>
                <div class="write-input-group">
                    <label>伯爵様に話したい事<span id="msgRequired">(必修)</span></label>
                    <textarea id="writeMessage" class="write-textarea" placeholder="メッセージを入力してください。" maxlength="150"></textarea>
                </div>
                <div class="write-modal-footer" style="margin-top: 20px;">
                    <button class="write-submit-btn" id="submitBtn" onclick="submitHbdMessage()">壁に貼る。</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbwp8YW3ctYY4PeRX7V5tHRvURdBg6W3vF268XN6UC3HATiiKGVGkKD0ETq_cmWSuPC0Hw/exec'; 
        let currentWriteMode = 'text'; // 'text' 또는 'image'

        window.onload = function() {
            loadHbdData();
        };

        // 작성 모드 전환 (텍스트 vs 이미지)
        function switchWriteMode(mode) {
            currentWriteMode = mode;
            document.getElementById('tabText').classList.toggle('active', mode === 'text');
            document.getElementById('tabImage').classList.toggle('active', mode === 'image');
            document.getElementById('fileGroup').style.display = (mode === 'image') ? 'block' : 'none';
        }

        function closeWriteModal() {
            document.getElementById('writeModal').classList.remove('open');
        }

        // 구글 시트 데이터 불러오기
        function loadHbdData() {
            const wall = document.getElementById('hbdWall');
            const loader = document.getElementById('hbdLoader');
            
            wall.style.display = 'none';
            loader.style.display = 'flex';

            if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.trim() !== '') {
                fetch(GOOGLE_SHEET_URL)
                    .then(res => res.json())
                    .then(data => {
                        renderHbdWall(data);
                        loader.style.display = 'none';
                        wall.style.display = 'grid';
                    })
                    .catch(err => {
                        console.error('Data Load Error:', err);
                        loader.style.display = 'none';
                        renderHbdWall([]); // 에러 시 빈 벽 + 글쓰기 버튼만 표시
                    });
            } else {
                loader.style.display = 'none';
                wall.style.display = 'grid';
                renderHbdWall([]); // URL 미설정 시 테스트용 빈 벽
            }
        }

        // 월(Wall) 렌더링
        function renderHbdWall(data) {
            const wall = document.getElementById('hbdWall');
            wall.innerHTML = '';

            data.forEach((item, index) => {
                const div = document.createElement('div');
                if (item.type === 'image') {
                    div.className = 'postcard';
                    div.innerHTML = `<img src="${item.image || 'https://via.placeholder.com/300'}" alt="postcard"><div class="postcard-from">From. ${item.sender}</div>`;
                } else {
                    div.className = 'post-it yellow';
                    div.innerHTML = `
                        <div class="post-it-content-box"><div class="post-it-text-inner">${item.message}</div></div>
                        <div style="text-align: right; margin-top: 10px; color: #666; font-size: 0.9rem;">From. ${item.sender}</div>
                    `;
                }
                wall.appendChild(div);
            });

            // 글쓰기 (+) 버튼 추가
            const addBtn = document.createElement('div');
            addBtn.className = 'post-it white';
            addBtn.innerHTML = '<span>+</span>';
            addBtn.onclick = () => {
                 document.getElementById('writeModal').classList.add('open');
            };
            wall.appendChild(addBtn);
        }

        // 메시지 전송 함수
        function submitHbdMessage() {
            const sender = document.getElementById('writeSender').value.trim() || '領民';
            const font = document.getElementById('writeFont').value;
            const message = document.getElementById('writeMessage').value.trim();
            const fileInput = document.getElementById('writeFile');

            if (currentWriteMode === 'text' && !message) {
                alert("メッセージを残してください。");
                return;
            }
            if (currentWriteMode === 'image' && fileInput.files.length === 0) {
                alert("描くイラストを残して下さい。");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "残す中...";

            let imageUrl = '';
            if (currentWriteMode === 'image') {
                // 실무 환경에서는 이미지 파일 업로드 서버(Imgur API 등)를 거쳐 URL을 받아와야 합니다.
                // 여기서는 테스트를 위해 임시로 파일 이름을 대체합니다.
                imageUrl = 'https://via.placeholder.com/300?text=' + encodeURIComponent(fileInput.files[0].name);
            }

            const postData = {
                type: currentWriteMode,
                sender: sender,
                font: font,
                message: message,
                image: imageUrl
            };

            if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.trim() !== '') {
                fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    body: JSON.stringify(postData)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.result === 'success') {
                        alert("壁に完璧に貼り付けました！");
                        closeWriteModal();
                        loadHbdData(); // 새로고침
                    } else {
                        alert("전송 실패: " + res.error);
                    }
                })
                .catch(err => {
                    alert("壁が滑らかじゃなくて貼れません。");
                    console.error(err);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "壁に貼る。";
                });
            } else {
                alert("[테스트 모드] 구글 시트 URL이 설정되지 않아 데이터가 저장되지 않습니다.");
                submitBtn.disabled = false;
                submitBtn.innerText = "壁に貼る。";
                closeWriteModal();
            }
        }
    </script>
</body>
</html>
